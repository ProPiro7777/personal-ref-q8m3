 game_assistant_hoi4_general_text:0 "[game_assistant_hoi4_general_text_scripted_loc]"
 

 game_assistant_hoi4_general_text_scripted_loc1:0 "斯大林格勒战役中，苏军部分狙击手在射击前会含一口雪，避免严寒呼出的雾气暴露自身位置。"
 game_assistant_hoi4_general_text_scripted_loc2:0 "1940年敦刻尔克大撤退，9天撤走近34万盟军士兵，英法动用大量民船参与。"
 game_assistant_hoi4_general_text_scripted_loc3:0 "不列颠空战中，英国雷达系统预警发挥关键作用，德军损失近2000架飞机。"
 game_assistant_hoi4_general_text_scripted_loc4:0 "1941年12月7日日本偷袭珍珠港，击沉击伤美战列舰8艘，美太平洋舰队暂时瘫痪。"
 game_assistant_hoi4_general_text_scripted_loc5:0 "中途岛海战中美军破译日军密码，击沉日军四艘主力航母，扭转太平洋战局。"
 game_assistant_hoi4_general_text_scripted_loc6:0 "斯大林格勒战役历时半年多，双方总伤亡约200万人，德军第6集团军覆灭。"
 game_assistant_hoi4_general_text_scripted_loc7:0 "库尔斯克会战为史上最大坦克战，苏德投入约6000辆坦克，德军攻势失利。"
 game_assistant_hoi4_general_text_scripted_loc8:0 "列宁格勒围城持续872天，平民因饥饿与炮击死亡约100万人。"
 game_assistant_hoi4_general_text_scripted_loc9:0 "华沙起义中波兰地下军坚持63天，约20万波兰人死亡，华沙城被摧毁。"
 game_assistant_hoi4_general_text_scripted_loc10:0 "南京大屠杀中，日军在6周内杀害大量平民和战俘，远东国际法庭认定遇难人数超30万。"
 game_assistant_hoi4_general_text_scripted_loc11:0 "奥斯维辛集中营是纳粹最大灭绝营，约110万人丧生，多为犹太人。"
 game_assistant_hoi4_general_text_scripted_loc12:0 "德军虎I坦克前装甲厚100毫米，装备88毫米炮，重57吨，但机动性差，故障多。"
 game_assistant_hoi4_general_text_scripted_loc13:0 "苏联T-34坦克采用倾斜装甲，有效提升防护，76.2毫米炮和宽履带适合恶劣地形。"
 game_assistant_hoi4_general_text_scripted_loc14:0 "德国MP40冲锋枪产量约100万支，使用折叠枪托，结构简单，供弹为32发弹匣。"
 game_assistant_hoi4_general_text_scripted_loc15:0 "苏联PPSh-41冲锋枪采用71发弹鼓，射速高，生产简易，战时制造约600万支。"
 game_assistant_hoi4_general_text_scripted_loc16:0 "StG44突击步枪是第一支大规模装备的突击步枪，使用7.92×33毫米短弹，影响后世。"
 game_assistant_hoi4_general_text_scripted_loc17:0 "MG42通用机枪射速达1200发/分，枪管可快换，声音撕裂，被称“希特勒电锯”。"
 game_assistant_hoi4_general_text_scripted_loc18:0 "美M1加兰德步枪采用8发漏夹，半自动射击，弹尽时漏夹弹出并发出“叮”声。"
 game_assistant_hoi4_general_text_scripted_loc19:0 "零式战斗机为追求航程牺牲装甲与自封油箱，早期机动性突出，后期成易损火球。"
 game_assistant_hoi4_general_text_scripted_loc20:0 "德军Me 262是世界首款实战喷气战斗机，速度优于活塞飞机，但引擎寿命短。"
 game_assistant_hoi4_general_text_scripted_loc21:0 "美军B-29超级堡垒轰炸机可高空投弹，载弹量9吨，广岛长崎原子弹由其投下。"
 game_assistant_hoi4_general_text_scripted_loc22:0 "德国V-2火箭是首枚弹道导弹，采用液氧酒精推进，速度超音速，但精度低。"
 game_assistant_hoi4_general_text_scripted_loc23:0 "美国“曼哈顿计划”耗资约20亿美元，成功研制三枚核弹，其中两颗用于实战。"
 game_assistant_hoi4_general_text_scripted_loc24:0 "1945年广岛原子弹“小男孩”当量约1.5万吨TNT，导致约14万人死亡。"
 game_assistant_hoi4_general_text_scripted_loc25:0 "长崎原子弹“胖子”钚弹当量约2.1万吨，目标本是小仓，因云层转投长崎。"
 game_assistant_hoi4_general_text_scripted_loc26:0 "东京大轰炸中，1945年3月9-10日，美军投燃烧弹造成约10万人死亡，城市大面积烧毁。"
 game_assistant_hoi4_general_text_scripted_loc27:0 "波兰战役中，波兰骑兵旅装备反坦克步枪与火炮，传闻骑兵砍坦克为不实描述。"
 game_assistant_hoi4_general_text_scripted_loc28:0 "1940年英意塔兰托战役，英军利用航母舰载机突袭，瘫痪意大利主力战列舰。"
 game_assistant_hoi4_general_text_scripted_loc29:0 "大西洋战役中，德国U艇“狼群战术”袭击盟军船队，盟军以护航航母与雷达反制。"
 game_assistant_hoi4_general_text_scripted_loc30:0 "英国“飓风”战斗机在敦刻尔克上空有效掩护，与“喷火”构成不列颠空战主力。"
 game_assistant_hoi4_general_text_scripted_loc31:0 "日军战列舰“大和”号排水量7.2万吨，装9门460毫米主炮，最终被美军飞机击沉。"
 game_assistant_hoi4_general_text_scripted_loc32:0 "苏联“喀秋莎”火箭炮采用卡车搭载多条滑轨，齐射时覆盖面积大，心理震撼强。"
 game_assistant_hoi4_general_text_scripted_loc33:0 "芬兰狙击手西蒙·海耶在苏芬战争期间使用莫辛-纳甘步枪，确认击杀505人。"
 game_assistant_hoi4_general_text_scripted_loc34:0 "德国“俾斯麦”号战列舰于1941年击沉英胡德号，三日后被英军围攻击沉。"
 game_assistant_hoi4_general_text_scripted_loc35:0 "1942年巴丹死亡行军，日军强行押送约7.8万菲美战俘，途中虐杀导致超1.5万人死亡。"
 game_assistant_hoi4_general_text_scripted_loc36:0 "盟军在诺曼底登陆中，为欺骗德军建造假部队和充气坦克，成功牵制德军兵力。"
 game_assistant_hoi4_general_text_scripted_loc37:0 "二战中一只名为“佛伊泰克”的叙利亚棕熊被波兰炮兵连收养，在卡西诺战役搬运弹药。"
 game_assistant_hoi4_general_text_scripted_loc38:0 "美军曾试验“蝙蝠炸弹”，让蝙蝠携带小型燃烧弹，计划空投日本，后项目取消。"
 game_assistant_hoi4_general_text_scripted_loc39:0 "英国密码专家在图灵的带领下，破解德军恩尼格玛密码，大幅缩短了战争进程。"
 game_assistant_hoi4_general_text_scripted_loc40:0 "苏联女狙击手柳德米拉·帕夫利琴科，确认击杀309名德军官兵，后赴美国宣传。"
 game_assistant_hoi4_general_text_scripted_loc41:0 "1944年7月20日，施陶芬贝格上校用公文包炸弹刺杀希特勒，仅致其轻伤。"
 game_assistant_hoi4_general_text_scripted_loc42:0 "纳粹党员赫斯于1941年单人驾机飞往英国，意图和谈，被英方扣押直至战后。"
 game_assistant_hoi4_general_text_scripted_loc43:0 "美国战争债券宣传活动动员广泛，好莱坞明星参与，出售债券约1857亿美元。"
 game_assistant_hoi4_general_text_scripted_loc44:0 "日军在东南亚作战初期使用自行车快速机动，攻占新加坡时给英军造成心理冲击。"
 game_assistant_hoi4_general_text_scripted_loc45:0 "德海军“古斯塔夫巨炮”口径800毫米，列车炮需双轨铺设，射程达47公里。"
 game_assistant_hoi4_general_text_scripted_loc46:0 "1944年市场花园行动中，盟军空降荷兰意图夺取桥梁，遭遇德军装甲部队反击而失败。"
 game_assistant_hoi4_general_text_scripted_loc47:0 "硫磺岛战役美军伤亡约2.6万，日军守备队约2.1万，仅千余人被俘。"
 game_assistant_hoi4_general_text_scripted_loc48:0 "冲绳战役中美军投入兵力超54万，日军军民死亡超20万，大量平民被迫自杀。"
 game_assistant_hoi4_general_text_scripted_loc49:0 "为应对德国潜艇，盟军开发“刺猬弹”，反潜迫击炮向前方投射多枚深弹，命中率高。"
 game_assistant_hoi4_general_text_scripted_loc50:0 "二战中苏联接收了超过5000架美国P-39战斗机，主要因高空性能差供给苏联。"
 game_assistant_hoi4_general_text_scripted_loc51:0 "意大利投降后，德军营救墨索里尼，斯科尔兹内率滑翔机突袭大萨索山顶旅馆。"
 game_assistant_hoi4_general_text_scripted_loc52:0 "美军在太平洋采用“跳岛战术”，绕过日军重兵把守岛屿，快速逼近日本本土。"
 game_assistant_hoi4_general_text_scripted_loc53:0 "瓜达尔卡纳尔战役中，日军因补给断绝，大量饿死，称为“饿岛”，损失约2.5万。"
