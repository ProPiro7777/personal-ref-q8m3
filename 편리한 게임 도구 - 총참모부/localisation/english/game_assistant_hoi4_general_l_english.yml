 game_assistant_hoi4_general_text_scripted_loc299:0 "The United Nations was founded in 1945, replacing the League of Nations, with the Security Council permanent five mechanism established."
 game_assistant_hoi4_general_text_scripted_loc300:0 "After the war, Germany and Berlin were partitioned into occupation zones; Cold War tensions led to division into East and West Germany, which lasted until 1990."
 game_assistant_hoi4_general_text_scripted_loc301:0 "The Marshall Plan was a US aid program for European reconstruction, providing about $13 billion, leading to rapid Western European economic recovery."
 game_assistant_hoi4_general_text_scripted_loc302:0 "Japan's post-war constitution included Article 9, renouncing war; it was drafted under Allied occupation and took effect in 1947."
 game_assistant_hoi4_general_text_scripted_loc303:0 "The Tokyo Trials lasted over two years; 28 Class A war criminals were tried, with seven hanged, including Hideki Tojo."
 game_assistant_hoi4_general_text_scripted_loc304:0 "Many Nazi scientists were brought to the US via Operation Paperclip, including rocket engineer Wernher von Braun."
 game_assistant_hoi4_general_text_scripted_loc305:0 "WWII caused an estimated 70 million military and civilian deaths worldwide; the Soviet Union lost over 27 million, and China over 10 million."
 game_assistant_hoi4_general_text_scripted_loc306:0 "Poland suffered the highest proportional losses, with about one-sixth of its population killed, and Warsaw largely destroyed."
 game_assistant_hoi4_general_text_scripted_loc307:0 "The Holocaust systematically murdered about 6 million Jews, representing two-thirds of the Jewish population in Europe."
