 game_assistant_hoi4_general_text_scripted_loc321:0 "In 1941, German 'Brandenburg' special forces wore enemy uniforms to infiltrate and sabotage, operating on multiple fronts."
 game_assistant_hoi4_general_text_scripted_loc322:0 "The Japanese Nakano School was a secret army intelligence school, training spies and infiltrators for espionage and sabotage."
