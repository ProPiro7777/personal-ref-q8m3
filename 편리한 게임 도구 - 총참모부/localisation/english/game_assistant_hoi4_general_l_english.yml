 game_assistant_hoi4_general_text_scripted_loc314:0 "Finland fought alongside Germany against the Soviet Union in the Continuation War but did not participate in the siege of Leningrad, later fighting the Germans."
 game_assistant_hoi4_general_text_scripted_loc315:0 "In the Lapland War, Finland broke relations with Germany; the Germans implemented a scorched-earth policy during their withdrawal, destroying many towns."
