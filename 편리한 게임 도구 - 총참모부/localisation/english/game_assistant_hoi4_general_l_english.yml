 game_assistant_hoi4_general_text_scripted_loc284:0 "The French Resistance sabotaged rail and communications before D-Day; German counterattacks relied on single-track logistics, leading to paralysis."
 game_assistant_hoi4_general_text_scripted_loc285:0 "The Dutch railway strike led to a German food embargo, causing the winter famine of 1944-45, the 'Hunger Winter'."
 game_assistant_hoi4_general_text_scripted_loc286:0 "In the Norwegian heavy water sabotage, commandos sank a ferry carrying heavy water, hindering the German nuclear program."
 game_assistant_hoi4_general_text_scripted_loc287:0 "The French 'Normandie-Niemen' fighter regiment, made up of Free French pilots, fought alongside the Soviets on the Eastern Front."
