 game_assistant_hoi4_general_text_scripted_loc311:0 "The Anzio landing faced fierce German counterattacks; Allied forces were trapped on the beachhead for months before finally breaking through."
 game_assistant_hoi4_general_text_scripted_loc312:0 "The Gothic Line ran across northern Italy; German forces defended it tenaciously until it was fully breached in spring 1945."
