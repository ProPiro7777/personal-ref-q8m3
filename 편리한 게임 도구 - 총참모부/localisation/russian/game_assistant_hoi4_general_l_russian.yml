 game_assistant_hoi4_general_text:0 "[game_assistant_hoi4_general_text_scripted_loc]"

 game_assistant_hoi4_general_text_scripted_loc1:0 "Во время Сталинградской битвы некоторые советские снайперы перед выстрелом набирали в рот снег, чтобы пар от дыхания не выдавал их позицию на морозе."
 game_assistant_hoi4_general_text_scripted_loc2:0 "Во время Дюнкеркской эвакуации 1940 года за 9 дней было спасено почти 340 000 солдат союзников, в операции участвовало множество британских и французских гражданских судов."
 game_assistant_hoi4_general_text_scripted_loc3:0 "В Битве за Британию британская радиолокационная сеть сыграла решающую роль в раннем предупреждении; немецкие Люфтваффе потеряли почти 2000 самолётов."
 game_assistant_hoi4_general_text_scripted_loc4:0 "7 декабря 1941 года Япония атаковала Перл-Харбор, потопив и повредив 8 американских линкоров, временно парализовав Тихоокеанский флот США."
 game_assistant_hoi4_general_text_scripted_loc5:0 "В ходе Мидуэйского сражения американские криптоаналитики взломали японские коды, потопив четыре японских авианосца и переломив ход войны на Тихом океане."
 game_assistant_hoi4_general_text_scripted_loc6:0 "Сталинградская битва длилась более полугода, общие потери сторон составили около 2 миллионов человек, 6-я немецкая армия была уничтожена."
 game_assistant_hoi4_general_text_scripted_loc7:0 "Курская битва стала крупнейшим танковым сражением в истории: с обеих сторон участвовало около 6000 танков, немецкое наступление провалилось."
 game_assistant_hoi4_general_text_scripted_loc8:0 "Блокада Ленинграда длилась 872 дня, около 1 миллиона мирных жителей погибли от голода и обстрелов."
 game_assistant_hoi4_general_text_scripted_loc9:0 "Варшавское восстание: польские подпольные силы держались 63 дня, погибло около 200 000 поляков, город Варшава был практически разрушен."
 game_assistant_hoi4_general_text_scripted_loc10:0 "Во время Нанкинской резни японские войска за 6 недель убили огромное количество мирных жителей и военнопленных; Международный военный трибунал по Дальнему Востоку установил число погибших свыше 300 000."
 game_assistant_hoi4_general_text_scripted_loc11:0 "Освенцим был крупнейшим нацистским лагерем смерти, в нём погибло около 1,1 миллиона человек, в основном евреев."
 game_assistant_hoi4_general_text_scripted_loc12:0 "Немецкий танк «Тигр I» имел лобовую броню 100 мм, 88-мм орудие, вес 57 тонн, но отличался плохой подвижностью и частыми поломками."
 game_assistant_hoi4_general_text_scripted_loc13:0 "Советский Т-34 имел наклонную броню для эффективной защиты, 76,2-мм орудие и широкие гусеницы, подходящие для пересечённой местности."
 game_assistant_hoi4_general_text_scripted_loc14:0 "Немецкий пистолет-пулемёт MP40 выпущен в количестве около 1 миллиона штук, со складным прикладом, простой конструкции, магазин на 32 патрона."
 game_assistant_hoi4_general_text_scripted_loc15:0 "Советский ППШ-41 использовал барабанный магазин на 71 патрон, имел высокий темп стрельбы, был прост в производстве; за время войны изготовлено около 6 миллионов."
 game_assistant_hoi4_general_text_scripted_loc16:0 "StG44 была первой массово выпускаемой штурмовой винтовкой, использовала патрон 7,92×33 мм Kurz, оказав влияние на последующие разработки."
 game_assistant_hoi4_general_text_scripted_loc17:0 "Единый пулемёт MG42 имел темп стрельбы до 1200 выстр./мин, со сменным стволом и характерным рвущим звуком, получив прозвище «Пила Гитлера»."
 game_assistant_hoi4_general_text_scripted_loc18:0 "Американская винтовка M1 Garand использовала пачку на 8 патронов, полуавтоматическая стрельба; при опустошении пачка выбрасывалась с характерным «динь»."
 game_assistant_hoi4_general_text_scripted_loc19:0 "Истребитель «Зеро» жертвовал бронёй и протектированными баками ради дальности, отличаясь выдающейся манёвренностью в начале войны, но позже стал легковоспламеняющейся мишенью."
 game_assistant_hoi4_general_text_scripted_loc20:0 "Немецкий Me 262 был первым в мире реактивным истребителем, поступившим в эксплуатацию; быстрее поршневых самолётов, но с малым ресурсом двигателя."
 game_assistant_hoi4_general_text_scripted_loc21:0 "Американский B-29 Superfortress мог сбрасывать бомбы на большой высоте, полезная нагрузка 9 тонн; именно он сбросил атомные бомбы на Хиросиму и Нагасаки."
 game_assistant_hoi4_general_text_scripted_loc22:0 "Немецкая ракета V-2 была первой баллистической ракетой, использовала жидкий кислород и спирт, достигала сверхзвуковой скорости, но отличалась низкой точностью."
 game_assistant_hoi4_general_text_scripted_loc23:0 "Американский «Манхэттенский проект» обошёлся примерно в 2 миллиарда долларов, в результате было создано три атомные бомбы, две из которых были использованы в бою."
 game_assistant_hoi4_general_text_scripted_loc24:0 "Сброшенная на Хиросиму в 1945 году бомба «Малыш» имела мощность около 15 килотонн в тротиловом эквиваленте, вызвав около 140 000 смертей."
 game_assistant_hoi4_general_text_scripted_loc25:0 "Плутониевая бомба «Толстяк», сброшенная на Нагасаки, имела мощность около 21 килотонны; первоначальной целью была Кокура, но из-за облачности цель была перенесена на Нагасаки."
 game_assistant_hoi4_general_text_scripted_loc26:0 "Во время токийской огненной бомбардировки 9-10 марта 1945 года американские бомбардировщики сбросили зажигательные бомбы, вызвав около 100 000 смертей и массовые разрушения."
 game_assistant_hoi4_general_text_scripted_loc27:0 "В Польской кампании польские кавалерийские бригады имели на вооружении противотанковые ружья и артиллерию; миф о кавалерии, атакующей танки, недостоверен."
 game_assistant_hoi4_general_text_scripted_loc28:0 "В 1940 году в сражении при Таранто британские палубные самолёты атаковали, выведя из строя основные итальянские линкоры."
 game_assistant_hoi4_general_text_scripted_loc29:0 "Во время Битвы за Атлантику немецкие подводные лодки использовали «волчьи стаи» против конвоев союзников; союзники противодействовали эскортными авианосцами и радарами."
 game_assistant_hoi4_general_text_scripted_loc30:0 "Британский истребитель «Харрикейн» эффективно прикрывал эвакуацию из Дюнкерка, составив вместе со «Спитфайром» основу Битвы за Британию."
 game_assistant_hoi4_general_text_scripted_loc31:0 "Японский линкор «Ямато» водоизмещением 72 000 тонн нёс девять 460-мм орудий и в итоге был потоплен американской авиацией."
 game_assistant_hoi4_general_text_scripted_loc32:0 "Советская реактивная система «Катюша» монтировалась на грузовике с несколькими направляющими, при залпе обеспечивала площадь покрытия и сильное психологическое воздействие."
 game_assistant_hoi4_general_text_scripted_loc33:0 "Финский снайпер Симо Хяюхя использовал винтовку Мосина-Нагана во время Зимней войны, на его счету 505 подтверждённых убийств."
 game_assistant_hoi4_general_text_scripted_loc34:0 "Немецкий линкор «Бисмарк» потопил британский «Худ» в 1941 году, но через три дня сам был потоплен британскими силами."
 game_assistant_hoi4_general_text_scripted_loc35:0 "Во время «Батаанского марша смерти» 1942 года японцы насильно перевели около 78 000 филиппинских и американских военнопленных, из-за жестокого обращения погибло более 15 000 человек."
 game_assistant_hoi4_general_text_scripted_loc36:0 "Для высадки в Нормандии союзники построили фальшивые подразделения и надувные танки, чтобы обмануть немцев и успешно отвлечь их силы."
