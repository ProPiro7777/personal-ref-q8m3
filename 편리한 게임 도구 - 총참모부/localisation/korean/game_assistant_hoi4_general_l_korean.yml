 game_assistant_hoi4_general_text:0 "[game_assistant_hoi4_general_text_scripted_loc]"

 game_assistant_hoi4_general_text_scripted_loc1:0 "스탈린그라드 전투 중 일부 소련 저격수들은 혹한 속에서 숨을 내쉴 때 입김으로 위치가 노출되는 것을 막기 위해 사격 전에 한 입 가득 눈을 머금곤 했습니다."
 game_assistant_hoi4_general_text_scripted_loc2:0 "1940년 덩케르크 철수 작전에서 약 34만 명의 연합군 병사가 9일 만에 구조되었으며, 영국과 프랑스의 많은 민간 선박이 참여했습니다."
 game_assistant_hoi4_general_text_scripted_loc3:0 "영국 본토 항공전에서 영국의 레이더 네트워크는 조기 경보에 결정적인 역할을 했고, 독일 공군은 약 2,000대의 항공기를 잃었습니다."
 game_assistant_hoi4_general_text_scripted_loc4:0 "1941년 12월 7일, 일본이 진주만을 공격하여 미국 전함 8척을 침몰 또는 손상시키며 태평양 함대를 일시적으로 마비시켰습니다."
 game_assistant_hoi4_general_text_scripted_loc5:0 "미드웨이 해전에서 미군 암호 해독반이 일본 암호를 해독하여 일본 주력 항공모함 4척을 격침시켰고, 태평양 전세가 역전되었습니다."
 game_assistant_hoi4_general_text_scripted_loc6:0 "스탈린그라드 전투는 6개월 이상 지속되었으며 총 사상자는 약 200만 명에 달했고, 독일 제6군이 괴멸되었습니다."
 game_assistant_hoi4_general_text_scripted_loc7:0 "쿠르스크 전투는 역사상 최대의 전차전으로, 약 6,000대의 소련 및 독일 전차가 참전했으며 독일군이 패배했습니다."
 game_assistant_hoi4_general_text_scripted_loc8:0 "레닌그라드 포위전은 872일간 지속되었으며 약 100만 명의 민간인이 기아와 포격으로 사망했습니다."
 game_assistant_hoi4_general_text_scripted_loc9:0 "바르샤바 봉기는 63일간 지속되었고 약 20만 명의 폴란드인이 사망했으며 바르샤바 시는 대부분 파괴되었습니다."
 game_assistant_hoi4_general_text_scripted_loc10:0 "난징 대학살 당시 일본군은 6주 만에 다수의 민간인과 전쟁 포로를 살해했습니다. 극동 국제 군사 재판소는 사망자 수가 30만 명을 초과한다고 판결했습니다."
 game_assistant_hoi4_general_text_scripted_loc11:0 "아우슈비츠 수용소는 나치 최대의 학살 수용소로, 약 110만 명(대부분 유대인)이 생명을 잃었습니다."
 game_assistant_hoi4_general_text_scripted_loc12:0 "독일의 티거 I 전차는 전면 장갑 100mm, 88mm 포, 중량 57톤으로 기동성이 나쁘고 기계적 결함이 잦았습니다."
 game_assistant_hoi4_general_text_scripted_loc13:0 "소련 T-34 전차는 경사 장갑으로 효과적인 방호력을 제공했으며, 76.2mm 포와 험지 주행에 적합한 넓은 궤도를 갖췄습니다."
 game_assistant_hoi4_general_text_scripted_loc14:0 "독일 MP40 기관단총은 약 100만 정이 생산되었으며, 접이식 개머리판, 간단한 구조, 32발 탄창을 특징으로 했습니다."
 game_assistant_hoi4_general_text_scripted_loc15:0 "소련 PPSh-41 기관단총은 71발 드럼 탄창을 사용했으며, 높은 연사력, 제조 용이성으로 전쟁 중 약 600만 정이 생산되었습니다."
 game_assistant_hoi4_general_text_scripted_loc16:0 "StG44 돌격소총은 최초로 대량 배치된 돌격소총으로, 7.92×33mm 쿠르츠 탄을 사용하여 이후 설계에 영향을 미쳤습니다."
 game_assistant_hoi4_general_text_scripted_loc17:0 "MG42 다목적 기관총은 분당 최대 1,200발의 연사력, 신속한 총열 교체, 독특한 찢는 듯한 소리로 '히틀러의 전기톱'이라는 별명을 가졌습니다."
 game_assistant_hoi4_general_text_scripted_loc18:0 "미국 M1 개런드 소총은 8발들이 클립을 사용했으며, 반자동 사격 시 클립이 다 소모되면 '핑' 하는 독특한 소리가 났습니다."
 game_assistant_hoi4_general_text_scripted_loc19:0 "제로센 전투기는 장갑과 자체 밀봉 연료탱크를 희생하여 항속거리를 확보했으며, 초기에는 기동성이 뛰어났으나 이후 취약해지고 잘 붙는 단점이 있었습니다."
 game_assistant_hoi4_general_text_scripted_loc20:0 "독일 Me 262는 세계 최초의 실용 제트 전투기로, 피스톤 항공기보다 빠르지만 엔진 수명이 짧았습니다."
 game_assistant_hoi4_general_text_scripted_loc21:0 "미국 B-29 슈퍼포트리스 폭격기는 고고도에서 폭탄 투하가 가능했으며, 9톤의 탑재량으로 히로시마와 나가사키에 원자탄을 투하했습니다."
 game_assistant_hoi4_general_text_scripted_loc22:0 "독일 V-2 로켓은 최초의 탄도 미사일로, 액체 산소와 알코올 추진을 사용했으며 초음속을 달성했으나 정확도가 낮았습니다."
 game_assistant_hoi4_general_text_scripted_loc23:0 "미국 맨해튼 프로젝트는 약 20억 달러의 비용으로 세 개의 원자폭탄을 개발했으며, 그중 두 개가 실전에 사용되었습니다."
 game_assistant_hoi4_general_text_scripted_loc24:0 "1945년 히로시마에 투하된 '리틀 보이' 원자폭탄의 위력은 TNT 약 15킬로톤이었으며, 약 14만 명의 사망자를 냈습니다."
 game_assistant_hoi4_general_text_scripted_loc25:0 "나가사키에 투하된 '팻 맨' 플루토늄 폭탄은 위력이 약 21킬로톤이었습니다. 원래 목표는 고쿠라였으나 구름 때문에 나가사키로 변경되었습니다."
 game_assistant_hoi4_general_text_scripted_loc26:0 "1945년 3월 9일-10일 도쿄 대공습 당시 미군 폭격기가 소이탄을 투하하여 약 10만 명이 사망하고 도시가 광범위하게 파괴되었습니다."
 game_assistant_hoi4_general_text_scripted_loc27:0 "폴란드 전역에서 폴란드 기병 여단은 대전차 소총과 포병을 갖추고 있었습니다. 기병이 전차에 돌격했다는 신화는 부정확합니다."
 game_assistant_hoi4_general_text_scripted_loc28:0 "1940년 타란토 해전에서 영국의 함재기 공격으로 이탈리아 주력 전함들이 큰 타격을 입었습니다."
 game_assistant_hoi4_general_text_scripted_loc29:0 "대서양 전투 중 독일 U-보트는 연합군 호송선단에 대해 '늑대 떼 전술'을 사용했으며, 연합군은 호위 항모와 레이더로 대응했습니다."
 game_assistant_hoi4_general_text_scripted_loc30:0 "영국 허리케인 전투기는 덩케르크 철수를 효과적으로 엄호했으며, 스핏파이어와 함께 영국 본토 항공전의 핵심을 형성했습니다."
 game_assistant_hoi4_general_text_scripted_loc31:0 "일본 전함 야마토는 배수량 72,000톤, 460mm 주포 9문을 장착했으며, 결국 미군 항공기에 의해 격침되었습니다."
 game_assistant_hoi4_general_text_scripted_loc32:0 "소련 카츄샤 로켓포는 트럭에 장착된 다연장 레일 시스템으로, 지역 포화와 심리적 충격을 가했습니다."
 game_assistant_hoi4_general_text_scripted_loc33:0 "핀란드 저격수 시모 해야는 겨울전쟁 당시 모신나강 소총을 사용하여 505명의 확정 사살을 기록했습니다."
 game_assistant_hoi4_general_text_scripted_loc34:0 "독일 전함 비스마르크는 1941년 영국의 후드를 격침시켰지만, 사흘 후 영국군에 의해 격침되었습니다."
 game_assistant_hoi4_general_text_scripted_loc35:0 "1942년 바탄 죽음의 행진에서 일본군은 약 78,000명의 필리핀 및 미국 포로를 강제 행군시켰으며, 학대로 인해 15,000명 이상이 사망했습니다."
 game_assistant_hoi4_general_text_scripted_loc36:0 "노르망디 상륙을 위해 연합군은 가짜 부대와 고무 전차를 만들어 독일군을 속였고, 독일군을 성공적으로 분산시켰습니다."
 game_assistant_hoi4_general_text_scripted_loc37:0 "제2차 세계 대전 중, 보이텍이라는 시리아 갈색 곰이 폴란드 포병 부대에 입양되어 몬테카시노 전투에서 탄약 운반을 도왔습니다."
 game_assistant_hoi4_general_text_scripted_loc38:0 "미국은 '박쥐 폭탄'을 실험했는데, 박쥐에 소형 소이 장치를 부착하여 일본 상공에 투하하는 것이었으나 프로젝트는 취소되었습니다."
 game_assistant_hoi4_general_text_scripted_loc39:0 "영국의 암호 해독가 앨런 튜링은 독일 에니그마 암호 해독을 주도하여 전쟁을 상당히 단축시켰습니다."
 game_assistant_hoi4_general_text_scripted_loc40:0 "소련 여성 저격수 류드밀라 파블리첸코는 독일군 309명의 확정 사살 기록을 세웠으며, 이후 미국에서 홍보 투어를 했습니다."
 game_assistant_hoi4_general_text_scripted_loc41:0 "1944년 7월 20일, 슈타우펜베르크 대령이 서류 가방 폭탄으로 히틀러 암살을 시도했으나 히틀러는 경상만 입고 살아남았습니다."
 game_assistant_hoi4_general_text_scripted_loc42:0 "1941년, 나치 관료 루돌프 헤스는 단독으로 스코틀랜드에 비행하여 평화 협상을 시도했으나 영국에 억류되어 전쟁이 끝날 때까지 포로로 있었습니다."
 game_assistant_hoi4_general_text_scripted_loc43:0 "미국의 전쟁 채권 캠페인은 할리우드 스타들이 참여하는 등 대대적인 동원을 거쳐 약 1,857억 달러의 채권을 판매했습니다."
 game_assistant_hoi4_general_text_scripted_loc44:0 "일본군은 동남아시아 초기 작전에서 자전거를 이용한 신속 기동으로 심리적 충격을 주었고, 싱가포르 함락 시 두드러졌습니다."
 game_assistant_hoi4_general_text_scripted_loc45:0 "독일의 '구스타프 포'는 800mm 철도포로, 이중 궤도가 필요했으며 사거리는 47km였습니다."
 game_assistant_hoi4_general_text_scripted_loc46:0 "1944년 마켓 가든 작전에서 연합군 공수 부대가 네덜란드의 다리를 점령하려 했으나 독일 기갑 역습에 실패했습니다."
 game_assistant_hoi4_general_text_scripted_loc47:0 "이오지마 전투에서 미군은 약 26,000명의 사상자를 냈고, 약 21,000명의 일본 수비대 중 약 1,000명만이 포로가 되었습니다."
 game_assistant_hoi4_general_text_scripted_loc48:0 "오키나와 전투에는 54만 명 이상의 미군이 참전했으며, 일본군과 민간인 사망자는 20만 명 이상이었고 많은 민간인이 자살을 강요당했습니다."
 game_assistant_hoi4_general_text_scripted_loc49:0 "독일 잠수함에 대응하기 위해 연합군은 '헤지호그'라는 전방 투척 박격포를 개발했으며, 이는 여러 발의 폭뢰를 발사하여 명중률이 더 높았습니다."
 game_assistant_hoi4_general_text_scripted_loc50:0 "소련은 제2차 세계 대전 중 5,000대 이상의 미국 P-39 전투기를 받았는데, 주로 고고도 성능이 낮아 소련의 필요에 적합했기 때문입니다."
 game_assistant_hoi4_general_text_scripted_loc51:0 "이탈리아 항복 후, 독일군은 무솔리니를 구출했습니다. 스코르체니가 그란사소의 캄포 임페라토레 호텔에 글라이더로 급습했습니다."
 game_assistant_hoi4_general_text_scripted_loc52:0 "미국은 태평양에서 '섬 건너뛰기' 전술을 사용하여 요새화된 일본군 섬을 우회하고 빠르게 일본 본토에 접근했습니다."
 game_assistant_hoi4_general_text_scripted_loc53:0 "과달카날 작전 중 일본군은 보급 부족으로 심각한 기아에 시달려 '기아의 섬'이라는 이름이 붙었으며 약 25,000명의 손실을 입었습니다."
 game_assistant_hoi4_general_text_scripted_loc54:0 "독일 '판터' 중형전차는 경사 장갑과 장포신 75mm 포를 갖추었으며 야간 전투 능력이 뛰어났습니다."
 game_assistant_hoi4_general_text_scripted_loc55:0 "체코의 Lt vz.38 전차는 독일군이 Panzer 38(t)로 채택하여 폴란드와 프랑스 전역에서 널리 사용되었습니다."
 game_assistant_hoi4_general_text_scripted_loc56:0 "독일 공수부대는 크레타 섬 공수 침공에서 큰 사상자를 입었고, 이 전투 후 히틀러는 대규모 공수 작전을 금지했습니다."
 game_assistant_hoi4_general_text_scripted_loc57:0 "영국 SAS(특수항공부대)는 북아프리카의 독일 비행장을 급습하여 격납고 내에 폭탄을 심는 새로운 전술을 개척했습니다."
 game_assistant_hoi4_general_text_scripted_loc58:0 "일본은 석유 확보를 위해 네덜란드령 동인도를 점령했으며, 이는 직접적으로 미국의 대일 석유 금수 조치를 촉발했습니다."
 game_assistant_hoi4_general_text_scripted_loc59:0 "제2차 세계 대전 중 캐나다는 영연방 항공 승무원의 주요 훈련장이 되었으며, 영연방 항공 훈련 계획은 13만 명 이상의 항공 승무원을 양성했습니다."
 game_assistant_hoi4_general_text_scripted_loc60:0 "되니츠의 '늑대 떼' 전술은 여러 U-보트를 이용하여 호송선단에 대한 야간 협동 공격을 수행했으며, 초기에 큰 성과를 거두었으나 이후 대응에 직면했습니다."
 game_assistant_hoi4_general_text_scripted_loc61:0 "독일 Fa 223 드라헤는 제2차 세계 대전 중 유일하게 양산된 헬리콥터로, 포병을 외부에 매달아 수송할 수 있었습니다."
 game_assistant_hoi4_general_text_scripted_loc62:0 "미국 해병대는 나바호어 암호 통신병을 사용했으며, 그들의 복잡한 언어는 일본군에게 해독되지 않았습니다."
 game_assistant_hoi4_general_text_scripted_loc63:0 "스탈린그라드 시가전 중 소련 저격수 바실리 자이체프는 약 225명의 적군을 사살하여 사기에 큰 영향을 미쳤습니다."
 game_assistant_hoi4_general_text_scripted_loc64:0 "일본은 약 9,000개의 폭탄을 탑재한 풍선 폭탄을 북미 방향으로 발사했으나, 이로 인한 사망자는 6명에 불과했고 거의 큰 화재도 없었습니다."
 game_assistant_hoi4_general_text_scripted_loc65:0 "'도쿄 로즈'로 알려진 미국인 아나운서는 일본 선전에 이용되었으며, 전쟁 후 일부는 반역죄로 유죄 판결을 받았지만 대부분은 강요당했습니다."
 game_assistant_hoi4_general_text_scripted_loc66:0 "전함 아드미랄 그라프 슈페는 남대서양에서 약탈 활동을 했으며, 리버 플레이트 해전 후 몬테비데오 앞바다에서 자침했습니다."
 game_assistant_hoi4_general_text_scripted_loc67:0 "자유 프랑스 전사들은 노르망디 상륙 전에 철도를 방해했으며, 이에 대한 보복으로 독일군은 오라두르쉬르글란 마을을 학살하여 642명을 죽였습니다."
 game_assistant_hoi4_general_text_scripted_loc68:0 "전쟁 말기, 독일은 '딱따구리' 적외선 야간 투시 장치를 개발하여 소수의 판터 전차와 돌격포에 장착했습니다."
 game_assistant_hoi4_general_text_scripted_loc69:0 "타란토에서 이탈리아 해군이 큰 타격을 입은 후, 마타판 곶 해전에서도 패배하여 전함 비토리오 베네토가 손상되었습니다."
 game_assistant_hoi4_general_text_scripted_loc70:0 "호주군은 코코다 트랙을 따라 일본군을 저지하기 위해 싸웠으며, 파푸아인들의 보급 지원을 받아 정글 전술을 사용했습니다."
 game_assistant_hoi4_general_text_scripted_loc71:0 "영국의 '해밀카' 글라이더는 경전차를 수송할 수 있었고, 노르망디와 라인강 공수 작전에 사용되었으나 조종이 어려웠습니다."
 game_assistant_hoi4_general_text_scripted_loc72:0 "'밤의 마녀들'은 소련 여성 야간 폭격 연대로, 노후된 Po-2 항공기를 타고 저고도로 급습하여 독일군에게 심리적 압박을 가했습니다."
 game_assistant_hoi4_general_text_scripted_loc73:0 "독일 Ar 234는 최초의 실용 제트 폭격기로, 정찰 및 레마겐 다리 폭격에 사용되었으며 너무 빨라 요격이 어려웠습니다."
 game_assistant_hoi4_general_text_scripted_loc74:0 "엘 알라메인 전투에서 몽고메리의 영국 제8군이 롬멜의 아프리카 군단을 격파하여 전환점이 되었습니다."
 game_assistant_hoi4_general_text_scripted_loc75:0 "소련 Po-2 복엽기는 소음이 적어 나뭇잎 높이로 은밀히 공격할 수 있었고, 독일군은 이를 '재봉틀'이라 불렀으며 주로 밤의 마녀들이 사용했습니다."
 game_assistant_hoi4_general_text_scripted_loc76:0 "1945년 9월 2일, 일본은 미주리호 전함 위에서 항복 문서에 서명하여 제2차 세계 대전이 공식적으로 종결되었습니다."
 game_assistant_hoi4_general_text_scripted_loc77:0 "일본 구축함 유키카제는 수많은 해전에서 거의 손상 없이 살아남아 '행운의 배'라는 평판을 얻었습니다."
 game_assistant_hoi4_general_text_scripted_loc78:0 "독일 88mm 대공포는 평사로 사용할 때 대전차 역할에 매우 효과적이었으며, 방공과 대전차 모두에 널리 사용되었습니다."
 game_assistant_hoi4_general_text_scripted_loc79:0 "일본의 '가이텐' 인력 어뢰는 모함에서 발사되었으며, 조종사가 표적을 향해 조종했지만 전과는 제한적이었고 많은 수가 손실되었습니다."
 game_assistant_hoi4_general_text_scripted_loc80:0 "스위스는 제2차 세계 대전 중 중립을 유지했지만 연합군과 독일군 모두 실수로 여러 차례 폭격했으며, 스위스 공군도 침입자를 요격했습니다."
 game_assistant_hoi4_general_text_scripted_loc81:0 "나치 독일의 전함 계획인 H-44급 초전함은 건조되지 못하고 종이 위에만 남았습니다."
 game_assistant_hoi4_general_text_scripted_loc82:0 "소련군은 PTRD 및 PTRS 대전차 소총을 널리 사용했으며, 초기 독일 전차 장갑을 관통할 수 있었으나 후기에는 충분하지 않았습니다."
 game_assistant_hoi4_general_text_scripted_loc83:0 "미국 M4 셔먼 전차는 약 50,000대가 생산되었으며 유지보수가 쉬웠지만, 초기 주포는 독일의 티거와 판터 전차에 대응하기 어려웠습니다."
 game_assistant_hoi4_general_text_scripted_loc84:0 "전쟁 전, 영국은 '체인 홈'이라는 레이더 기지망을 건설하여 영국 본토 항공전에서 조기 경보 이점을 제공했습니다."
 game_assistant_hoi4_general_text_scripted_loc85:0 "일본군은 알류샨 열도의 애투와 키스카 섬을 점령했으며, 미군은 이를 탈환하는 과정에서 1,000명 이상의 동상 사상자를 냈습니다."
 game_assistant_hoi4_general_text_scripted_loc86:0 "1941년, 영국군은 U-110 잠수함을 나포하여 에니그마 기계와 암호책을 입수했으며, 이는 암호 해독 작업을 가속화했습니다."
 game_assistant_hoi4_general_text_scripted_loc87:0 "프랑스 전투 중 독일군은 아르덴을 통과하여 스당에서 돌파했고, 마지노선이 측면 우회되면서 무용지물이 되었습니다."
 game_assistant_hoi4_general_text_scripted_loc88:0 "영국의 특수작전집행부(SOE)는 유럽 침투를 위해 요원을 훈련시켰으며, 처칠은 '유럽에 불을 지르라'고 명령했습니다."
 game_assistant_hoi4_general_text_scripted_loc89:0 "태평양 전쟁 중 일본의 장갑 항모 다이호는 휘발유 증기 폭발로 인해 단 한 발의 어뢰에 격침되었으며, 이는 치명적인 설계 결함이었습니다."
 game_assistant_hoi4_general_text_scripted_loc90:0 "제2차 세계 대전에서 가장 널리 사용된 보병 소총은 리-엔필드로, 영연방에서 370만 정 이상 생산되었습니다."
 game_assistant_hoi4_general_text_scripted_loc91:0 "초기형 일본 미쓰비시 A6M 제로센 전투기는 초경질 알루미늄을 사용한 경량 구조로, 전쟁 초기에 압도적인 공중전 결과를 냈습니다."
 game_assistant_hoi4_general_text_scripted_loc92:0 "소련 IS-2 중전차는 122mm 포를 장착했으며, 중량 약 46톤으로 주로 돌파와 티거·판터 전차와의 교전에 사용되었습니다."
 game_assistant_hoi4_general_text_scripted_loc93:0 "미국은 소련에 막대한 양의 차량을 공급했으며, 37만 대 이상의 트럭을 포함하여 붉은 군대의 병참 기동성을 유지시켰습니다."
 game_assistant_hoi4_general_text_scripted_loc94:0 "1944년 네덜란드 기근은 철도 파업과 봉쇄로 인해 발생했으며, '헝거 윈터'로 알려져 약 20,000명이 사망했습니다."
 game_assistant_hoi4_general_text_scripted_loc95:0 "주로 일본계 미국인으로 구성된 미국 제442 연대 전투단은 유럽에서 두각을 나타내며 가장 많은 훈장을 받은 부대가 되었습니다."
 game_assistant_hoi4_general_text_scripted_loc96:0 "독일 E-시리즈 전차 계획에는 E-100 초중전차가 포함되었으며, 섀시만 완성되고 양산되지는 못했습니다."
 game_assistant_hoi4_general_text_scripted_loc97:0 "제2차 세계 대전 중 연합군은 팽창식 고무 가짜 전차를 '유령 군단'의 일부로 개발하여 칼레 인근에서 독일군을 속였습니다."
 game_assistant_hoi4_general_text_scripted_loc98:0 "일본 육군의 97식 치하 중형전차는 단포신 57mm 포와 약한 장갑으로, 셔먼에 쉽게 열세였습니다."
 game_assistant_hoi4_general_text_scripted_loc99:0 "영국은 제2차 세계 대전 중 20,000대 이상의 스핏파이어를 생산했으며, 지속적으로 업그레이드되어 거의 모든 전구에서 싸웠습니다."
 game_assistant_hoi4_general_text_scripted_loc100:0 "전쟁 후, 뉘른베르크 재판에서 전쟁 범죄가 기소되어 12명의 피고인이 사형을 선고받았으며, 국제 형법의 기초를 세웠습니다."
  game_assistant_hoi4_general_text_scripted_loc101:0 "1941년, 독일은 바르바로사 작전을 개시하여 약 300만 병력을 세 갈래로 나누어 소련을 침공했습니다."
 game_assistant_hoi4_general_text_scripted_loc102:0 "키예프 전투에서 소련군 포로는 65만 명에 달했으며, 이는 역사상 최대의 포위전이었습니다."
 game_assistant_hoi4_general_text_scripted_loc103:0 "모스크바 전투 중 소련군은 붉은 광장에서 열병식을 가진 후 곧바로 전선으로 행진했으며, 독일군의 공세는 혹한으로 인해 저지되었습니다."
 game_assistant_hoi4_general_text_scripted_loc104:0 "제2차 하리코프 전투(1942년)에서 소련의 반격은 실패하여 약 27만 명의 병력을 잃었고, 남서부 전선에 큰 타격을 입혔습니다."
 game_assistant_hoi4_general_text_scripted_loc105:0 "블라우 작전에서 독일군은 두 그룹으로 나뉘어 한 부대는 캅카스 유전으로, 다른 부대는 스탈린그라드로 진격했습니다."
 game_assistant_hoi4_general_text_scripted_loc106:0 "캅카스 전투에서 양측은 석유와 광물을 놓고 싸웠으며, 독일군은 결국 바쿠 유전을 완전히 통제하는 데 실패했습니다."
 game_assistant_hoi4_general_text_scripted_loc107:0 "보로네시 전투에서 독일군은 격렬한 시가전을 겪었으며, 도시는 반복적인 백중세로 폐허가 되었습니다."
 game_assistant_hoi4_general_text_scripted_loc108:0 "크림 반도 작전에서 세바스토폴 포위전은 250일간 지속되었으며, 독일군은 구스타프 중포를 사용했습니다."
 game_assistant_hoi4_general_text_scripted_loc109:0 "코틀루반 공세에서 소련군은 심층 전술을 사용하여 독일군 전선을 빠르게 돌파하고 벨로루시를 해방했습니다."
 game_assistant_hoi4_general_text_scripted_loc110:0 "1944년 바그라티온 작전은 독일 중부 집단군의 대부분을 괴멸시키고 600km 이상 진격했습니다."
 game_assistant_hoi4_general_text_scripted_loc111:0 "스몰렌스크의 격렬한 전투는 독일군에게 두 달 이상의 시간을 소모하게 하여 모스크바 진격을 둔화시켰습니다."
 game_assistant_hoi4_general_text_scripted_loc112:0 "데먄스크 포위전에서 독일군은 수개월간 공중 보급으로 버티다가 탈출에 성공했으며, 이 전투는 공수 보급 교리에 영향을 미쳤습니다."
 game_assistant_hoi4_general_text_scripted_loc113:0 "콜름 포위전에서는 약 5,500명의 독일군이 105일간 포위되었으며, 공중 투하에 의존했고 구원을 받을 때까지 거의 절반의 사상자를 냈습니다."
 game_assistant_hoi4_general_text_scripted_loc114:0 "부다페스트 포위전은 1944년 말부터 1945년 2월까지 지속되었으며, 소련군은 약 16만 명의 독일 및 헝가리 수비군을 포위 섬멸했습니다."
 game_assistant_hoi4_general_text_scripted_loc115:0 "쾨니히스베르크 전투에서 소련군은 맹렬한 포격으로 요새를 파괴했으며, 요새 사령관 라슈 장군은 결국 항복했습니다."
 game_assistant_hoi4_general_text_scripted_loc116:0 "베를린 전투에는 250만 명의 소련군이 참전했으며, 라이히스타크 상공에 깃발을 게양한 것은 유럽 전역 승리의 상징이 되었습니다."
 game_assistant_hoi4_general_text_scripted_loc117:0 "1945년 5월 2일, 베를린 수비대가 항복했고, 5월 8일 독일의 무조건 항복이 공식 발효되었습니다."
 game_assistant_hoi4_general_text_scripted_loc118:0 "프라하 공세는 유럽에서의 마지막 주요 전투였으며, 독일 항복 후에도 소련군은 잔존 병력을 계속 소탕했습니다."
 game_assistant_hoi4_general_text_scripted_loc119:0 "폴란드 전역 중, 소련은 독일과의 비밀 협정에 따라 9월 17일 폴란드 동부를 침공하여 영토를 분할했습니다."
 game_assistant_hoi4_general_text_scripted_loc120:0 "겨울전쟁 중 소련군은 초기에 어려움을 겪었으며, 만네르하임 선은 압도적인 병력에도 버텼습니다."
 game_assistant_hoi4_general_text_scripted_loc121:0 "카틴 학살에서 소련 NKVD는 1940년에 약 22,000명의 폴란드 군인, 경찰, 관리, 지식인을 살해했습니다."
 game_assistant_hoi4_general_text_scripted_loc122:0 "1939년 할힌골 전투에서 일본군은 소련-몽골 연합군에게 대패했으며, 이로 인해 일본은 '북진' 전략을 포기했습니다."
 game_assistant_hoi4_general_text_scripted_loc123:0 "소일 중립 조약은 1941년에 체결되었으며, 소련이 1945년 8월 일본에 선전포고할 때까지 양측은 중립을 유지했습니다."
 game_assistant_hoi4_general_text_scripted_loc124:0 "1945년, 소련은 8월 폭풍 작전을 개시하여 일본 관동군을 신속하게 격파하고 만주와 북한을 해방했습니다."
 game_assistant_hoi4_general_text_scripted_loc125:0 "1938년 하산호 전투는 소련과 일본 간의 국경 분쟁으로, 서로의 힘을 시험한 후 휴전으로 종료되었습니다."
 game_assistant_hoi4_general_text_scripted_loc126:0 "일본군은 중국에서 세균전을 자행했으며, 731 부대는 인간 실험과 페스트 병원균 살포를 수행했습니다."
 game_assistant_hoi4_general_text_scripted_loc127:0 "충칭 폭격은 6년 이상 지속되었으며, 일본은 전시 수도에 대해 무차별 전략 폭격을 가해 막대한 민간인 사상자를 냈습니다."
 game_assistant_hoi4_general_text_scripted_loc128:0 "중국 원정군은 버마에 진입했으며, 옌안갱 전투에서 약 7,000명의 영국군을 구출했지만 원정군 전체는 큰 손실을 입었습니다."
 game_assistant_hoi4_general_text_scripted_loc129:0 "히말라야 상공의 '험프' 항로에서 미중 공수 수송은 3년 동안 500대 이상의 항공기를 잃었으며, 약 65만 톤의 보급품을 수송했습니다."
 game_assistant_hoi4_general_text_scripted_loc130:0 "타이얼좡 전투에서 중국군은 일본군에게 약 1만 명의 사상자를 입혔으며, 이는 정면 전장에서의 주요 승리였습니다."
 game_assistant_hoi4_general_text_scripted_loc131:0 "백단대전에서 팔로군은 철도와 요새에 대한 대규모 공격을 감행하여 105개 연대를 동원, 일본군 보급선을 교란했습니다."
 game_assistant_hoi4_general_text_scripted_loc132:0 "화위안커우 제방 붕괴는 일본군을 막기 위한 의도였으나, 하류에 대규모 홍수, 민간인 사상자, 기근을 초래했습니다."
 game_assistant_hoi4_general_text_scripted_loc133:0 "난징 함락 후, 많은 방어군이 흩어져 퇴각했으며, 일부는 시내로 철수했다가 대학살의 희생자가 되었고, 철수 지휘는 혼란스러웠습니다."
 game_assistant_hoi4_general_text_scripted_loc134:0 "미드웨이 해전에서 일본은 4척의 항공모함(아카기, 카가, 소류, 히류)을 잃었고, 미국은 요크타운만 잃었습니다."
 game_assistant_hoi4_general_text_scripted_loc135:0 "산호해 해전은 함재기만 사용하고 함선끼리 서로 보지 못한 최초의 항모전이었습니다."
 game_assistant_hoi4_general_text_scripted_loc136:0 "레이테 만 해전은 전례 없는 규모였으며, 일본은 최초로 '가미카제'를 조직했고 전함 무사시가 격침되었습니다."
 game_assistant_hoi4_general_text_scripted_loc137:0 "'대마리아나 칠면조 사냥'에서 미군 조종사들은 일본 항공기를 사냥했으며, 일본은 약 300대의 함재기를 잃었습니다."
 game_assistant_hoi4_general_text_scripted_loc138:0 "산타크루즈 제도 해전에서 항모 호넷이 격침되고 엔터프라이즈가 손상되어 미군의 전술적, 전략적 계획에 영향을 미쳤습니다."
 game_assistant_hoi4_general_text_scripted_loc139:0 "사보 섬 해전에서 연합군 순양함은 4척이 격침되는 큰 손실을 입었으며, '철저 수역'에서 가장 잔혹한 야간 전투 중 하나였습니다."
 game_assistant_hoi4_general_text_scripted_loc140:0 "타사파롱가 해전에서 미군 순양함 부대는 일본 구축함의 어뢰에 큰 타격을 입었으며, 이는 가혹한 전술적 교훈을 제공했습니다."
 game_assistant_hoi4_general_text_scripted_loc141:0 "채널 제도는 전쟁이 끝날 때까지 독일군 점령 하에 있었으며, 유일하게 점령된 영국 영토였습니다."
 game_assistant_hoi4_general_text_scripted_loc142:0 "독일은 덴마크를 약 4시간 만에 점령했으며, 덴마크 정부는 항복했지만 이후 저항 운동이 일어났습니다."
 game_assistant_hoi4_general_text_scripted_loc143:0 "노르웨이 전역 중 독일군은 최초로 대규모 공수부대를 사용하여 오슬로 공항과 항구를 점령했습니다."
 game_assistant_hoi4_general_text_scripted_loc144:0 "비시 프랑스는 프랑스 남부와 식민지를 통제하기 위해 설립되었으며, 주요 함대는 독일의 탈취를 막기 위해 툴롱에서 자침했습니다."
 game_assistant_hoi4_general_text_scripted_loc145:0 "자유 프랑스군은 비르 하켐에서 버텨 영국 주력군의 안전한 철수를 가능하게 했으며, 국제적 명성을 얻었습니다."
 game_assistant_hoi4_general_text_scripted_loc146:0 "디에프 기습은 연합군, 특히 캐나다군에게 큰 사상자를 냈지만, 이후 상륙 작전에 교훈을 제공했습니다."
 game_assistant_hoi4_general_text_scripted_loc147:0 "테헤란 회담에서 처칠, 루즈벨트, 스탈린이 처음으로 만나 제2전선 개방에 합의했습니다."
 game_assistant_hoi4_general_text_scripted_loc148:0 "얄타 회담은 전후 세력권을 분할했으며, 소련은 대일 전쟁 참전을 약속하여 극동 이익에 관여했습니다."
 game_assistant_hoi4_general_text_scripted_loc149:0 "포츠담 선언은 일본에 무조건 항복을 촉구하며 '신속하고 완전한 파괴'를 경고했으나, 일본은 받아들이지 않았습니다."
 game_assistant_hoi4_general_text_scripted_loc150:0 "1945년 8월, 일본 황궁 부근에서 쿠데타 시도가 발생했습니다. 일부 장교들은 항복 방송을 막으려 했으나 실패했습니다."
 game_assistant_hoi4_general_text_scripted_loc151:0 "독일 U-47 잠수함은 스카파 플로를 침투하여 전함 로열 오크를 격침했으며, 함장 프리엔은 유명해졌습니다."
 game_assistant_hoi4_general_text_scripted_loc152:0 "U-96의 활약은 영화 '다스 부트'에서 극화되었으며, 그 엠블럼은 웃는 톱물고기였습니다."
 game_assistant_hoi4_general_text_scripted_loc153:0 "미국 잠수함 아처피시는 일본의 항모 시나노를 격침시켰는데, 이는 야마토급 전함에서 개조된 것으로 첫 항해에서 격침되었습니다."
 game_assistant_hoi4_general_text_scripted_loc154:0 "일본 I-400급 잠수함은 3대의 세이란 공격기를 탑재할 수 있었으며, 파나마 운하 공격을 위한 잠수함 항공모함으로 설계되었습니다."
 game_assistant_hoi4_general_text_scripted_loc155:0 "독일의 '밀크 카우' 잠수함은 원양 보급선으로, U-보트에 연료와 어뢰를 공급하여 항속거리를 연장했습니다."
 game_assistant_hoi4_general_text_scripted_loc156:0 "영국 X급 소형 잠수함은 피오르드에 침투하여 폭약으로 전함 티르피츠를 무력화시켰습니다."
 game_assistant_hoi4_general_text_scripted_loc157:0 "이탈리아 제10소함대는 유인 어뢰를 사용하여 영국 전함 퀸 엘리자베스와 밸리언트를 크게 손상시켰습니다."
 game_assistant_hoi4_general_text_scripted_loc158:0 "독일 He 115 해상 비행기는 기뢰 부설과 정찰을 수행했으며, 은밀한 요원 투하에도 사용되었습니다."
 game_assistant_hoi4_general_text_scripted_loc159:0 "미국 PT-109 어뢰정은 일본 구축함에 충격되어 침몰했으며, 함장은 미래의 미국 대통령 존 F. 케네디였습니다."
 game_assistant_hoi4_general_text_scripted_loc160:0 "도르니어 Do 17 폭격기는 날씬한 동체 때문에 '날아다니는 연필'이라는 별명을 얻었으며, 영국 본토 항공전 이후 단계적으로 퇴역했습니다."
 game_assistant_hoi4_general_text_scripted_loc161:0 "영국 모스키토 전투폭격기는 거의 전부 목재로 만들어졌으며, 속도에 의존하여 요격을 피했고 다양한 역할을 수행했습니다."
 game_assistant_hoi4_general_text_scripted_loc162:0 "독일 Ju 87 슈투카 급강하 폭격기는 예리코 나팔을 장착하여 공포를 조성하는 비명 소리를 냈으며, 전격전의 상징이 되었습니다."
 game_assistant_hoi4_general_text_scripted_loc163:0 "독일 Fw 190 전투기는 공랭식 성형 엔진을 사용했으며, 중저고도 성능이 뛰어나 초기 스핏파이어 변형을 압도했습니다."
 game_assistant_hoi4_general_text_scripted_loc164:0 "미국 P-51 머스탱은 멀린 엔진을 장착한 후 B-17 폭격기를 베를린까지 호위할 수 있는 항속거리를 가졌습니다."
 game_assistant_hoi4_general_text_scripted_loc165:0 "일본 N1K2-J 시덴카이 전투기는 뛰어난 성능을 가졌지만, 생산 수가 부족하여 전쟁 후반의 열세를 역전시키지 못했습니다."
 game_assistant_hoi4_general_text_scripted_loc166:0 "이탈리아 마키 MC.202 전투기는 기동성이 뛰어났지만, 화력 부족과 열악한 산업 지원으로 제한되었습니다."
 game_assistant_hoi4_general_text_scripted_loc167:0 "미국 P-38 라이트닝 전투기는 쌍동체를 가졌으며, 야마모토 제독을 격추한 임무는 이 항공기가 수행했습니다."
 game_assistant_hoi4_general_text_scripted_loc168:0 "노획한 제로센은 미군에 의해 수리 및 테스트되었으며, 고속에서의 에일러론 경직과 빈약한 급강하 성능과 같은 약점이 드러났습니다."
 game_assistant_hoi4_general_text_scripted_loc169:0 "독일 Ta 152 고고도 전투기는 10,000미터에서 운용하기 위해 날개를 연장했지만, 극소수만 생산되었습니다."
 game_assistant_hoi4_general_text_scripted_loc170:0 "일본의 오카 로켓 동력 유인 비행 폭탄은 G4M 폭격기에 탑재되어 방출된 후 활공하여 함선으로 가속했습니다."
 game_assistant_hoi4_general_text_scripted_loc171:0 "독일 He 162 '폴크스예거'는 목재 접착제로 만든 비상용 제트 전투기로, 수개월 만에 설계 및 생산되었습니다."
 game_assistant_hoi4_general_text_scripted_loc172:0 "영국 글로스터 미티어 제트 전투기는 주로 V-1 비행 폭탄 요격을 위해 실전 배치되었으며, 독일 Me 262와 교전하지는 않았습니다."
 game_assistant_hoi4_general_text_scripted_loc173:0 "V-1 순항 미사일은 펄스제트 엔진을 사용하여 독특한 소음을 냈으며, 약 10,000발이 영국을 향해 발사되었습니다."
 game_assistant_hoi4_general_text_scripted_loc174:0 "독일 도라 포는 개량된 800mm 철도포로, 단 한 문만 제작되어 세바스토폴에서 사용되었습니다."
 game_assistant_hoi4_general_text_scripted_loc175:0 "소련 SU-152 자주포는 강력한 주포로 티거 전차의 포탑을 날려버릴 수 있어 '동물 사냥꾼'이라는 별명을 얻었습니다."
 game_assistant_hoi4_general_text_scripted_loc176:0 "독일 '헤처' 구축전차는 낮고 은폐가 잘되었으며, Panzer 38(t) 섀시에 75mm 포를 장착했습니다."
 game_assistant_hoi4_general_text_scripted_loc177:0 "독일 '마르더' 자주 대전차포는 노획한 소련 76.2mm 포나 독일 75mm 포를 탑재했습니다."
 game_assistant_hoi4_general_text_scripted_loc178:0 "미국 M10 구축전차는 개방형 포탑에 76mm 포를 장착했으며, 장갑을 희생하고 속도를 택했습니다."
 game_assistant_hoi4_general_text_scripted_loc179:0 "미국 M18 헬캣 구축전차는 시속 88km에 도달하여 가장 빠른 궤도 장갑차 중 하나였습니다."
 game_assistant_hoi4_general_text_scripted_loc180:0 "영국 셔먼 파이어플라이는 셔먼 포탑에 17파운드 포를 장착하여 티거와 판터의 전면 장갑을 관통할 수 있었습니다."
 game_assistant_hoi4_general_text_scripted_loc181:0 "소련 KV-2 중전차는 152mm 곡사포를 장착했지만 포탑이 크고 무거웠으며 기계적 고장이 잦았습니다."
 game_assistant_hoi4_general_text_scripted_loc182:0 "독일 마우스 초중전차는 중량 188톤으로, 단 두 대의 프로토타입만 제작되었고 실전에 투입되지는 않았습니다."
 game_assistant_hoi4_general_text_scripted_loc183:0 "영국 TOG 전차는 1차 대전 시대의 설계를 가졌으며, 프로토타입만 제작되었고 양산되지는 않았습니다."
 game_assistant_hoi4_general_text_scripted_loc184:0 "일본 3식 치누 중전차는 75mm 포를 장착하여 셔먼 전차에 대응하기 위해 설계되었지만, 실전 배치가 너무 늦었습니다."
 game_assistant_hoi4_general_text_scripted_loc185:0 "영국 스텐 기관단총은 매우 간단하고 저렴하게 생산되었으며, 전쟁 중 400만 정 이상이 제작되었습니다."
 game_assistant_hoi4_general_text_scripted_loc186:0 "미국 M3 기관단총은 길쭉한 오일펌프 모양의 개머리판 때문에 '그리스 건'이라는 별명을 얻었으며, 신뢰성이 높았습니다."
 game_assistant_hoi4_general_text_scripted_loc187:0 "소련 AVS-36 자동소총은 소수만 시험되었으나 복잡성과 제어의 어려움으로 인해 SVT-40으로 대체되었습니다."
 game_assistant_hoi4_general_text_scripted_loc188:0 "FG42 공수소총은 반자동 또는 완전자동 사격이 가능했으며, 독일 공수부대를 위해 설계되었지만 복잡했습니다."
 game_assistant_hoi4_general_text_scripted_loc189:0 "M1 카빈은 개런드보다 가벼웠으며, 짧은 탄을 사용하여 장교, 지원 인력, 공수부대에 지급되었습니다."
 game_assistant_hoi4_general_text_scripted_loc190:0 "독일 판저파우스트는 일회용 무반동 대전차 무기로, 사거리는 짧았지만 두꺼운 장갑을 관통할 수 있었습니다."
 game_assistant_hoi4_general_text_scripted_loc191:0 "미국 바주카 로켓포는 북아프리카에서 처음 배치되었으며, 관형 발사 대전차 로켓은 독일의 판처슈렉 개발에 영향을 미쳤습니다."
 game_assistant_hoi4_general_text_scripted_loc192:0 "2차대전 수류탄 중, 독일 M24 막대 수류탄은 투척 거리가 더 길었고, 소련 F1 파편 수류탄은 파편 밀도가 높았습니다."
 game_assistant_hoi4_general_text_scripted_loc193:0 "'섹스턴' 자주포는 캐나다가 램 전차 섀시에 25파운드 포를 장착하여 간접 사격 지원용으로 제작했습니다."
 game_assistant_hoi4_general_text_scripted_loc194:0 "다련장 로켓포 중, 독일 15cm NbW 41은 연막탄과 고폭탄을 발사하며 날카로운 울음소리를 냈습니다."
 game_assistant_hoi4_general_text_scripted_loc195:0 "일본 89식 유탄발사기는 가볍고 곡사 사격이 가능한 무기로, 박격포와 수류탄 사이의 간극을 메웠습니다."
 game_assistant_hoi4_general_text_scripted_loc196:0 "독일 골리아트 궤도 지뢰는 원격 조종 파괴 차량으로, 유선 조종되어 폭약을 운반하여 지뢰밭과 장애물을 제거했습니다."
 game_assistant_hoi4_general_text_scripted_loc197:0 "미국 해군의 '헤지호그' 대잠 박격포는 24발의 폭뢰를 전방으로 발사했으며, 접촉 시 폭발하여 잠수함의 회피 기동에 대응했습니다."
 game_assistant_hoi4_general_text_scripted_loc198:0 "소나는 2차대전 중 함선에 널리 장착되었으며, 능동 음파를 사용하여 잠수함을 탐지하고 늑대 떼 전술에 대응했습니다."
 game_assistant_hoi4_general_text_scripted_loc199:0 "자기 및 음향 기뢰가 등장했으며, 함선은 소자 및 소음 감소가 필요했고, 연합군은 예인식 자기/음향 소해기를 개발했습니다."
 game_assistant_hoi4_general_text_scripted_loc200:0 "독일어로 'S-boot'(영국군은 E-boat라고 칭함)는 고속 어뢰정으로, 기동성이 뛰어나 수로 기습에 사용되었습니다."
  game_assistant_hoi4_general_text_scripted_loc201:0 "영국 '페어마일' 상륙정은 노르망디 상륙에 사용되었으며, 전차를 해변에 직접 운반할 수 있어 하역 속도를 높였습니다."
 game_assistant_hoi4_general_text_scripted_loc202:0 "미국 지프는 정찰, 지휘, 의무 후송 등 무한한 용도로 사용되었으며, 60만 대 이상이 생산되어 '전장의 택시'라는 별명을 얻었습니다."
 game_assistant_hoi4_general_text_scripted_loc203:0 "독일의 수륙양용 '퀴벨바겐' 82형은 비틀 섀시를 기반으로 했으며, 경량이고 실용적이며 다양한 지형에 적응했습니다."
 game_assistant_hoi4_general_text_scripted_loc204:0 "소련은 말을 광범위하게 견인용으로 사용했지만, 이후 미국이 공급한 차량으로 점차 기계화가 개선되었습니다."
 game_assistant_hoi4_general_text_scripted_loc205:0 "독일은 '아이언 뮬' 반궤도 오토바이를 사용했는데, 이는 오토바이와 궤도 요소를 결합하여 동부 전선의 험한 도로에서 정찰에 사용했습니다."
 game_assistant_hoi4_general_text_scripted_loc206:0 "Li-2 수송기는 DC-3의 소련 버전으로, 보급 투하와 공수 임무에 사용되었으며 야간 기습에도 널리 사용되었습니다."
 game_assistant_hoi4_general_text_scripted_loc207:0 "융커스 Ju 52 수송기는 주름진 두랄루민 외피를 가졌으며 견고하여 독일의 주요 공수 및 보급 수송기로 사용되었으나 큰 손실을 입었습니다."
 game_assistant_hoi4_general_text_scripted_loc208:0 "아라도 Ar 232 수송기는 착륙 장치에 소형 보조 바퀴가 있는 독특한 설계로 진흙 투성이의 비행장에서 사용할 수 있었습니다."
 game_assistant_hoi4_general_text_scripted_loc209:0 "미국 C-47 스카이트레인은 연합군 공수부대와 글라이더 견인을 위한 주요 수송기로, 모든 주요 공수 작전에 참여했습니다."
 game_assistant_hoi4_general_text_scripted_loc210:0 "영국 호르사 돌격 글라이더는 목재와 캔버스로 만들어졌으며 일회용으로, 보병을 착륙 지점에 직접 수송했습니다."
 game_assistant_hoi4_general_text_scripted_loc211:0 "발렌타인 보병 전차는 속도는 느리지만 장갑이 두꺼웠으며, 영국이 소련에 공급한 가장 많은 전차 중 하나였습니다."
 game_assistant_hoi4_general_text_scripted_loc212:0 "마틸다 II 보병 전차는 두꺼운 장갑으로 인해 북아프리카에서 추축군 대전차포에 큰 골칫거리가 되었습니다."
 game_assistant_hoi4_general_text_scripted_loc213:0 "크루세이더 순항 전차는 빠르지만 신뢰성 문제가 있었으며, 사막에서 전투보다 고장으로 더 많이 손실되었습니다."
 game_assistant_hoi4_general_text_scripted_loc214:0 "크롬웰 순항 전차는 75mm 포를 장착했으며 빠르고 기동성이 좋아 노르망디 이후 영국 기갑의 주력이 되었습니다."
 game_assistant_hoi4_general_text_scripted_loc215:0 "'코멧' 순항 전차는 77mm 포를 장착했으며, 크롬웰을 기반으로 전쟁 후반 독일 전차에 대응하기 위해 설계되었습니다."
 game_assistant_hoi4_general_text_scripted_loc216:0 "처칠 보병 전차는 두꺼운 장갑, 언덕 오르기, 참호 횡단 능력으로 유명했으며, 화염방사기와 공병 변형이 있었습니다."
 game_assistant_hoi4_general_text_scripted_loc217:0 "소련 IS-3 중전차는 쐐기형 전면 장갑을 특징으로 했으며, 베를린 승리 퍼레이드에 등장하여 서방 관찰자들을 놀라게 했습니다."
 game_assistant_hoi4_general_text_scripted_loc218:0 "독일 판터 IV는 전쟁 내내 지속적으로 생산된 유일한 독일 전차였으며, 후기형은 장포신 포를 받았습니다."
 game_assistant_hoi4_general_text_scripted_loc219:0 "독일 StuG III Ausf.G 돌격포는 무포탑 저형태로, 방어와 대전차 역할에 탁월했으며 10,000대 이상 생산되었습니다."
 game_assistant_hoi4_general_text_scripted_loc220:0 "미국 M3 리/그랜트 중형전차는 포탑에 37mm 포, 차체에 75mm 포를 장착한 임시 설계였습니다."
 game_assistant_hoi4_general_text_scripted_loc221:0 "미국 M24 채피 경전차는 75mm 포를 장착했으며 기동성이 뛰어나 정찰과 화력 지원을 개선했지만, 실전 배치가 늦었습니다."
 game_assistant_hoi4_general_text_scripted_loc222:0 "일본 특2식 내화정 '카미'는 수륙양용 전차로, 해군 상륙 부대가 섬의 해안 공격에 사용했습니다."
 game_assistant_hoi4_general_text_scripted_loc223:0 "독일 판터 II '링스'는 정찰용 변형으로, 빠르고 중첩된 로드휠을 가졌으며 약 100대만 생산되었습니다."
 game_assistant_hoi4_general_text_scripted_loc224:0 "'베스페' 자주곡사포는 판터 II 섀시에 105mm 곡사포를 장착하여 이동식 화력 지원을 제공했습니다."
 game_assistant_hoi4_general_text_scripted_loc225:0 "'후멜' 자주포는 혼합 섀시에 150mm 중곡사포를 장착했으며, 사거리가 길어 이동식 지원에 사용되었습니다."
 game_assistant_hoi4_general_text_scripted_loc226:0 "소련 ISU-152 중자주포는 대전차 무기와 벙커 파괴자 역할을 모두 수행했으며, '건물 파괴자'라는 별명을 얻었습니다."
 game_assistant_hoi4_general_text_scripted_loc227:0 "영국 아처 구축전차는 포신이 후방을 향해 있어 매복 위치에서 발사 후 빠르게 후퇴할 수 있었습니다."
 game_assistant_hoi4_general_text_scripted_loc228:0 "이탈리아 세모벤테 돌격포는 노후 전차 섀시에 중포를 장착하여 직접 화력 지원을 제공했으나 장갑이 약했습니다."
 game_assistant_hoi4_general_text_scripted_loc229:0 "독일 PAK 40 75mm 대전차포는 2차대전 독일군의 표준 대전차포로, 견인식 또는 차량 탑재형으로 사용되었습니다."
 game_assistant_hoi4_general_text_scripted_loc230:0 "소련 ZIS-3 76mm 야포는 다목적 무기로, 대전차와 간접 사격 모두에 효과적이었으며 간단하고 엄청난 수량으로 생산되었습니다."
 game_assistant_hoi4_general_text_scripted_loc231:0 "독일 88mm Flak 36 대공포는 대전차 역할에 탁월하여 많은 구축전차에 채택되었습니다."
 game_assistant_hoi4_general_text_scripted_loc232:0 "영국 25파운드 곡사포는 신속 장전을 위한 트레이를 사용했으며, 높은 연사력과 360도 회전이 가능하여 연대 포병의 핵심이었습니다."
 game_assistant_hoi4_general_text_scripted_loc233:0 "미국 M2A1 105mm 곡사포는 견고하고 신뢰성이 높았으며, 미군 사단 포병의 중추로 전후 수십 년간 사용되었습니다."
 game_assistant_hoi4_general_text_scripted_loc234:0 "소련 BM-31-12 로켓포는 트럭에 장착된 중형 M-31 로켓을 발사했으며, 폭발력과 범위가 더 컸습니다."
 game_assistant_hoi4_general_text_scripted_loc235:0 "독일 '히믈러 오르간'은 견인식 다련장 로켓포로, 무서운 소리와 넓은 산포도를 가졌습니다."
 game_assistant_hoi4_general_text_scripted_loc236:0 "미국 T34 '칼리오페'는 셔먼 전차에 60발의 로켓을 장착하여 강력한 집중 화력을 제공했습니다."
 game_assistant_hoi4_general_text_scripted_loc237:0 "소련의 대전차견 훈련은 개가 폭약을 싣고 적 전차 아래로 기어가도록 하는 것이었으나, 실제 효과는 제한적이었습니다."
 game_assistant_hoi4_general_text_scripted_loc238:0 "소련의 화염방사견 프로그램은 폭약을 실은 개를 사용했지만, 아군 디젤 엔진 전차와의 혼동으로 인해 중단되었습니다."
 game_assistant_hoi4_general_text_scripted_loc239:0 "미국은 '비둘기 유도 폭탄'을 개발했는데, 비둘기가 화면의 표적 이미지를 쪼는 방식이었으나 전자 유도 출현으로 취소되었습니다."
 game_assistant_hoi4_general_text_scripted_loc240:0 "영국의 '운하 방어등'은 전차에 장착된 강력한 탐조등으로, 야간에 적군을 눈부시게 하고 혼란시키는 데 사용되었습니다."
 game_assistant_hoi4_general_text_scripted_loc241:0 "호바트의 장난감들은 노르망디에서 지뢰 제거, 길 포설, 교량 돌파에 사용된 개조된 특수 장갑차들이었습니다."
 game_assistant_hoi4_general_text_scripted_loc242:0 "처칠 크로커다일 화염방사 전차는 차체 기관총을 화염 방사기로 교체했으며, 장거리 화염으로 벙커를 파괴할 수 있었습니다."
 game_assistant_hoi4_general_text_scripted_loc243:0 "독일 '슈프링어' 원격 조종 소형 전차는 330kg의 폭약을 탑재했으며, 원격 조종으로 표적에 접근하여 폭파했습니다."
 game_assistant_hoi4_general_text_scripted_loc244:0 "연합군은 '레드 볼 익스프레스' 트럭 호송 시스템을 구축하여 노르망디에서 진격하는 부대에 연료와 탄약을 신속히 공급했습니다."
 game_assistant_hoi4_general_text_scripted_loc245:0 "영국의 '플루토' 해저 파이프라인은 노르망디 이후에 부설되어 영국 해협을 가로질러 연료를 펌핑하여 유조선 의존도를 줄였습니다."
 game_assistant_hoi4_general_text_scripted_loc246:0 "독일의 합성 연료 산업은 석탄 수소화 및 피셔-트롭쉬 공정을 사용하여 항공 가솔린과 디젤을 생산했으며, 주요 폭격 목표가 되었습니다."
 game_assistant_hoi4_general_text_scripted_loc247:0 "루마니아의 플로이에슈티 유전은 추축국의 주요 석유 공급원이었으며, 미국의 집중 폭격으로 큰 피해를 입었습니다."
 game_assistant_hoi4_general_text_scripted_loc248:0 "독일에서 합성 고무 생산이 절정에 달했으며, 부나 공장은 천연 고무를 대체하기 위해 석탄을 원료로 사용했습니다."
 game_assistant_hoi4_general_text_scripted_loc249:0 "발트해 연안의 호박 방은 독일군에 의해 소련에서 해체되어 독일로 운송되었으며, 전후에 행방불명되어 오랜 보물 미스터리가 되었습니다."
 game_assistant_hoi4_general_text_scripted_loc250:0 "나치는 유럽 예술품을 조직적으로 약탈하여 '린처 존더아우프트라크' 컬렉션을 설립했으며, 수천 점의 그림을 모았습니다."
 game_assistant_hoi4_general_text_scripted_loc251:0 "미국의 렌드리스법은 연합국에 약 500억 달러 상당의 물자를 제공하여 추축국의 패배를 가속화했습니다."
 game_assistant_hoi4_general_text_scripted_loc252:0 "영국의 식량 배급은 1940년부터 1954년까지 지속되었으며, 빵은 1946년까지 배급되지 않았습니다."
 game_assistant_hoi4_general_text_scripted_loc253:0 "미국은 본토에서 휘발유와 타이어 배급을 시행했으며, 타이어 보호를 위해 전국적으로 시속 35마일의 '승리 속도' 제한을 두었습니다."
 game_assistant_hoi4_general_text_scripted_loc254:0 "독일은 수입 커피에 대한 봉쇄로 인한 부족으로 치커리와 도토리로 만든 '대용 커피'를 발명했습니다."
 game_assistant_hoi4_general_text_scripted_loc255:0 "영국 아이들은 전쟁 중 폭격을 피하기 위해 시골이나 해외로 대피시켰으며, '핏킨 아이들'로 알려졌습니다."
 game_assistant_hoi4_general_text_scripted_loc256:0 "프랑스 함락 후, 식량 부족으로 일부 시민들은 비밀 라디오 방송을 듣기 위해 자전거로 발전기를 돌려 전기를 생산했습니다."
 game_assistant_hoi4_general_text_scripted_loc257:0 "레닌그라드의 소련 식물 연구소 직원들은 포위전 중 종자 은행을 보호했으며, 종자를 먹지 않고 굶어 죽었습니다."
 game_assistant_hoi4_general_text_scripted_loc258:0 "나치의 '레벤스보른' 프로그램은 '순혈' 아이들의 출생을 촉진했으며, 사생아를 위한 가정을 설립했습니다."
 game_assistant_hoi4_general_text_scripted_loc259:0 "일본의 '만주 개척민'은 대규모로 만주로 이주했으며, 일본 패배 후 많은 개척민이 철수 과정에서 버려져 사망했습니다."
 game_assistant_hoi4_general_text_scripted_loc260:0 "일본은 전시에 '토나리구미' 인근 조합 제도를 시행하여 10가구를 한 조로 묶어 상호 감시, 물자 통제, 방공을 수행했습니다."
 game_assistant_hoi4_general_text_scripted_loc261:0 "미국의 '승리 정원' 운동은 주민들이 마당에 채소와 과일을 재배하도록 장려했으며, 정점에는 국내 농산물의 40%를 공급했습니다."
 game_assistant_hoi4_general_text_scripted_loc262:0 "캐나다 호위함, 주로 코르벳함은 대서양 전투에서 승무원 부족으로 큰 손실을 입었습니다."
 game_assistant_hoi4_general_text_scripted_loc263:0 "영국은 '보조 영토 근무대'를 통해 여성을 모집하여 레이더 플로팅 및 대공포 조준과 같은 중요한 역할을 맡겼습니다."
 game_assistant_hoi4_general_text_scripted_loc264:0 "나치의 강제 노동은 점령지에서 1,200만 명을 넘었으며, 잔혹한 조건에서 전쟁 생산을 하다가 죽음에 이르렀습니다."
 game_assistant_hoi4_general_text_scripted_loc265:0 "스틸웰 도로(레도 도로)는 인도 레도에서 버마를 거쳐 버마 도로까지 이어졌으며, 1945년에 개통되었습니다."
 game_assistant_hoi4_general_text_scripted_loc266:0 "털레이크와 같은 미국 수용소는 약 12만 명의 일본계 미국인을 억류했으며, 1944년에 제442 연대 전투단을 모집하기 시작했습니다."
 game_assistant_hoi4_general_text_scripted_loc267:0 "소련은 체첸인과 크림 타타르인과 같은 민족 전체를 협력 혐의로 추방하여 막대한 인구 손실을 초래했습니다."
 game_assistant_hoi4_general_text_scripted_loc268:0 "일본은 수십만 명의 노동자와 포로를 태국-버마 철도 건설에 강제 동원했으며, 10만 명 이상이 사망했습니다."
 game_assistant_hoi4_general_text_scripted_loc269:0 "난징 대학살 당시 존 래비와 같은 외국인들은 안전 지대를 설립하여 20만 명 이상의 중국 난민을 보호했습니다."
 game_assistant_hoi4_general_text_scripted_loc270:0 "하펑산은 비엔나 총영사로 재직하며 수천 명의 유대인에게 중국 비자를 발급하여 나치 박해를 피하도록 도왔습니다."
 game_assistant_hoi4_general_text_scripted_loc271:0 "스웨덴 외교관 라울 발렌베리는 부다페스트에서 보호 여권을 발급하여 수만 명의 헝가리 유대인을 구했으며 이후 체포되어 실종되었습니다."
 game_assistant_hoi4_general_text_scripted_loc272:0 "오스카 쉰들러는 자신의 공장을 통해 1,000명 이상의 유대인을 구했으며, 그의 명단과 이야기는 소설과 영화를 통해 널리 알려졌습니다."
 game_assistant_hoi4_general_text_scripted_loc273:0 "스기하라 치우네는 리투아니아 주재 일본 영사로, 명령을 어기고 유대인 난민에게 경유 비자를 발급하여 수천 명을 구했습니다."
 game_assistant_hoi4_general_text_scripted_loc274:0 "미하엘 비트만은 빌레르보카주에서 단독으로 많은 영국 차량을 파괴했으며, 여기에는 많은 수의 반궤도차량과 전차가 포함되었습니다."
 game_assistant_hoi4_general_text_scripted_loc275:0 "한스울리히 루델은 독일 슈투카 급강하 폭격기 에이스로, Ju 87로 2,500회 이상의 출격을 수행했으며 30회 피격당했지만 생존했습니다."
 game_assistant_hoi4_general_text_scripted_loc276:0 "에리히 하르트만은 352기의 격추 기록으로 역대 최고의 공중전 에이스이며, 거의 모두 동부 전선에서 기록했습니다."
 game_assistant_hoi4_general_text_scripted_loc277:0 "연합군 에이스 리처드 봉은 태평양에서 40대의 일본 항공기를 격추했으며, P-38 라이트닝을 조종했습니다."
 game_assistant_hoi4_general_text_scripted_loc278:0 "일본 에이스 사카이 사부로와 니시자와 히로요시는 후자가 80기 이상의 격추를 주장했으며, 사카이는 한쪽 눈을 잃었지만 전투에 복귀했습니다."
 game_assistant_hoi4_general_text_scripted_loc279:0 "여성 조종사 하나 라이치슈는 Me 163 로켓 비행기와 유인 V-1을 포함한 다양한 프로토타입을 시험 비행했습니다."
 game_assistant_hoi4_general_text_scripted_loc280:0 "티토 휘하의 유고슬라비아 빨치산은 독일의 대반란 작전에 맞서 자급자족하며 싸웠고, 이후 사회주의 연방을 수립했습니다."
 game_assistant_hoi4_general_text_scripted_loc281:0 "그리스 공산주의 저항 단체들은 망명 정부와 충돌했으며, 독일 철수 후 내전이 수년간 지속되었습니다."
 game_assistant_hoi4_general_text_scripted_loc282:0 "필리핀 게릴라는 일본군을 효과적으로 괴롭혔으며, 레이테 상륙 후 정보를 제공하고 일부 농촌 지역을 통제했습니다."
 game_assistant_hoi4_general_text_scripted_loc283:0 "벨라루스 빨치산은 철도를 파괴하여 '철도 전쟁' 작전을 수행했으며, 독일군 병참에 심각한 혼란을 초래했습니다."
 game_assistant_hoi4_general_text_scripted_loc284:0 "프랑스 레지스탕스는 D-Day 이전에 철도와 통신을 방해했으며, 독일군의 반격은 단선 병참에 의존하여 마비되었습니다."
 game_assistant_hoi4_general_text_scripted_loc285:0 "네덜란드 철도 파업은 독일의 식량 금수 조치로 이어져 1944-45년 겨울 기근, '헝거 윈터'를 초래했습니다."
 game_assistant_hoi4_general_text_scripted_loc286:0 "노르웨이 중수 방해 공작에서 코만도가 중수를 실은 페리를 침몰시켜 독일 핵 프로그램을 저해했습니다."
 game_assistant_hoi4_general_text_scripted_loc287:0 "프랑스 '노르망디-네멘' 전투기 연대는 자유 프랑스 조종사들로 구성되어 동부 전선에서 소련군과 함께 싸웠습니다."
 game_assistant_hoi4_general_text_scripted_loc288:0 "체코 망명 낙하산병들은 라인하르트 하이드리히를 암살했으며, 나치는 이에 대한 보복으로 리디체 마을을 파괴하고 모든 남성을 살해했습니다."
 game_assistant_hoi4_general_text_scripted_loc289:0 "도조 히데키는 패배가 임박한 1944년에 사임했으며, 고이소 구니아키와 스즈키 간타로가 뒤를 이어 총리가 되었습니다."
 game_assistant_hoi4_general_text_scripted_loc290:0 "히틀러는 1945년 4월 30일 베를린 퓌러엄폐호에서 자살했으며, 그의 시신은 포획을 막기 위해 불태워졌습니다."
 game_assistant_hoi4_general_text_scripted_loc291:0 "무솔리니는 1945년 4월 이탈리아 빨치산에 의해 체포되어 처형되었으며, 그의 시신은 밀라노에 전시되었습니다."
 game_assistant_hoi4_general_text_scripted_loc292:0 "일본 왕자 고노에 후미마로는 미국과 협상을 시도했으나 전쟁을 막는 데 실패했으며, 전후 자살했습니다."
 game_assistant_hoi4_general_text_scripted_loc293:0 "히믈러는 독일 패배 후 서방과 평화 협상을 시도했으나 거부당했고, 변장하여 도피를 시도하다 붙잡힌 후 독약으로 자살했습니다."
 game_assistant_hoi4_general_text_scripted_loc294:0 "괴링은 뉘른베르크에서 사형을 선고받았으나 집행 수시간 전에 시안화물로 자살했습니다. 그가 독약을 어떻게 입수했는지는 미스터리로 남아 있습니다."
 game_assistant_hoi4_general_text_scripted_loc295:0 "일본 육군 대신 아나미 고레치카는 천황의 항복 결정 후 할복 자살했으며, 그는 쿠데타 시도를 반대했지만 자결을 선택했습니다."
 game_assistant_hoi4_general_text_scripted_loc296:0 "나치 선전장관 요제프 괴벨스는 히틀러 자살 후 여섯 자녀에게 독약을 먹이고 아내와 함께 자살했습니다."
 game_assistant_hoi4_general_text_scripted_loc297:0 "마르틴 보어만은 베를린 탈출 과정에서 자살하거나 전사한 것으로 알려졌으며, 이후 DNA 분석으로 유해가 확인되었습니다."
 game_assistant_hoi4_general_text_scripted_loc298:0 "야마모토 이소로쿠는 1943년 일본 암호가 해독된 후 자신의 수송기가 미군 P-38에 요격되어 사망했습니다."
 game_assistant_hoi4_general_text_scripted_loc299:0 "국제 연합은 1945년에 설립되어 국제 연맹을 대체했으며, 안전보장이사회 상임이사국 체제가 확립되었습니다."
 game_assistant_hoi4_general_text_scripted_loc300:0 "전후 독일과 베를린은 분할 점령되었으며, 냉전 긴장으로 동서독으로 분단되어 1990년까지 지속되었습니다."
  game_assistant_hoi4_general_text_scripted_loc301:0 "마셜 플랜은 유럽 재건을 위한 미국의 원조 프로그램으로, 약 130억 달러를 제공하여 서유럽의 급속한 경제 회복을 이끌었습니다."
 game_assistant_hoi4_general_text_scripted_loc302:0 "일본의 전후 헌법은 전쟁 포기 조항인 제9조를 포함하며, 연합군 점령 하에 작성되어 1947년에 발효되었습니다."
 game_assistant_hoi4_general_text_scripted_loc303:0 "도쿄 재판은 2년 이상 지속되었으며, 28명의 A급 전범이 재판을 받았고, 도조 히데키를 포함한 7명이 교수형에 처해졌습니다."
 game_assistant_hoi4_general_text_scripted_loc304:0 "많은 나치 과학자들이 페이퍼클립 작전을 통해 미국으로 이송되었으며, 여기에는 로켓 엔지니어 베르너 폰 브라운도 포함되었습니다."
 game_assistant_hoi4_general_text_scripted_loc305:0 "제2차 세계 대전은 전 세계적으로 약 7,000만 명의 군인과 민간인 사망자를 초래했으며, 소련은 2,700만 명 이상, 중국은 1,000만 명 이상의 손실을 입었습니다."
 game_assistant_hoi4_general_text_scripted_loc306:0 "폴란드는 가장 높은 비율의 손실을 입었으며, 인구의 약 6분의 1이 사망하고 바르샤바는 대부분 파괴되었습니다."
 game_assistant_hoi4_general_text_scripted_loc307:0 "홀로코스트는 약 600만 명의 유대인을 조직적으로 살해했으며, 이는 유럽 유대인 인구의 3분의 2에 해당합니다."
 game_assistant_hoi4_general_text_scripted_loc308:0 "나치의 'T4' 프로그램은 장애인에 대한 '안락사'를 자행했으며, 이는 학살 수용소 기술의 전조가 되었고 7만 ~ 30만 명의 희생자가 발생했습니다."
 game_assistant_hoi4_general_text_scripted_loc309:0 "로마인도 나치에 의해 등록되고 학살되었으며, 사망자 수는 22만 ~ 50만 명으로 추산됩니다."
 game_assistant_hoi4_general_text_scripted_loc310:0 "몬테카시노 수도원은 연합군의 폭격으로 폐허가 되었으며, 독일 공수부대는 그 폐허를 이용하여 완강히 방어했습니다."
 game_assistant_hoi4_general_text_scripted_loc311:0 "안치오 상륙은 독일군의 맹렬한 반격에 직면했으며, 연합군은 교두보에서 수개월간 갇혀 있다가 마침내 돌파했습니다."
 game_assistant_hoi4_general_text_scripted_loc312:0 "고딕 선은 이탈리아 북부를 가로질렀으며, 독일군은 1945년 봄에 완전히 돌파될 때까지 완강히 방어했습니다."
 game_assistant_hoi4_general_text_scripted_loc313:0 "독일군은 이탈리아의 마르차보토 등지에서 민간인을 학살하여 빨치산 활동에 대한 보복을 했습니다."
 game_assistant_hoi4_general_text_scripted_loc314:0 "핀란드는 계속 전쟁에서 소련에 대항하여 독일 편에서 싸웠지만 레닌그라드 포위전에는 참여하지 않았으며, 이후 독일군과 싸웠습니다."
 game_assistant_hoi4_general_text_scripted_loc315:0 "라플란드 전쟁에서 핀란드는 독일과의 관계를 단절했으며, 독일군은 철수하는 동안 초토화 작전을 펼쳐 많은 도시를 파괴했습니다."
 game_assistant_hoi4_general_text_scripted_loc316:0 "불가리아는 2차대전 중 소련에 선전포고를 하지 않았지만 영토 통제를 위해 추축국에 가입했으며, 1944년에 편을 바꿨습니다."
 game_assistant_hoi4_general_text_scripted_loc317:0 "안토네스쿠 치하의 루마니아는 추축국에 가입하여 동부 전선에 많은 병력을 투입했으며, 쿠데타 후 편을 바꿔 독일에 선전포고했습니다."
 game_assistant_hoi4_general_text_scripted_loc318:0 "헝가리 화살십자당이 권력을 잡고 독일 편에서 계속 싸웠으며, 부다페스트 포위전은 큰 사상자를 냈습니다."
 game_assistant_hoi4_general_text_scripted_loc319:0 "1944년 슬로바키아 민족 봉기가 일어났으며, 독일군은 신속히 진압했지만 산악 지역의 저항은 해방될 때까지 계속되었습니다."
 game_assistant_hoi4_general_text_scripted_loc320:0 "크로아티아 우스타샤 정권은 잔혹한 인종 박해를 자행하여 많은 수의 세르비아인, 유대인, 로마인을 살해했습니다."
 game_assistant_hoi4_general_text_scripted_loc321:0 "1941년, 독일 '브란덴부르크' 특수부대는 적군 제복을 입고 침투하여 방해 공작을 수행했으며, 여러 전선에서 활동했습니다."
 game_assistant_hoi4_general_text_scripted_loc322:0 "일본 나카노 학교는 비밀 육군 정보 학교로, 간첩과 잠입자를 훈련시켜 정보 활동과 방해 공작을 수행했습니다."
 game_assistant_hoi4_general_text_scripted_loc323:0 "영국 SAS 창설자 데이비드 스털링은 북아프리카에서 장거리 사막 기습 작전을 개척하여 적진 깊숙이 침투해 비행장을 공격했습니다."
 game_assistant_hoi4_general_text_scripted_loc324:0 "롱 레인지 사막 정찰대는 무장 지프를 사용하여 정찰과 기습을 수행했으며, 윌슨과 스털링과 같은 인물들이 이끌었습니다."
 game_assistant_hoi4_general_text_scripted_loc325:0 "미국-캐나다 '악마 여단' 특수부대는 이탈리아 산악 지대에서 뛰어난 활약을 펼쳤으며, 높은 사상자를 냈습니다."
 game_assistant_hoi4_general_text_scripted_loc326:0 "이탈리아 폴고레 공수사단은 파시스트 부대였지만 일부는 반독일 저항에 참여하여 복잡한 상황을 보여주었습니다."
 game_assistant_hoi4_general_text_scripted_loc327:0 "독일 제13 무장 친위대 '한드샤르' 사단은 보스니아 무슬림으로 구성되었으며, 잔혹한 대반란 작전을 수행했습니다."
 game_assistant_hoi4_general_text_scripted_loc328:0 "수바스 찬드라 보스가 이끄는 인도 국민군은 일본과 협력했으며, 포로와 교민으로 구성되어 영국에 맞서 싸우는 것을 목표로 했습니다."
 game_assistant_hoi4_general_text_scripted_loc329:0 "아자드 힌드 임시 정부는 추축국에 의해 승인되었지만 일본의 패배와 함께 붕괴되었고, 보스는 비행기 사고로 사망했습니다."
 game_assistant_hoi4_general_text_scripted_loc330:0 "버마 지도자 아웅 산은 처음에 일본과 협력하여 독립군을 형성했지만, 이후 편을 바꿔 일본에 맞서 싸웠습니다."
 game_assistant_hoi4_general_text_scripted_loc331:0 "비시 프랑스는 식민지를 통제했으며, 북아프리카 비시 프랑스는 이후 연합군에 합류하여 프랑스 전역이 독일군에 완전히 점령되었습니다."
 game_assistant_hoi4_general_text_scripted_loc332:0 "달랑 제독은 비시 인물로, 북아프리카 상륙 당시 알제에 우연히 있었고 이후 암살되어 그의 역할이 종료되었습니다."
 game_assistant_hoi4_general_text_scripted_loc333:0 "영국은 독일의 이용을 막기 위해 선제적으로 아이슬란드와 페로 제도를 점령했으며, 아이슬란드는 주권을 유지했습니다."
 game_assistant_hoi4_general_text_scripted_loc334:0 "스위스는 전쟁 중 양측 항공기를 격추했으며, 독일의 보급 봉쇄에 직면했고 금융 시스템은 나치 금을 받아들였습니다."
 game_assistant_hoi4_general_text_scripted_loc335:0 "스웨덴은 중립을 유지했지만 독일군의 통과를 허용했으며, 이후 연합국 지원과 노르웨이 저항군 훈련으로 전환했습니다."
 game_assistant_hoi4_general_text_scripted_loc336:0 "스페인은 공식적으로 전쟁에 참여하지 않았지만 푸른 사단 자원 부대를 동부 전선에 파견했으며, 약 45,000명이 교대로 참여했습니다."
 game_assistant_hoi4_general_text_scripted_loc337:0 "포르투갈은 중립을 유지했지만, 이후 아소르스를 연합군에 대잠 및 공군 기지로 임대했습니다."
 game_assistant_hoi4_general_text_scripted_loc338:0 "터키는 1945년까지 중립을 유지하다가 독일과 일본에 선전포고하여 유엔에 가입했습니다."
 game_assistant_hoi4_general_text_scripted_loc339:0 "아르헨티나는 전쟁 말기에만 추축국에 선전포고했으며, 전후 많은 나치의 피난처가 되었습니다."
 game_assistant_hoi4_general_text_scripted_loc340:0 "교황 비오 12세는 홀로코스트 동안 신중하게 침묵을 지켰지만, 교회 조직은 비공개로 많은 유대인과 난민을 보호했습니다."
 game_assistant_hoi4_general_text_scripted_loc341:0 "페니실린의 대량 생산은 2차대전 중에 달성되었으며, 노르망디 상륙 시점에는 충분한 양이 확보되어 감염으로 인한 사망을 극적으로 줄였습니다."
 game_assistant_hoi4_general_text_scripted_loc342:0 "DDT는 발진티푸스와 말라리아 방제에 사용되어 나폴리와 태평양 섬에서 수많은 생명을 구했습니다."
 game_assistant_hoi4_general_text_scripted_loc343:0 "혈액 분획 및 동결건조 혈장 기술이 성숙하여 전장 수혈이 가능해졌고, 생존율이 향상되었습니다."
 game_assistant_hoi4_general_text_scripted_loc344:0 "독일군은 각성제(페르비틴)를 널리 사용하여 경계 태세를 유지했지만, 장기간 사용은 심각한 부작용을 초래했습니다."
 game_assistant_hoi4_general_text_scripted_loc345:0 "미국은 '승리 비타민'과 기타 식이 보충제를 개발했으며, K-레이션 및 C-레이션과 같은 전장 식량은 휴대와 배급이 용이했습니다."
 game_assistant_hoi4_general_text_scripted_loc346:0 "독일은 프리츠 X 무선 유도 폭탄을 생산하여 이탈리아 전함 로마를 크게 손상시켰습니다."
 game_assistant_hoi4_general_text_scripted_loc347:0 "미국의 '박쥐' 활공 폭탄은 레이더 유도 대함 무기로, 전쟁 말기에 제한적으로 사용되었습니다."
 game_assistant_hoi4_general_text_scripted_loc348:0 "HS 293은 독일의 무선/TV 유도 대함 미사일로 여러 척의 선박을 격침시켰지만 교란에 취약했습니다."
 game_assistant_hoi4_general_text_scripted_loc349:0 "연합군이 개발한 근접 신관은 표적 근처에서 포탄을 폭발시켜 대공포와 야포의 효과를 크게 향상시켰습니다."
 game_assistant_hoi4_general_text_scripted_loc350:0 "독일의 '판터' 전차는 지휘관 컵라에 장착된 적외선 야간 투시 장치 '스패로호크'를 갖추었으며, 탐조등 장착 차량과 함께 사용되었습니다."
 game_assistant_hoi4_general_text_scripted_loc351:0 "독일 호르텐 Ho 229는 제트 비행 날개 프로토타입으로 레이더 반사 면적이 작았으며, 전후 미군에 의해 노획되어 연구되었습니다."
 game_assistant_hoi4_general_text_scripted_loc352:0 "일본 '킷카' 제트 공격기는 Me 262의 복제품으로, 전쟁이 끝날 때까지 단 한 번의 시험 비행만 이루어졌습니다."
 game_assistant_hoi4_general_text_scripted_loc353:0 "영국은 12,000파운드 '톨보이' 지진 폭탄을 개발하여 전함 티르피츠를 격침시켰습니다."
 game_assistant_hoi4_general_text_scripted_loc354:0 "22,000파운드 '그랜드 슬램' 지진 폭탄은 지하로 관통하여 U-보트 벙커와 교량을 파괴하는 데 사용되었습니다."
 game_assistant_hoi4_general_text_scripted_loc355:0 "연합군의 전략 폭격은 '윈도우' 레이더 교란(알루미늄 스트립)을 사용하여 독일 레이더 화면에 허상으로 가득 채웠습니다."
 game_assistant_hoi4_general_text_scripted_loc356:0 "독일은 방공용 '바서팔' 수직 발사 지대공 미사일을 개발했지만 실전 배치되지는 않았습니다."
 game_assistant_hoi4_general_text_scripted_loc357:0 "일본 육군 4식 '하야테' 전투기는 성능이 좋았지만, 제조 품질 불량과 엔진 문제로 어려움을 겪었습니다."
 game_assistant_hoi4_general_text_scripted_loc358:0 "신덴은 일본의 카나드 전투기 설계로 B-29 요격을 목표로 했으며, 프로토타입만 완성되고 양산되지는 않았습니다."
 game_assistant_hoi4_general_text_scripted_loc359:0 "G4M '베티'는 일본 해군의 쌍발 폭격기로, 연료탱크 장갑 부족으로 인해 잘 붙는 특성이 있었습니다."
 game_assistant_hoi4_general_text_scripted_loc360:0 "일본 '세이란'은 I-400 잠수함에 탑재된 수상기 공격기로, 파나마 운하 수문을 공격하기 위해 설계되었습니다."
 game_assistant_hoi4_general_text_scripted_loc361:0 "미국은 노획한 제로센을 이용하여 F6F 헬캣을 개량했으며, 이는 제로센을 완전히 능가했습니다."
 game_assistant_hoi4_general_text_scripted_loc362:0 "F4U 콜세어는 역갈매기 날개와 높은 속도를 특징으로 하여 후기 섬 작전에서 미군 항공력의 주력이 되었습니다."
 game_assistant_hoi4_general_text_scripted_loc363:0 "F6F 헬캣은 튼튼한 프레임과 강력한 엔진으로 매우 높은 격추율을 달성하여 일본 해군 항공력을 효과적으로 파괴했습니다."
 game_assistant_hoi4_general_text_scripted_loc364:0 "영국 '바라쿠다' 함상 급강하 폭격기는 높은 어깨 날개를 특징으로 했으며, 티르피츠 공격에서 직접 명중을 기록했습니다."
 game_assistant_hoi4_general_text_scripted_loc365:0 "그루먼이 제작한 어벤저 어뢰 폭격기는 어뢰와 폭뢰를 탑재했으며, 3인승으로 생존성으로 유명했습니다."
 game_assistant_hoi4_general_text_scripted_loc366:0 "독일 Ju 188은 Ju 88의 후계기로, 더 높은 출력의 엔진과 개선된 조종석을 가졌지만 제한된 수량만 생산되었습니다."
 game_assistant_hoi4_general_text_scripted_loc367:0 "독일 Do 217 폭격기는 더 큰 탑재량을 가졌으며, 유도 폭탄을 탑재하여 대함 및 야간 기습에 사용되었습니다."
 game_assistant_hoi4_general_text_scripted_loc368:0 "소련 Il-2 '날아다니는 전차' 지상 공격기는 저고도 지원을 위해 중장갑을 갖추었으며, 36,000대 이상 생산되었습니다."
 game_assistant_hoi4_general_text_scripted_loc369:0 "소련 Yak-3 전투기는 경량이고 기동성이 뛰어나 저고도 격투전에 탁월하여 독일 조종사들이 두려워했습니다."
 game_assistant_hoi4_general_text_scripted_loc370:0 "La-5 및 La-7 전투기는 공랭식 엔진을 사용하여 성능이 향상되었으며, 소련 근위대의 주력이 되었습니다."
 game_assistant_hoi4_general_text_scripted_loc371:0 "독일 Me 163 로켓 요격기는 놀라운 상승률을 가졌지만, 연료가 위험하고 지속 시간이 매우 짧았습니다."
 game_assistant_hoi4_general_text_scripted_loc372:0 "독일 바헴 Ba 349 '나터'는 수직 발사 로켓 요격기였으며, 유일한 유인 시험 비행은 실패했습니다."
 game_assistant_hoi4_general_text_scripted_loc373:0 "일본 '슈스이'는 Me 163의 복제품으로, 시험 비행이 추락하면서 프로젝트가 종료되었습니다."
 game_assistant_hoi4_general_text_scripted_loc374:0 "일본은 고폭탄이나 소이탄을 탑재한 '풍선 폭탄'을 사용하여 태평양을 표류시켜 북미를 폭격했습니다."
 game_assistant_hoi4_general_text_scripted_loc375:0 "영국은 '윈도우'를 사용하여 레이더를 교란했으며, 독일은 '빌데 자우' 전술로 대응하여 주파수를 전환했습니다."
 game_assistant_hoi4_general_text_scripted_loc376:0 "독일 야간 전투기에는 '리히텐슈타인' 공중 레이더가 장착되었으며, 위쪽으로 발사하는 '슈레게 무지크' 기관포가 있었습니다."
 game_assistant_hoi4_general_text_scripted_loc377:0 "영미 야간 폭격기는 H2S 지형 매핑 레이더를 탑재했으며, 구름을 뚫고 표적을 식별할 수 있었습니다."
 game_assistant_hoi4_general_text_scripted_loc378:0 "독일은 연합군 H2S 신호를 요격하기 위해 '낙소스' 수동 레이더 수신기를 개발하여 요격기를 유도했습니다."
 game_assistant_hoi4_general_text_scripted_loc379:0 "지프가 견인하는 '롱 톰' 155mm 포는 장거리 화력을 제공했으며, 미군이 장거리 억제에 일반적으로 사용했습니다."
 game_assistant_hoi4_general_text_scripted_loc380:0 "소련 B-4 203mm 곡사포는 요새 돌파에 사용되었으며, 100kg 포탄은 시가전에서 건물을 파괴할 수 있었습니다."
 game_assistant_hoi4_general_text_scripted_loc381:0 "독일 카를게레트 박격포는 600mm 구경으로, 궤도식 자주 포였으며 무거운 콘크리트 관통 포탄을 발사했습니다."
 game_assistant_hoi4_general_text_scripted_loc382:0 "일본 98식 320mm 박격포는 간단하고 강력했으며, 이오지마와 오키나와에서 사용되었습니다."
 game_assistant_hoi4_general_text_scripted_loc383:0 "미국 M1 240mm 곡사포는 '블랙 드래곤'이라는 별명으로, 강력하게 요새화된 진지를 제거하는 데 사용되었습니다."
 game_assistant_hoi4_general_text_scripted_loc384:0 "리-엔필드 No.4 소총은 생산을 단순화했으며, 사용하기 쉬운 가늠자, Mk7 첨두탄, 10발 탄창을 갖추었습니다."
 game_assistant_hoi4_general_text_scripted_loc385:0 "PU 스코프가 장착된 모신나강 M91/30 저격수 변형은 소련 저격수들이 널리 사용했으며, 신뢰성과 정확성으로 유명했습니다."
 game_assistant_hoi4_general_text_scripted_loc386:0 "독일 Kar98k 소총은 표준 마우저 카빈으로, 정확했지만 연사력이 낮았으며 유탄발사기와 스코프를 장착할 수 있었습니다."
 game_assistant_hoi4_general_text_scripted_loc387:0 "일본 38식 소총은 6.5mm 탄을 사용했으며, 방진 덮개가 있었고 긴 총열로 총검술에 적합했으며, 이후 99식으로 대체되었습니다."
 game_assistant_hoi4_general_text_scripted_loc388:0 "99식 소총은 7.7mm 탄을 사용했으며, 총열이 더 짧아 생산이 용이했지만 과도한 위력과 큰 발화광이 있었습니다."
 game_assistant_hoi4_general_text_scripted_loc389:0 "미국 M1911A1 권총은 .45 ACP 탄을 사용하여 저지력이 뛰어났으며, 장교와 차량 승무원의 사이드암으로 사용되었습니다."
 game_assistant_hoi4_general_text_scripted_loc390:0 "독일 발터 P38은 더블액션 첫 발 권총으로 신뢰성이 높아 루거 P08을 대체하여 표준 사이드암이 되었습니다."
 game_assistant_hoi4_general_text_scripted_loc391:0 "루거 P08 권총은 독특한 토글락 작동 방식과 독특한 외관으로 유명했으며, 많은 수가 전쟁 트로피로 집에 가져갔습니다."
 game_assistant_hoi4_general_text_scripted_loc392:0 "소련 TT-33 토카레프 권총은 고속 7.62×25mm 탄을 발사하여 관통력이 뛰어났습니다."
 game_assistant_hoi4_general_text_scripted_loc393:0 "일본 남부 14식 권총은 높은 고장률과 나쁜 설계로 인해 '자살에도 부적합하다'는 평판을 받았습니다."
 game_assistant_hoi4_general_text_scripted_loc394:0 "독일 M24 막대 수류탄은 분리 가능한 나무 손잡이를 가졌으며, 여러 개를 결합하여 대전차용 다발 장약을 만들 수 있었습니다."
 game_assistant_hoi4_general_text_scripted_loc395:0 "연합군의 '달라붙는 폭탄'은 점착성 코팅이 된 대전차 수류탄으로, 장갑에 붙은 후 폭발했습니다."
 game_assistant_hoi4_general_text_scripted_loc396:0 "핀란드인에 의해 명명된 화염병은 휘발유를 담은 유리병으로, 초기 전차를 무력화하는 데 사용되었습니다."
 game_assistant_hoi4_general_text_scripted_loc397:0 "독일의 자기 대전차 지뢰는 장갑에 수동으로 부착해야 했으며, 성형작약으로 두꺼운 장갑을 관통할 수 있었습니다."
 game_assistant_hoi4_general_text_scripted_loc398:0 "실험적인 방탄복이 사용되었는데, 예를 들어 미국 조종사를 위한 '플랙 재킷'은 파편을 막기 위한 것이었지만 무겁고 드물었습니다."
 game_assistant_hoi4_general_text_scripted_loc399:0 "독일 돌격 공병은 강철 헬멧과 흉갑을 착용했으며, 기관단총과 수류탄을 사용하여 참호를 돌격했습니다."
 game_assistant_hoi4_general_text_scripted_loc400:0 "일본군 전투기의 군기(울부짖는 깃발)는 부대의 영혼으로서 기수들이 보호했으며, 이로 인해 집중 사격의 주요 표적이 되었습니다."
  game_assistant_hoi4_general_text_scripted_loc401:0 "파푸아뉴기니의 코코다 트랙 작전은 매우 험난했으며, 열대성 질병으로 인한 호주군 손실이 전투 사상자를 훨씬 초과했습니다."
 game_assistant_hoi4_general_text_scripted_loc402:0 "과달카날 작전 중 미군과 일본 해군은 수많은 야간 해전을 벌였으며, 철저 수역은 오늘날까지 난파선이 밀집하여 다이빙 명소로 남아 있습니다."
 game_assistant_hoi4_general_text_scripted_loc403:0 "알류샨 열도 작전에서 일본군은 애투 섬을 점령했으며, 미군이 탈환할 때 일본군은 만세 돌격을 감행하여 전멸했습니다."
 game_assistant_hoi4_general_text_scripted_loc404:0 "타라와 전투에서 미군은 3일 만에 약 3,000명의 사상자를 냈으며, 일본 수비대는 17명의 포로를 제외하고 전멸했습니다."
 game_assistant_hoi4_general_text_scripted_loc405:0 "콰잘레인 환초 전투에서 미군은 전차-보병 협동을 사용하여 섬을 하나씩 점령했으며, 섬 건너뛰기 전술의 병참을 검증했습니다."
 game_assistant_hoi4_general_text_scripted_loc406:0 "사이판 전투 후반기에 일본군의 '옥쇄' 선전에 힘입어 많은 민간인이 절벽에서 투신 자살했습니다."
 game_assistant_hoi4_general_text_scripted_loc407:0 "티니언 섬이 미군에 점령된 후 B-29 비행장이 신속히 건설되었으며, 원자폭탄이 그곳에서 탑재되어 이륙했습니다."
 game_assistant_hoi4_general_text_scripted_loc408:0 "펠렐리우 전투는 유난히 잔혹했으며, 일본군은 복잡한 동굴 체계를 고수했고, 미군 계획자는 빠른 승리를 예상했지만 수개월이 걸렸습니다."
 game_assistant_hoi4_general_text_scripted_loc409:0 "마닐라 전투는 필리핀 민간인과 미군에게 큰 희생을 강요했으며, 도시는 폐허가 되었고 약 10만 명의 민간인이 사망했습니다."
 game_assistant_hoi4_general_text_scripted_loc410:0 "루손 작전에서 일본군은 장기 방어 전략을 채택하여 산속으로 후퇴했으며, 야마시타 도모유키의 부대는 항복할 때까지 저항했습니다."
 game_assistant_hoi4_general_text_scripted_loc411:0 "브루나이와 보르네오 상륙은 호주군이 주도했으며, 유전을 탈환했지만 시설이 파괴된 것을 발견했습니다."
 game_assistant_hoi4_general_text_scripted_loc412:0 "임팔-코히마 전투에서 일본군은 보급 실패로 인해 막대한 손실을 입었으며, '하얀 뼈의 길'로 알려졌습니다."
 game_assistant_hoi4_general_text_scripted_loc413:0 "밀른만 전투는 일본군 상륙이 처음으로 격퇴된 사례로, 호주군과 미군이 정글에서 완강히 방어했습니다."
 game_assistant_hoi4_general_text_scripted_loc414:0 "케이프요크의 혼 섬 비행장은 북부 호주의 연합군 전진 기지였으며, 일본의 공습을 받았지만 상륙되지는 않았습니다."
 game_assistant_hoi4_general_text_scripted_loc415:0 "I-400 잠수함 항공모함은 파나마 운하를 공격할 계획이었으나 일본의 항복으로 취소되었으며, 3척이 미군에 노획되어 연구되었습니다."
 game_assistant_hoi4_general_text_scripted_loc416:0 "독일 루르 댐에 대한 연합군의 '차스티즈 작전'은 바운싱 폭탄을 사용하여 뫼네 댐과 에데르제 댐을 붕괴시켰습니다."
 game_assistant_hoi4_general_text_scripted_loc417:0 "베모르크의 노르웨이 중수 공장은 영국 코만도에 의해 두 차례 공격을 받았으며, 결국 중수를 실은 페리가 침몰되었습니다."
 game_assistant_hoi4_general_text_scripted_loc418:0 "바르샤바 게토 봉기에서 소수의 무장 유대인이 독일의 진압에 거의 한 달간 저항했으며, 대다수가 살해되었습니다."
 game_assistant_hoi4_general_text_scripted_loc419:0 "트레블링카 학살 수용소 봉기에서 수감자들이 무기를 탈취하고 화재를 일으켰으며, 일부는 탈출하여 전쟁에서 살아남았습니다."
 game_assistant_hoi4_general_text_scripted_loc420:0 "소비보르 학살 수용소 봉기는 소련 포로가 주도했으며, 수백 명이 탈출했지만 대부분이 사냥되어 약 50명이 생존했습니다."
 game_assistant_hoi4_general_text_scripted_loc421:0 "영국군이 베르겐-벨젠 수용소를 해방했을 때, 수천 구의 매장되지 않은 시신을 발견하여 홀로코스트의 공포를 드러냈습니다."
 game_assistant_hoi4_general_text_scripted_loc422:0 "다하우 수용소는 최초의 나치 수용소로, 다양한 박해의 시험장 역할을 했으며 미군에 의해 해방되었습니다."
 game_assistant_hoi4_general_text_scripted_loc423:0 "마우트하우젠 수용소의 '죽음의 계단'에서 수감자들은 석재 블록을 계단 위로 나르다가 종종 오락을 위해 밀쳐졌습니다."
 game_assistant_hoi4_general_text_scripted_loc424:0 "일본군 포로 수용소는 연합군 포로를 극도로 잔혹하게 대우했으며, 예를 들어 루존의 카바나투안 수용소와 바탄 죽음의 행진이 있습니다."
 game_assistant_hoi4_general_text_scripted_loc425:0 "일본군은 바탄 이후 포로들을 환기되지 않은 화차에 강제 수송하여 많은 사망자를 냈으며, 이는 '지옥선'으로 알려졌습니다."
 game_assistant_hoi4_general_text_scripted_loc426:0 "영국의 '제리코 작전'은 아미엥 감옥에 대한 공습으로, 저고도 정밀 폭격으로 벽에 구멍을 내어 레지스탕스成员이 탈출할 수 있게 했습니다."
 game_assistant_hoi4_general_text_scripted_loc427:0 "미국의 '플라잉 타이거즈'는 중국의 미국 자원군이었으며, P-40의 상어 얼굴 도안은 북아프리카에서 유래했습니다."
 game_assistant_hoi4_general_text_scripted_loc428:0 "플라잉 타이거즈 사령관 클레어 첼노는 전술 경보망을 고안하여 소수의 항공기로 일본군에 대응했습니다."
 game_assistant_hoi4_general_text_scripted_loc429:0 "소련 제588 야간 폭격 연대 '밤의 마녀들'은 예브도키야 베르샨스카야가 지휘했으며, 약 24,000회 출격했습니다."
 game_assistant_hoi4_general_text_scripted_loc430:0 "어니스트 헤밍웨이는 종군 기자로서 프랑스에서 전투 작전에 참여했으며, 비공식적으로 무기를 들고 논란을 일으켰습니다."
 game_assistant_hoi4_general_text_scripted_loc431:0 "독일 U-보트는 비밀리에 보급품과 기술 인력을 일본에 수송했으며, 잠수함과 제트 기술을 교환하려 했습니다."
 game_assistant_hoi4_general_text_scripted_loc432:0 "일본 잠수함 I-29와 I-8은 일본과 독일 간의 장거리 왕복 항해를 완료하여 텅스텐과 설계도 같은 전략 물자를 교환했습니다."
 game_assistant_hoi4_general_text_scripted_loc433:0 "독일 잠수함 U-234는 일본 항복 당시 항해 중이었으며, 우라늄 산화물과 제트 엔진 설계도를 싣고 미군에 항복했습니다."
 game_assistant_hoi4_general_text_scripted_loc434:0 "미국 중순양함 USS 인디애나폴리스는 원자폭탄 부품을 수송한 후 일본 잠수함에 격침되어 큰 인명 손실을 입었습니다."
 game_assistant_hoi4_general_text_scripted_loc435:0 "일본의 '가미카제' 특공기는 레이테 만 해전에서 처음으로 조직적으로 사용되어 호위항모 USS 세인트로를 타격했습니다."
 game_assistant_hoi4_general_text_scripted_loc436:0 "이후 수천 대의 가미카제 항공기가 출격하여 미군에게 큰 사상자를 입혔지만 전세를 바꾸지는 못했습니다."
 game_assistant_hoi4_general_text_scripted_loc437:0 "'오카' 로켓 동력 유인 폭탄은 모기에서 발사되어 표적에서 수 킬로미터 떨어진 곳에서 분리되었으며, 요격이 매우 어려웠습니다."
 game_assistant_hoi4_general_text_scripted_loc438:0 "'신요' 폭발 모터보트는 작고 나무로 만들어진 자살 선박으로, 일본 본토 방어를 위해 해안 동굴에 숨겨져 있었습니다."
 game_assistant_hoi4_general_text_scripted_loc439:0 "'후류류' 자살 잠수부는 폭약을 휴대한 개구리 병사로, 해저에 잠복하여 상륙정이 지나갈 때 폭파했습니다."
 game_assistant_hoi4_general_text_scripted_loc440:0 "독일은 수많은 RAD(독일 노동 전선) 방공 보조 부대를 편성하여 본토 방어에 사용했으며, 노후 및 노획 무기로 방공을 수행했습니다."
 game_assistant_hoi4_general_text_scripted_loc441:0 "'폴크스슈투름'은 독일의 최후의 발악적인 노인과 청소년 동원으로, 장비가 열악하고 큰 손실을 입었습니다."
 game_assistant_hoi4_general_text_scripted_loc442:0 "독일은 사전 파편화된 콘크리트나 철제 외피를 사용한 '폴크스한트그라나테'를 개발하여 극도로 단순화했습니다."
 game_assistant_hoi4_general_text_scripted_loc443:0 "마지막 마우저 소총인 폴크스슈투름게베어는 폴크스슈투름을 위해 급조된 반자동 소총으로, 극도로 단순화되었습니다."
 game_assistant_hoi4_general_text_scripted_loc444:0 "소련은 극도의 압박 속에서 산업을 우랄 산맥 동쪽으로 이전하여 대대적인 반격을 위한 생산을 재개했습니다."
 game_assistant_hoi4_general_text_scripted_loc445:0 "미국의 전시 산업 동원 중, 포드의 윌로런 공장은 최고조에서 시간당 한 대의 B-24 리버레이터 폭격기를 생산했습니다."
 game_assistant_hoi4_general_text_scripted_loc446:0 "탄약 공장에서 광범위하게 일한 여성들은 때때로 유독 물질로 건강 손상을 입었으며, '카나리아 걸스'로 알려졌습니다."
 game_assistant_hoi4_general_text_scripted_loc447:0 "맨해튼 프로젝트는 우라늄 농축에 전자기 분리와 기체 확산을 사용했으며, 오크리지는 엄청난 전력을 소비했습니다."
 game_assistant_hoi4_general_text_scripted_loc448:0 "로스앨러모스 연구소는 오펜하이머 같은 과학자들을 모아 핵폭탄 이론과 조립 작업을 수행했습니다."
 game_assistant_hoi4_general_text_scripted_loc449:0 "최초의 핵실험 '트리니티'는 뉴멕시코에서 수행되었으며, 폭발 위력은 TNT 약 20킬로톤이었습니다."
 game_assistant_hoi4_general_text_scripted_loc450:0 "나치 핵 프로그램은 더디게 진행되었으며, 하이젠베르크 등은 연쇄 반응 달성에 실패했고 또한 방해를 받았습니다."
 game_assistant_hoi4_general_text_scripted_loc451:0 "독일의 '태양포' 개발은 거대한 궤도 반사경을 상상하여 태양광을 집중시키는 것이었지만, 이론에 머물렀고 실제로 구현되지는 않았습니다."
 game_assistant_hoi4_general_text_scripted_loc452:0 "독일의 '아메리카 폭격기' 프로젝트에는 Me 264가 포함되었으며, 미국 동부 해안에 대한 대서양 횡단 공격을 위해 설계되었습니다."
 game_assistant_hoi4_general_text_scripted_loc453:0 "일본의 '후가쿠'는 6발 엔진의 거대 폭격기로 미국 본토를 폭격할 계획이었지만, 종이 위에만 남았습니다."
 game_assistant_hoi4_general_text_scripted_loc454:0 "소련의 안토노프 A-40은 날아다니는 전차로, T-60에 글라이더 날개를 부착한 것이었으며 프로토타입 테스트에 실패했습니다."
 game_assistant_hoi4_general_text_scripted_loc455:0 "영국의 하바쿠크 프로젝트는 파이크레이트(얼음과 나무 펄프)로 만든 항공모함을 제안했으나, 실용성이 입증되지 않아 중단되었습니다."
 game_assistant_hoi4_general_text_scripted_loc456:0 "독일은 '란트크로이처 P.1000 라테' 초중전차를 계획했으며, 무게 1000톤에 전함 포를 장착할 예정이었지만 건조되지는 않았습니다."
 game_assistant_hoi4_general_text_scripted_loc457:0 "태평양에서 미군은 M2 화염방사기를 사용하여 벙커를 소탕했으며, 효과적이었지만 잔혹하여 벙커 파괴자로 자리 잡았습니다."
 game_assistant_hoi4_general_text_scripted_loc458:0 "메릴의 약탈자들은 중-인-버마 전구에서 장거리 침투 작전을 수행했으며, 정글에서 싸우고 질병과 굶주림에 시달렸습니다."
 game_assistant_hoi4_general_text_scripted_loc459:0 "오드 윙게이트가 이끄는 친디트는 버마에서 적진 후방에서 작전을 수행했으며, 공중 투하에 의존하여 일본 보급선을 교란했습니다."
 game_assistant_hoi4_general_text_scripted_loc460:0 "이탈리아의 고딕 선에서 연합군은 산악 지형과 겨울에 직면했으며, 노새를 사용하여 탄약과 보급품을 운반했습니다."
 game_assistant_hoi4_general_text_scripted_loc461:0 "캄프그루페 파이퍼는 벌지 전투 중 미군 포로를 살해했으며, 말메디 학살은 전후 재판으로 이어졌습니다."
 game_assistant_hoi4_general_text_scripted_loc462:0 "독일 아르덴 공세 첫날, 스코르체니의 코만도는 미군 제복을 입고 혼란을 조성했으며, 많은 수가 체포되어 처형되었습니다."
 game_assistant_hoi4_general_text_scripted_loc463:0 "바스토뉴의 미군 제101공수사단은 항복을 거부하며 '너트!'라고 답했으며, 결국 구원되었습니다."
 game_assistant_hoi4_general_text_scripted_loc464:0 "벌지 전투는 서부 전선에서 독일의 마지막 주요 공세였으며, 독일군은 예비군을 소진하고 미군에게 큰 사상자를 입혔습니다."
 game_assistant_hoi4_general_text_scripted_loc465:0 "레마겐의 루덴도르프 다리는 미군에 의해 무사히 점령되었으며, 히틀러는 분노하여 다양한 무기로 다리를 파괴하려 했으나 실패했습니다."
 game_assistant_hoi4_general_text_scripted_loc466:0 "엘베 데이 합동은 미군과 소련군 간의 최초 접촉으로, 독일을 북부와 남부로 분할했습니다."
 game_assistant_hoi4_general_text_scripted_loc467:0 "비엔나 공세는 소련군의 신속한 공격이었으며, 격렬한 시가전이 벌어졌고 도시는 4월 13일에 함락되었습니다."
 game_assistant_hoi4_general_text_scripted_loc468:0 "트리에스테는 독일 점령군, 유고슬라비아 빨치산, 영연방군 사이에 분쟁이 발생한 전쟁터가 되었습니다."
 game_assistant_hoi4_general_text_scripted_loc469:0 "네덜란드의 아른헴에서 영국 제1공수사단 일부가 다리를 지켰지만, '지나친 다리'는 지킬 수 없었습니다."
 game_assistant_hoi4_general_text_scripted_loc470:0 "스헬더 전투는 주로 캐나다군이 수행했으며, 앤트워프 접근로를 확보하여 연합군 보급 병목을 해결했습니다."
 game_assistant_hoi4_general_text_scripted_loc471:0 "부건빌에서 호주군은 미군을 대체하여 포위전을 계속했으며, 일본군은 정글에서 굶어 죽었고 그 수는 수만 명에 달했습니다."
 game_assistant_hoi4_general_text_scripted_loc472:0 "뉴기니 작전에서 일본 제18군은 패배했으며, 막대한 보급품이 침몰하여 '녹색 지옥'이라는 별명을 얻었습니다."
 game_assistant_hoi4_general_text_scripted_loc473:0 "미국제 무기로 완전 무장한 중국 신1군과 신6군은 북부 버마에서 반격을 가하고 레도 도로를 재개통했습니다."
 game_assistant_hoi4_general_text_scripted_loc474:0 "쑹산 전투에서 중국 원정군은 일본 요새를 공격했으며, 터널 폭파로 주 벙커를 파괴하여 큰 손실 끝에 점령했습니다."
 game_assistant_hoi4_general_text_scripted_loc475:0 "텅충 포위전에서 일본 수비대는 전멸했으며, 전투 후 온전한 건물은 하나도 남지 않고 초토화되었습니다."
 game_assistant_hoi4_general_text_scripted_loc476:0 "헝양 방어전에서 중국 제10군은 압도적인 적을 상대로 47일간 버텼으며, 일본군에게 큰 손실을 입힌 후 함락되었습니다."
 game_assistant_hoi4_general_text_scripted_loc477:0 "창더 전투에서 위청완 휘하의 제57사단은 단독으로 도시를 방어했으며, 격렬한 시가전을 벌여 수백 명만 생존했습니다."
 game_assistant_hoi4_general_text_scripted_loc478:0 "서호남 전투는 중국 본토 전선에서의 마지막 주요 승리였으며, 일본군의 공세는 분쇄되었고 왕야오우의 부대가 결연히 싸웠습니다."
 game_assistant_hoi4_general_text_scripted_loc479:0 "1942년, 도쿄에 대한 둘리틀 공습에서 16대의 B-25가 USS 호넷에서 이륙했으며, 엄청난 심리적 충격을 주었습니다."
 game_assistant_hoi4_general_text_scripted_loc480:0 "둘리틀 공습 후 대부분의 조종사는 중국에 불시착하여 구조되었으며, 일본의 보복 소탕으로 수십만 명의 중국 민간인이 사망했습니다."
 game_assistant_hoi4_general_text_scripted_loc481:0 "'차이나 점프' 공수 보급로는 버마 상실 후 우회되었으며, 이후 '험프'가 되어 수송 비용이 매우 높아졌습니다."
 game_assistant_hoi4_general_text_scripted_loc482:0 "윈난이, 잔이 등의 비행장은 험프 항로와 공격 임무를 지원하는 중요한 기지 역할을 했습니다."
 game_assistant_hoi4_general_text_scripted_loc483:0 "팔로군은 터널전과 지뢰전을 게릴라 작전에 사용했으며, 허베이 중부의 란좡 터널 시스템은 매우 발달했습니다."
 game_assistant_hoi4_general_text_scripted_loc484:0 "동북항일연군은 혹한 속에서 홀로 싸웠으며, 양징위의 위장에서는 풀뿌리와 면화 솜만 발견되었습니다."
 game_assistant_hoi4_general_text_scripted_loc485:0 "랑야산의 8인의 여전사는 민간인과 부대의 철수를 엄호하기 위해 절벽에서 뛰어내렸으며, 3명이 사망하고 2명이 생존했습니다."
 game_assistant_hoi4_general_text_scripted_loc486:0 "소련 빨치산 조야 코스모데미얀스카야는 체포되어 교수형에 처해졌으며, 추후 '소비에트 연방 영웅' 칭호를 받았습니다."
 game_assistant_hoi4_general_text_scripted_loc487:0 "점령 유럽에서는 지하 신문과 라디오 방송이 널리 퍼졌으며, 예를 들어 프랑스의 '리베라시옹'과 네덜란드 지하 방송이 있습니다."
 game_assistant_hoi4_general_text_scripted_loc488:0 "독일 백장미 저항 단체의 구성원인 한스 숄과 조피 숄 남매는 전단지 배포 후 처형되었으며, 널리 추모되고 있습니다."
 game_assistant_hoi4_general_text_scripted_loc489:0 "바르샤바 게토 봉기 기념비는 봉기 장소에 서 있으며, 전후 반성과 홀로코스트 교육의 랜드마크가 되었습니다."
 game_assistant_hoi4_general_text_scripted_loc490:0 "독일군에게 박해받은 여호와의 증인은 보라색 삼각형을 착용했으며, 충성 서약을 거부하여 수용소로 보내졌습니다."
 game_assistant_hoi4_general_text_scripted_loc491:0 "검은 삼각형은 '반사회적' 요소를 표시했으며, 노숙자와 로마인이 포함되어 널리 박해받았습니다."
 game_assistant_hoi4_general_text_scripted_loc492:0 "나치는 인종 위생을 장려하여 유전 질환이나 혼혈을 가진 수십만 명을 강제 불임시켰습니다."
 game_assistant_hoi4_general_text_scripted_loc493:0 "미국 해병대는 나바호어 암호 통신병을 사용했으며, 그 존재는 1968년까지 기밀로 분류되었습니다."
 game_assistant_hoi4_general_text_scripted_loc494:0 "미군은 유럽에서 코만치어 암호 통신병을 사용했으며, 노르망디를 포함하여 역시 해독되지 않았습니다."
 game_assistant_hoi4_general_text_scripted_loc495:0 "영국은 블레츨리 파크에서 수많은 퍼즐 애호가를 모집하여 봄베로 암호를 해독했습니다."
 game_assistant_hoi4_general_text_scripted_loc496:0 "독일의 '피슈바인' 암호 텔레프린터 시스템은 연합군 정보부에 의해 요격 및 해독되어 최고급 정보를 제공했습니다."
 game_assistant_hoi4_general_text_scripted_loc497:0 "일본의 '퍼플' 암호는 미국에 의해 해독되었으며, 외교 메시지는 일본의 의도를 드러내어 '매직'이라고 불리는 정보를 제공했습니다."
 game_assistant_hoi4_general_text_scripted_loc498:0 "소련 스파이 리하르트 조르게는 일본에서 정보를 입수하여 일본이 북진하지 않을 것임을 확인했고, 이는 소련군이 모스크바를 방어하는 데 도움이 되었습니다."
 game_assistant_hoi4_general_text_scripted_loc499:0 "'로테 카펠레'는 유럽에서의 소련 간첩 네트워크로, 독일 최고 사령부에 침투했으며, 많은 구성원이 발각된 후 처형되었습니다."
 game_assistant_hoi4_general_text_scripted_loc500:0 "슈타우펜베르크의 히틀러 암살 시도 실패 후, 약 700명이 체포되고 거의 5,000명이 처형되었습니다."
  game_assistant_hoi4_general_text_scripted_loc501:0 "무카이 도시아키와 노다 쓰요시는 난징 대학살 당시 '백인 살상 경쟁'을 벌였으며, 이후 중국에 인도되어 재판을 받고 처형되었습니다."
 game_assistant_hoi4_general_text_scripted_loc502:0 "일본군은 중국의 많은 지역에서 '삼광 작전'(모조리 죽이고, 모조리 태우고, 모조리 약탈)을 시행하여 수많은 마을이 파괴되고 민간인 사상자가 발생했습니다."
 game_assistant_hoi4_general_text_scripted_loc503:0 "저장성과 장시성에서 둘리틀 공습 이후 일본군은 대규모 소탕과 생물 무기 사용을 자행했습니다."
 game_assistant_hoi4_general_text_scripted_loc504:0 "일본은 전시 수도 충칭에 대해 무차별 전략 폭격을 감행하여 막대한 민간인 사상자를 초래했습니다."
 game_assistant_hoi4_general_text_scripted_loc505:0 "리메이의 소이탄 공격은 M69 소이탄을 사용하여 일본의 목조 도시를 겨냥했으며, 그 효과는 무시무시했습니다."
 game_assistant_hoi4_general_text_scripted_loc506:0 "1945년 3월 9일-10일 도쿄 대공습만으로도 10만 명 이상이 사망하고 광범위한 지역이 불탔을 것으로 추정됩니다."
 game_assistant_hoi4_general_text_scripted_loc507:0 "혼고 구의 고쿄(황거) 인근 대피소에서는 많은 사람이 고온과 산소 부족으로 사망했으며, 화재 폭풍이 지역을 집어삼켰습니다."
 game_assistant_hoi4_general_text_scripted_loc508:0 "전쟁 말기, 일본은 잠수함과 공군에 의해 완전히 봉쇄되어 식량과 석유 보급이 거의 끊겼습니다."
 game_assistant_hoi4_general_text_scripted_loc509:0 "일본의 '소나무 뿌리 기름' 프로그램은 소나무 뿌리를 파내어 테레빈유를 생산하여 항공유 대체품으로 사용하려 했지만, 생산량은 무시할 수준이었습니다."
 game_assistant_hoi4_general_text_scripted_loc510:0 "일본은 철, 구리 용기, 사찰 종을 수집하여 무기로 제련했으며, 심지어 학생들도 참여했습니다."
 game_assistant_hoi4_general_text_scripted_loc511:0 "'대나무 창 훈련'은 본토 결전의 사상을 반영했으며, 여성과 학생들은 상륙에 저항하기 위해 간단한 대나무 창을 준비했습니다."
 game_assistant_hoi4_general_text_scripted_loc512:0 "미국은 일본 침공을 위한 '다운폴 작전'을 계획했으며, 수십만에서 백만 명 이상의 연합군 사상자를 예상했습니다."
 game_assistant_hoi4_general_text_scripted_loc513:0 "표적 위원회는 원자폭탄 투하 후보지로 히로시마, 고쿠라, 니가타, 나가사키를 선정했으며, 날씨와 산업 잠재력을 고려했습니다."
 game_assistant_hoi4_general_text_scripted_loc514:0 "세 번째 원자폭탄 코어가 이미 준비 중이었으며, 일본이 항복하지 않았다면 투하되었을 것입니다. 개량된 '팻 맨' 유형이었습니다."
 game_assistant_hoi4_general_text_scripted_loc515:0 "소련의 일본 선전포고 후, 소련군은 신속히 남사할린과 쿠릴 열도를 점령했으며, 이는 현재까지 이어지는 북방 영토 분쟁의 원인이 되었습니다."
 game_assistant_hoi4_general_text_scripted_loc516:0 "만주국 황제 푸이는 도피 중 심양 공항에서 소련군에 체포되었으며, 이후 중국에 인도되었습니다."
 game_assistant_hoi4_general_text_scripted_loc517:0 "전후, 많은 일본인이 이전 식민지에서 본국으로 송환되었으며, '히키아게'로 알려진 이 과정에서 막대한 고통을 겪었습니다."
 game_assistant_hoi4_general_text_scripted_loc518:0 "많은 독일 민간인이 패배 후 서쪽으로 도피하거나 추방되었으며, 사망자는 수십만 명에 달했습니다."
 game_assistant_hoi4_general_text_scripted_loc519:0 "독일인은 주데텐란트와 동프로이센에서 추방되었으며, 이는 전후 최대 인구 이전 중 하나였습니다."
 game_assistant_hoi4_general_text_scripted_loc520:0 "1943년 벵골 기근은 전시 정책과 사이클론으로 인해 부분적으로 발생했으며, 약 300만 명이 사망했습니다."
 game_assistant_hoi4_general_text_scripted_loc521:0 "일본은 네덜란드령 동인도 점령 후 자원과 노동력을 징발하여 수백만 명의 지역 주민 손실을 초래했습니다."
 game_assistant_hoi4_general_text_scripted_loc522:0 "1944-45년 프랑스령 인도차이나 기근은 수십만에서 백만 명 이상의 베트남인을 사망하게 했습니다."
 game_assistant_hoi4_general_text_scripted_loc523:0 "그리스는 점령 기간 동안 심각한 기근을 겪었으며, 약 30만 명이 사망했고 적십자사의 구호로 일부가 완화되었습니다."
 game_assistant_hoi4_general_text_scripted_loc524:0 "라도가 호수의 얼음 위 '생명의 길'은 레닌그라드에 식량을 가져오고 민간인을 대피시켜 도시의 생존을 유지했습니다."
 game_assistant_hoi4_general_text_scripted_loc525:0 "드네프르 전투에는 최대 400만 명의 병력이 참여했으며, 도하와 교두보 전투가 극도로 치열했습니다."
 game_assistant_hoi4_general_text_scripted_loc526:0 "코르순-체르카시 포위전에서 탈출을 시도한 독일군의 거의 절반이 괴멸되었습니다."
 game_assistant_hoi4_general_text_scripted_loc527:0 "크레타 섬에서 민간인들은 농기구와 낡은 무기로 낙하산병을 공격했으며, 독일군은 잔혹한 보복을 가했습니다."
 game_assistant_hoi4_general_text_scripted_loc528:0 "그리스에서의 독일 보복, 예를 들어 칼라브리타 학살에서는 마을의 모든 남성이 살해되었습니다."
 game_assistant_hoi4_general_text_scripted_loc529:0 "에티오피아의 반이탈리아 게릴라는 영국의 도움을 받아 망명 황제 하일레 셀라시에가 1941년에 귀환하여 왕좌를 되찾도록 도왔습니다."
 game_assistant_hoi4_general_text_scripted_loc530:0 "리비아의 세누시 교단은 북아프리카 사막에서 부족을 이끌어 영국군을 기습과 정보로 지원했습니다."
 game_assistant_hoi4_general_text_scripted_loc531:0 "르클레르 휘하의 자유 프랑스군은 차드에서 라인강과 베르히테스가덴까지 행진했으며, 이는 1,000마일의 여정이었습니다."
 game_assistant_hoi4_general_text_scripted_loc532:0 "프랑스가 파리를 해방시켰을 때 봉기가 일어났으며, 독일 사령관 폰 콜티츠는 히틀러의 도시 파괴 명령을 거역했습니다."
 game_assistant_hoi4_general_text_scripted_loc533:0 "바르샤바 봉기 중 소련군은 비스와 강 동쪽 기슭에서 멈추었고, 봉기에 직접적인 지원을 제공하지 않아 오늘날까지 논쟁의 대상이 되고 있습니다."
 game_assistant_hoi4_general_text_scripted_loc534:0 "슬로바키아 민족 봉기 중 독일군은 장갑열차와 중무기를 사용하여 진압했으며, 봉기의 중심지 반스카비스트리차가 함락되었습니다."
 game_assistant_hoi4_general_text_scripted_loc535:0 "이탈리아 사회 공화국은 이탈리아 북부에 국한된 독일의 괴뢰 국가로, 저항을 잔혹하게 탄압했습니다."
 game_assistant_hoi4_general_text_scripted_loc536:0 "공산당이 이끄는 알바니아 저항군은 주요 소련 개입 없이 대부분의 나라를 해방했습니다."
 game_assistant_hoi4_general_text_scripted_loc537:0 "티토의 유고슬라비아 빨치산은 주요 외부 군대 없이 대규모 지역을 해방시키는 데 성공했으며, 수십만 명의 추축군과 싸웠습니다."
 game_assistant_hoi4_general_text_scripted_loc538:0 "필리핀 대통령 케손은 미국에 망명 정부를 수립했으며, 게릴라 부대는 맥아더가 돌아올 때까지 계속 싸웠습니다."
 game_assistant_hoi4_general_text_scripted_loc539:0 "프랑스령 기아나와 과들루프와 같은 자유 프랑스 식민지는 조기에 연합국 편에 서서 전략적 기지를 제공했습니다."
 game_assistant_hoi4_general_text_scripted_loc540:0 "영국은 일본 잠수함의 이용을 막기 위해 마다가스카르를 침공하여 비시 프랑스로부터 탈취했습니다."
 game_assistant_hoi4_general_text_scripted_loc541:0 "라시드 알리 알-가일라니가 이라크에서 친추축 쿠데타를 일으켰으나, 영국의 개입으로 진압되어 석유 공급과 수송로를 확보했습니다."
 game_assistant_hoi4_general_text_scripted_loc542:0 "시리아-레바논 작전에서 영국군과 자유 프랑스군은 비시 프랑스로부터 통제권을 인수했습니다."
 game_assistant_hoi4_general_text_scripted_loc543:0 "이란은 영국과 소련에 의해 공동 점령 및 분할되었으며, 페르시아 회랑을 설립하여 렌드리스 보급품을 소련으로 수송했습니다."
 game_assistant_hoi4_general_text_scripted_loc544:0 "독일은 인도 포로로 구성된 '자유 인도 군단'을 지원했으며, 이들은 유럽에 주둔했고 전투 효율성은 미미했습니다."
 game_assistant_hoi4_general_text_scripted_loc545:0 "압둘라 국왕 휘하의 아랍 군단은 시리아와 이라크에서 영국군과 함께 싸웠습니다."
 game_assistant_hoi4_general_text_scripted_loc546:0 "소련이 석방한 폴란드 포로로 구성된 폴란드 안데르스 군대는 이란을 거쳐 이탈리아에서 싸웠습니다."
 game_assistant_hoi4_general_text_scripted_loc547:0 "마체크 장군이 이끄는 폴란드 제1기갑사단은 팔레즈 포위전에서 독일군의 탈출로를 봉쇄했습니다."
 game_assistant_hoi4_general_text_scripted_loc548:0 "캐나다 제3보병사단은 D-데이에 주노 해변에 상륙했으며, 첫날 가장 멀리 진격했지만 또한 큰 손실을 입었습니다."
 game_assistant_hoi4_general_text_scripted_loc549:0 "남아프리카 공군과 지상군은 북아프리카와 이탈리아에서 용감하게 싸웠으며, 동아프리카 작전에도 참여했습니다."
 game_assistant_hoi4_general_text_scripted_loc550:0 "뉴질랜드 제2사단은 크레타 방어와 북아프리카 및 이탈리아 전구의 반격에서 두각을 나타냈습니다."
 game_assistant_hoi4_general_text_scripted_loc551:0 "인도군은 제2차 세계 대전에서 가장 큰 규모의 지원병 부대 중 하나로, 북아프리카, 동아프리카, 이탈리아, 버마에서 광범위하게 싸웠습니다."
 game_assistant_hoi4_general_text_scripted_loc552:0 "구르카 병사들은 용기와 쿠크리 칼로 유명했으며, 버마의 정글과 이탈리아의 산맥에서 탁월했습니다."
 game_assistant_hoi4_general_text_scripted_loc553:0 "제82공수사단과 제101공수사단은 D-데이 야간 강하 중 흩어졌지만, 개별적으로 싸워 임무를 완수했습니다."
 game_assistant_hoi4_general_text_scripted_loc554:0 "연합군의 시칠리아 상륙 중 공수 작전은 아군의 오사로 큰 손실을 입었으며, 야간 수송 조건이 복잡하여 비극을 초래했습니다."
 game_assistant_hoi4_general_text_scripted_loc555:0 "독일군은 몬테카시노 수도원에서 문화재를 제거했으며, 연합군은 이를 관측소로 오인하여 대규모 폭격을 가했습니다."
 game_assistant_hoi4_general_text_scripted_loc556:0 "마운트배튼이 이끄는 디에프 기습의 교훈은 오버로드 작전을 위한 인공 항구 해결책 개발로 이어졌습니다."
 game_assistant_hoi4_general_text_scripted_loc557:0 "침몰 선박과 콘크리트 케이슨으로 만들어진 멀베리 인공 항구가 건설되었으며, 아로망슈 항구는 폭풍 후에도 운영을 유지했습니다."
 game_assistant_hoi4_general_text_scripted_loc558:0 "'플루토' 연료 파이프라인은 수백만 리터의 휘발유를 영국 해협을 가로질러 프랑스로 펌핑하여 기계화 진격을 보장했습니다."
 game_assistant_hoi4_general_text_scripted_loc559:0 "독일의 대서양 방벽은 위용을 자랑했지만, 분산된 병력과 연합군의 기만 작전으로 상륙을 막지 못했습니다."
 game_assistant_hoi4_general_text_scripted_loc560:0 "롬멜은 대서양 방벽 강화를 담당했으며, 수중 장애물, 지뢰밭, 그리고 공수 상륙에 대비한 '롬멜의 아스파라거스'를 추가했습니다."
 game_assistant_hoi4_general_text_scripted_loc561:0 "마술사 재스퍼 마스케린은 북아프리카에서 위장과 환영술을 사용하여 수에즈 운하와 알렉산드리아 항구를 숨겼습니다."
 game_assistant_hoi4_general_text_scripted_loc562:0 "영국의 '제리코 백'은 심리전 방송을 위해 항공기에 부착된 간단한 확성기였습니다."
 game_assistant_hoi4_general_text_scripted_loc563:0 "전단지 공중 투하는 선전으로 사용되어 적의 사기를 저하시키고 항복을 위한 안전 통행증을 제공했습니다."
 game_assistant_hoi4_general_text_scripted_loc564:0 "연합군의 독일 대상 선전 방송은 독일 포로와 망명자를 사용하여 허위 뉴스와 암호 메시지를 퍼뜨려 사기를 저하시켰습니다."
 game_assistant_hoi4_general_text_scripted_loc565:0 "도쿄 로즈, 액시스 샐리와 같은 방송인들은 유혹적인 말투로 미군의 사기를 저하시키려 했으며, 대부분이 협력을 강요당했습니다."
 game_assistant_hoi4_general_text_scripted_loc566:0 "독일 장편 선전 영화 '콜베르크'는 1945년 초에 개봉되었으며, 국민들에게 마지막 폐허까지 저항할 것을 촉구했습니다."
 game_assistant_hoi4_general_text_scripted_loc567:0 "영국 정보부는 많은 사기 고취 단편 영화를 제작하여 동원과 공공 정신 유지에 역할을 했습니다."
 game_assistant_hoi4_general_text_scripted_loc568:0 "미국 전시 정보국은 프랭크 캐프라 감독의 '우리가 왜 싸우는가' 시리즈를 제작했습니다."
 game_assistant_hoi4_general_text_scripted_loc569:0 "쇼스타코비치의 레닌그라드 교향곡은 포위전 중 초연되었으며, 방송되어 주민들에게 영감을 주었습니다."
 game_assistant_hoi4_general_text_scripted_loc570:0 "'침착하라 그리고 계속하라', '로지 더 리베터'와 같은 전시 포스터는 지속적인 영향을 미쳤습니다."
 game_assistant_hoi4_general_text_scripted_loc571:0 "'승리 정원' 운동은 영연방에서도 진전되어 식량 부족과 수송 압력을 크게 완화했습니다."
 game_assistant_hoi4_general_text_scripted_loc572:0 "영국은 원단을 절약하기 위해 주름 없음, 포켓 플랩 없음, 최소한의 장식의 '유틸리티 의류' 스타일을 장려했습니다."
 game_assistant_hoi4_general_text_scripted_loc573:0 "미국에서는 나일론이 낙하산과 로프에 통제되어 스타킹 부족이 발생했으며, 여성들은 다리에 '솔기선'을 그렸습니다."
 game_assistant_hoi4_general_text_scripted_loc574:0 "셸 오일 광고는 '정제된 기름은 탄약'이라는 슬로건으로 폭발물용 글리세린을 만들기 위해 기름 재활용을 촉구했습니다."
 game_assistant_hoi4_general_text_scripted_loc575:0 "통조림 식품과 건빵은 전장 식량의 핵심을 형성했으며, 영국의 '복합 배급'은 상자당 여러 끼를 공급했습니다."
 game_assistant_hoi4_general_text_scripted_loc576:0 "미국의 'D-레이션'은 고칼로리 초콜릿 바로, 내열성과 맛없음으로 비상용으로만 사용되었습니다."
 game_assistant_hoi4_general_text_scripted_loc577:0 "독일의 '아이제르네 포르티온'은 돼지고기 통조림, 건빵, 커피 대용품으로 구성되었으며, 동부 전선에서는 얼어붙어 먹기 어려웠습니다."
 game_assistant_hoi4_general_text_scripted_loc578:0 "일본인의 주식은 도정미였으며, 보급이 악화되자 굶주린 병사들은 들풀과 곤충을 모았습니다."
 game_assistant_hoi4_general_text_scripted_loc579:0 "이탈리아군 배급에는 많은 양의 고기 통조림과 건빵이 포함되었으며, '무솔리니의 위장'이라는 별명을 얻었습니다."
 game_assistant_hoi4_general_text_scripted_loc580:0 "일본 병사들은 개인 '전투 취사 도구'를 휴대하여 밥을 데웠지만, 취사 불로 위치가 노출되어 포격을 유발했습니다."
 game_assistant_hoi4_general_text_scripted_loc581:0 "자전거는 특히 말레이시아의 일본군에 의해 널리 사용되었으며, '자전거 전격전'은 빠른 정글 침투를 가능하게 했습니다."
 game_assistant_hoi4_general_text_scripted_loc582:0 "독일군은 전쟁 내내 마차 수송에 크게 의존했습니다. 그들의 기계화 수준은 제한적이었고 말 손실도 막대했습니다."
 game_assistant_hoi4_general_text_scripted_loc583:0 "썰매견은 극지방에서 구조 임무에 사용되었으며, 예를 들어 그린란드의 미군 순찰대가 허스키를 사용했습니다."
 game_assistant_hoi4_general_text_scripted_loc584:0 "전서구는 정보를 전송했으며, 많은 수가 훈장을 받았습니다. 예를 들어 미국 비둘기 'G.I. 조'는 아군 폭격으로부터 마을을 구했습니다."
 game_assistant_hoi4_general_text_scripted_loc585:0 "대전차견, 박쥐 폭탄, 비둘기 유도 미사일 등은 모두 창의적인 무기였지만, 대부분은 성공하지 못했습니다."
 game_assistant_hoi4_general_text_scripted_loc586:0 "음향 측정과 탐조등은 야간 방공망을 형성했으며, 초기에는 음향과 광학에 의존하다가 레이더로 대체되었습니다."
 game_assistant_hoi4_general_text_scripted_loc587:0 "영국은 야간 전투기용 AI 레이더를 개발하여 '블랙 캣'과 '모스키토' 항공기가 야간 요격을 수행할 수 있게 했습니다."
 game_assistant_hoi4_general_text_scripted_loc588:0 "독일은 '빌데 자우' 야간 전술을 개발하여 탐조등으로 연합군 폭격기를 비추어 레이더 없는 전투기로 요격했습니다."
 game_assistant_hoi4_general_text_scripted_loc589:0 "치머라이트 대자성 지뢰 페이스트가 독일 전차에 도포되었지만, 사용될 당시에는 자기 지뢰의 위협이 이미 지나갔습니다."
 game_assistant_hoi4_general_text_scripted_loc590:0 "개인 위장은 그물과 천 조각을 사용했으며, 길리 슈트는 스코틀랜드 사냥감 지기에서 유래했습니다."
 game_assistant_hoi4_general_text_scripted_loc591:0 "제2차 세계 대전은 군 복무를 위한 최초의 체계적인 심리 스크리닝을 보았으며, 미국은 이를 인원 분류에 부분적으로 사용했습니다."
 game_assistant_hoi4_general_text_scripted_loc592:0 "심리전 부대는 위조 독일 마르크와 일본 군표를 인쇄하여 인플레이션과 혼란을 일으켰습니다."
 game_assistant_hoi4_general_text_scripted_loc593:0 "포로 수용소에서는 탈출과 창의적인 터널이 있었으며, 예를 들어 굴착을 은폐하기 위한 '나무 말' 뜀틀이 있습니다."
 game_assistant_hoi4_general_text_scripted_loc594:0 "콜디츠 성은 탈출 성향이 높은 연합군 포로를 수용했으며, 많은 대담한 탈옥이 발생했고, 결코 이륙하지 않은 침대 시트로 만든 글라이더도 포함되었습니다."
 game_assistant_hoi4_general_text_scripted_loc595:0 "버마-태국 철도에서 연합군 포로들은 조잡한 도구를 사용하여 산을 수작업으로 관통했습니다."
 game_assistant_hoi4_general_text_scripted_loc596:0 "네이슨과 같은 괌 원주민들은 일본군의 포로가 되지 않도록 미군 요원을 숨겼으며, 목숨을 걸고 정보를 전달했습니다."
 game_assistant_hoi4_general_text_scripted_loc597:0 "솔로몬 제도의 코스트워처는 주로 호주인과 뉴질랜드인으로, 일본군의 움직임을 감시했습니다."
 game_assistant_hoi4_general_text_scripted_loc598:0 "미국 해군 시비 건설 대대는 기록적인 시간 내에 비행장, 도로, 항구를 건설하여 '승리 엔지니어'라는 별명을 얻었습니다."
 game_assistant_hoi4_general_text_scripted_loc599:0 "일본의 방공 예방 조치는 심각하게 부적절했으며, 소방대와 대나무 물통 동원 외에는 효과적인 민방위가 거의 없었습니다."
 game_assistant_hoi4_general_text_scripted_loc600:0 "독일의 플락 타워는 거대한 콘크리트 구조물로, 베를린, 함부르크, 비엔나에 여전히 서 있으며 철거가 극도로 어렵습니다."
  game_assistant_hoi4_general_text_scripted_loc601:0 "독일군은 소련의 겨울 전술에 대응하기 위해 병사들에게 발포성 그리스와 방한화를 지급했지만, 동부 전선의 혹한은 여전히 막대한 동상 사상자를 냈습니다."
 game_assistant_hoi4_general_text_scripted_loc602:0 "소련의 야간 폭격기 Po-2는 목재와 캔버스로 제작되어 레이더에 거의 탐지되지 않았으며, 독일군은 이를 '재봉틀'이라 불렀습니다."
 game_assistant_hoi4_general_text_scripted_loc603:0 "독일의 구스타프 열차포는 세바스토폴 요새를 포격할 때 최대 사거리 47km에서 중량 7톤의 포탄을 발사했습니다."
 game_assistant_hoi4_general_text_scripted_loc604:0 "레닌그라드 포위전에서 민간인들은 포탄에 맞아 죽은 말의 고기를 삶아 먹거나, 가죽과 벽지 풀을 끓여 먹기도 했습니다."
 game_assistant_hoi4_general_text_scripted_loc605:0 "일본의 인간 어뢰 '가이텐'은 탑승자가 사출 후 외부와 단절되어 표적 식별과 탈출이 거의 불가능했습니다."
 game_assistant_hoi4_general_text_scripted_loc606:0 "영국의 해상 수송 호송 시스템은 대서양에서 필수적이었으며, 호송선단의 핵심은 구축함과 호위함의 대잠 초계였습니다."
 game_assistant_hoi4_general_text_scripted_loc607:0 "독일의 '토트 조직'은 강제 노동자를 동원하여 대서양 방벽과 지하 공장을 건설했으며, 노동 조건은 극도로 열악했습니다."
 game_assistant_hoi4_general_text_scripted_loc608:0 "미국은 B-29 폭격기에 레이더 조준경과 원격 제어 포탑을 장착하여 고고도에서 정밀 폭격과 방어를 가능하게 했습니다."
 game_assistant_hoi4_general_text_scripted_loc609:0 "소련의 T-34/85는 85mm 포를 장착하여 독일의 티거와 판터에 효과적으로 대응할 수 있었고, T-34의 생산성과 신뢰성을 유지했습니다."
 game_assistant_hoi4_general_text_scripted_loc610:0 "독일의 전투기 조종사들은 격추 당할 경우 낙하산으로 탈출했지만, 동부 전선에서는 종종 소련군에게 포로로 잡혀 극심한 고문을 당했습니다."
 game_assistant_hoi4_general_text_scripted_loc611:0 "일본의 가미카제 특공대는 출격 전 의식을 치렀으며, 조종사는 머리에 하치마키(띠)를 두르고 마지막 술잔을 나누었습니다."
 game_assistant_hoi4_general_text_scripted_loc612:0 "영국의 첩보 조직 SOE는 요원들에게 연필 폭탄, 스틸렛 단검, 단발 권총과 같은 은밀한 장비를 제공했습니다."
 game_assistant_hoi4_general_text_scripted_loc613:0 "독일군은 점령지에서 민간인을 인질로 잡아 저항 활동에 대한 보복으로 집단 처형했습니다."
 game_assistant_hoi4_general_text_scripted_loc614:0 "소련의 전쟁 채권은 '국가 내전'의 일환으로 적극적으로 판매되었으며, 시민들은 개인 소지품까지 금고에 내놓았습니다."
 game_assistant_hoi4_general_text_scripted_loc615:0 "미국 육군 항공대는 '붉은 꼬리'로 유명한 터스키기 비행단을 운영했으며, 이 부대는 최초의 흑인 비행대였습니다."
 game_assistant_hoi4_general_text_scripted_loc616:0 "독일의 '쇼르네' 경순양함은 전쟁 중 여러 차례 개조되어 주로 훈련 및 구축함 지휘함으로 사용되었습니다."
 game_assistant_hoi4_general_text_scripted_loc617:0 "일본 해군의 4식 정찰기는 장거리 정찰 및 해상 수색에 사용되었으며, 종종 가미카제 특공대를 유도했습니다."
 game_assistant_hoi4_general_text_scripted_loc618:0 "소련의 Tu-2 폭격기는 고속, 기동성, 적재량의 균형이 잘 잡혀 있어 저고도 공격과 전술 폭격에 널리 사용되었습니다."
 game_assistant_hoi4_general_text_scripted_loc619:0 "독일의 V-3 '굴리버'는 초장거리 다단식 포로, 런던을 포격하기 위해 프랑스 칼레 지역에 건설되었으나 폭격으로 파괴되었습니다."
 game_assistant_hoi4_general_text_scripted_loc620:0 "영국의 '피콕' 자체 추진 곡사포는 민간 자동차 부품을 사용하여 설계된 경량 자주포로, 인도에 배치되었습니다."
 game_assistant_hoi4_general_text_scripted_loc621:0 "일본군은 뉴기니에서 매우 불리한 지형에 직면했으며, 수많은 병사가 공중 보급 부족으로 기아와 질병으로 사망했습니다."
 game_assistant_hoi4_general_text_scripted_loc622:0 "독일군은 '동부 부대'를 동부 전선에 배치하여 주로 소련 반체제 인사와 포로로 구성된 협력 부대를 활용했습니다."
 game_assistant_hoi4_general_text_scripted_loc623:0 "소련의 지뢰 탐지견은 전쟁 중에 지뢰밭에서 4,000개 이상의 지뢰를 탐지하여 공병대의 손실을 줄였습니다."
 game_assistant_hoi4_general_text_scripted_loc624:0 "독일의 제트 전투기 Me 262의 엔진 수명은 약 25시간에 불과했으며, 합성 연료와 고급 합금 부족으로 인해 생산이 제한되었습니다."
 game_assistant_hoi4_general_text_scripted_loc625:0 "일본 육군의 4식 75mm 대공포는 자동 장전 장치와 높은 발사 속도를 가졌지만, 중량이 무거워 배치가 어려웠습니다."
 game_assistant_hoi4_general_text_scripted_loc626:0 "미국의 흑인 부대는 종종 지원 및 병참 역할에 배정되었으며, 전투 부대에 대한 배치는 격렬한 인종 차별을 받았습니다."
 game_assistant_hoi4_general_text_scripted_loc627:0 "독일의 '네벨베르퍼' 다연장 로켓포는 발사 시 특징적인 휘파람 소리를 내어 적의 사기를 저하시켰습니다."
 game_assistant_hoi4_general_text_scripted_loc628:0 "영국의 호위항모는 대서양에서 U-보트의 늑대 떼 전술에 대응하는 데 중요한 역할을 했으며, 자체 항공기로 호송선단을 보호했습니다."
 game_assistant_hoi4_general_text_scripted_loc629:0 "일본의 구축함 '시구레'는 많은 해전에서 손상되지 않고 살아남아 '불침 구축함'으로 알려졌습니다."
 game_assistant_hoi4_general_text_scripted_loc630:0 "소련의 전쟁 영화 조연출자들은 실제 참전 용사를 사용하여 실감나는 전투 장면을 연출했으며, 많은 영화가 전후 고전이 되었습니다."
 game_assistant_hoi4_general_text_scripted_loc631:0 "독일군은 점령지에서 개인 자산을 약탈했으며, 유대인과 반체제 인사로부터 금은보석과 예술품을 체계적으로 압수했습니다."
 game_assistant_hoi4_general_text_scripted_loc632:0 "미국의 '릴리' 다연장 로켓포는 반궤도 차량에 장착되어 급속한 기동 화력 지원을 제공했습니다."
 game_assistant_hoi4_general_text_scripted_loc633:0 "일본의 항공기 설계는 종종 무장과 장갑을 희생하여 비행 성능을 추구했지만, 전쟁 후반에는 생존성이 급격히 떨어졌습니다."
 game_assistant_hoi4_general_text_scripted_loc634:0 "독일의 '흘레 종파' 융단 폭격 전술은 전선에 대규모 포병 사격을 집중하여 적의 방어선을 무력화하는 데 사용되었습니다."
 game_assistant_hoi4_general_text_scripted_loc635:0 "소련의 '코뮤나' 잠수함 구조선은 발트해에서 침몰한 잠수함 승무원을 구조하는 데 사용되었으며, 전쟁 내내 근무했습니다."
 game_assistant_hoi4_general_text_scripted_loc636:0 "영국의 '콘베이' 특수 작전용 선박은 무장 민간 어선으로 개조되어 점령지에 요원과 보급품을 은밀히 수송했습니다."
 game_assistant_hoi4_general_text_scripted_loc637:0 "일본의 '가토' 순찰 비행선은 해상 정찰과 호위 임무에 사용되었지만, 연합군 전투기에 매우 취약했습니다."
 game_assistant_hoi4_general_text_scripted_loc638:0 "미국의 전쟁 정보국은 적진 후방에 대한 선전 전단을 대량으로 투하하여 독일과 일본군의 사기 저하를 시도했습니다."
 game_assistant_hoi4_general_text_scripted_loc639:0 "독일의 '티거 II' 전차는 매우 무거워서 많은 다리가 그 무게를 견디지 못했고, 전장에서 자주 고장났습니다."
 game_assistant_hoi4_general_text_scripted_loc640:0 "소련의 '자크-9' 전투기는 37mm 기관포를 장착하여 저고도에서 지상 공격과 폭격기 요격에 효과적이었습니다."
 game_assistant_hoi4_general_text_scripted_loc641:0 "영국의 '타란툴라' 특수 작전 차량은 사막에서 사용되었으며, 장갑을 얇게 하고 중기관총을 장착하여 기습을 수행했습니다."
 game_assistant_hoi4_general_text_scripted_loc642:0 "일본의 대공 방어는 레이더 부족에 시달렸으며, 많은 도시가 밤늦게까지 등화 관리를 제대로 하지 않아 폭격에 취약했습니다."
 game_assistant_hoi4_general_text_scripted_loc643:0 "독일의 '아라도 Ar 96'는 고급 훈련기로, 전쟁 후반에는 지상 공격 임무에도 투입되었습니다."
 game_assistant_hoi4_general_text_scripted_loc644:0 "미국의 수상 비행기 PBY 카탈리나는 구조 및 대잠 초계에 광범위하게 사용되었으며, 수많은 격추된 조종사를 구했습니다."
 game_assistant_hoi4_general_text_scripted_loc645:0 "소련의 '트랙터 대전차포'는 민간 트랙터에 57mm 대전차포를 장착하여 급조된 자주 대전차포로 사용되었습니다."
 game_assistant_hoi4_general_text_scripted_loc646:0 "독일의 '함부르크' 경순양함은 전쟁 중 거의 항구에 정박해 있었으며, 주로 훈련 및 대공 플랫폼으로 사용되었습니다."
 game_assistant_hoi4_general_text_scripted_loc647:0 "일본의 '나카지마 B5N' 함상 공격기는 진주만 공습에서 주요 어뢰 폭격기로 사용되었으며, 전쟁 초기 뛰어난 성능을 보였습니다."
 game_assistant_hoi4_general_text_scripted_loc648:0 "영국의 방공 식별 시스템은 피아 식별을 위해 레이더에 응답기를 장착하여 아군의 오폭을 줄였습니다."
 game_assistant_hoi4_general_text_scripted_loc649:0 "독일의 '경전차' 시리즈는 정찰과 지원 임무에 사용되었지만, 초기 전차에 비해 화력과 장갑이 부족했습니다."
 game_assistant_hoi4_general_text_scripted_loc650:0 "미국의 대일 전략 폭격은 기존의 고고도 정밀 폭격에서 저고도 야간 소이탄 공격으로 전환하여 효과를 극대화했습니다."
 game_assistant_hoi4_general_text_scripted_loc651:0 "소련의 병참 철도는 전쟁에서 결정적인 역할을 했으며, 군대와 물자를 신속하게 전선으로 수송했습니다."
 game_assistant_hoi4_general_text_scripted_loc652:0 "일본의 잠수함에는 종종 수상 정찰기가 탑재되어 원거리 해상 정찰에 사용되었지만, 생산 수는 적었습니다."
 game_assistant_hoi4_general_text_scripted_loc653:0 "영국의 '메리트' 구축함은 북해에서 호송 임무를 수행했으며, 어뢰로 여러 척의 독일 구축함을 격침시켰습니다."
 game_assistant_hoi4_general_text_scripted_loc654:0 "독일군은 동부 전선에서 상당한 크기의 코사크 기병 부대를 활용했으며, 이들은 소련에 대해 잔혹한 전투를 벌였습니다."
 game_assistant_hoi4_general_text_scripted_loc655:0 "미국의 'H-4' 헤라클레스 비행 보트는 전쟁 후 단 한 번의 시험 비행만 했으며, 세계에서 가장 큰 목재 비행기로 남아 있습니다."
 game_assistant_hoi4_general_text_scripted_loc656:0 "소련의 대전차 전술은 대전차 소총, 수류탄, 화염병을 결합하여 기계화 부대의 진격을 늦추는 데 중점을 두었습니다."
 game_assistant_hoi4_general_text_scripted_loc657:0 "일본의 '쇼니' 전투기는 경량 전투기로, 주로 방공 및 훈련에 사용되었으며 전쟁 후반까지 생산되었습니다."
 game_assistant_hoi4_general_text_scripted_loc658:0 "독일의 '지벨' 자주 대공포는 반궤도 차량에 37mm 대공포를 장착했으며, 저고도 방어에 효과적이었습니다."
 game_assistant_hoi4_general_text_scripted_loc659:0 "영국 해군의 '라미리' 전함은 노르망디 상륙에서 포격 지원에 사용되었으며, 주포로 독일 해안 포대를 파괴했습니다."
 game_assistant_hoi4_general_text_scripted_loc660:0 "미국의 '콘베이' 호송 항공모함은 상선을 개조한 것으로, 대서양에서 호송선단에 공중 엄호를 제공했습니다."
 game_assistant_hoi4_general_text_scripted_loc661:0 "소련의 항공기 생산은 전쟁 기간 동안 급증했으며, 많은 공장이 우랄 산맥 동쪽으로 이전되어 생산을 유지했습니다."
 game_assistant_hoi4_general_text_scripted_loc662:0 "일본의 '미츠비시 Ki-46' 정찰기는 고속과 장거리로 유명했으며, 전쟁 내내 정찰 임무에 사용되었습니다."
 game_assistant_hoi4_general_text_scripted_loc663:0 "독일의 '도르니에 Do 335'는 앞뒤 엔진을 장착한 쌍발 전투기로, 매우 빠른 속도를 가졌지만 소수만 생산되었습니다."
 game_assistant_hoi4_general_text_scripted_loc664:0 "영국의 '앤슨' 다목적기는 훈련, 해상 정찰, 경폭격기 등 다양한 역할에 사용되었으며 전쟁 내내 생산되었습니다."
 game_assistant_hoi4_general_text_scripted_loc665:0 "미국의 'B-25' 미첼 폭격기는 둘리틀 공습 이후 저고도 공격과 전술 폭격에 널리 사용되었습니다."
 game_assistant_hoi4_general_text_scripted_loc666:0 "소련의 군사 평의회는 전략 결정을 위해 최고 사령부를 설립했으며, 스탈린이 최고 사령관을 맡았습니다."
 game_assistant_hoi4_general_text_scripted_loc667:0 "독일의 '플레거' 보병 지원포는 75mm 경포로, 산악 및 공수 부대에 직접 화력 지원을 제공했습니다."
 game_assistant_hoi4_general_text_scripted_loc668:0 "일본의 '요코스카 MXY7' 오카 특공기는 발사 후 분리되어 활공한 다음 로켓 추진으로 가속하는 유인 폭탄이었습니다."
 game_assistant_hoi4_general_text_scripted_loc669:0 "영국의 '리 베이퍼' 자주 대공포는 40mm 포를 장착했으며, 추축군의 지상 공격기와 저고도 폭격기에 효과적이었습니다."
 game_assistant_hoi4_general_text_scripted_loc670:0 "미국의 'M8' 그레이하운드 장갑차는 정찰과 호위 임무에 사용되었으며, 37mm 포를 장착하여 경장갑 차량을 상대했습니다."
 game_assistant_hoi4_general_text_scripted_loc671:0 "소련의 '수호이 Su-6' 공격기는 Il-2를 대체하려 했으나 Il-2의 성공과 생산 용이성으로 인해 취소되었습니다."
 game_assistant_hoi4_general_text_scripted_loc672:0 "독일의 '자우코프' 반궤도 장갑차는 보병 수송에 사용되었으며, 기관총과 기뢰 발사기를 장착했습니다."
 game_assistant_hoi4_general_text_scripted_loc673:0 "일본의 '아이치 B7A' 류세이 함상 공격기는 고성능을 가졌지만 생산이 늦었고, 연합군 폭격으로 제작이 방해받았습니다."
 game_assistant_hoi4_general_text_scripted_loc674:0 "영국의 '소드피시' 어뢰 폭격기는 구식 복엽기였지만, 비스마르크 추격전과 타란토 해전에서 놀라운 성공을 거두었습니다."
 game_assistant_hoi4_general_text_scripted_loc675:0 "미국의 'P-47' 썬더볼트는 두꺼운 장갑과 강력한 엔진으로 유명하여 전투기 및 지상 공격 임무에 탁월했습니다."
 game_assistant_hoi4_general_text_scripted_loc676:0 "소련의 '페트랴코프 Pe-8' 중폭격기는 베를린 폭격에 사용되었으며, 전략 폭격 능력이 제한된 소련 공군에서 드문 사례였습니다."
 game_assistant_hoi4_general_text_scripted_loc677:0 "독일의 '커티스 C-46' 코만도 수송기는 험프 항로에서 널리 사용되었으며, 높은 적재량과 고고도 성능을 자랑했습니다."
 game_assistant_hoi4_general_text_scripted_loc678:0 "일본의 '오오타' 수상 전투기는 수상기로, 주로 해군의 정찰 및 초계 임무에 사용되었습니다."
 game_assistant_hoi4_general_text_scripted_loc679:0 "영국의 '웨스트랜드 라이샌더' 연락기는 육군 협력 및 구조 임무에 사용되었으며, 점령지에서 요원을 수송하기도 했습니다."
 game_assistant_hoi4_general_text_scripted_loc680:0 "미국의 'M3' 스튜어트 경전차는 빠르고 기동성이 좋아 정찰 및 측면 엄호에 널리 사용되었습니다."
 game_assistant_hoi4_general_text_scripted_loc681:0 "소련의 'TS-1' 가솔린은 높은 옥탄가 항공유로, 서방 연합국의 렌드리스로 공급된 고성능 연료에 의존했습니다."
 game_assistant_hoi4_general_text_scripted_loc682:0 "독일의 '나흐트야거' 야간 전투기에는 종종 '리히텐슈타인' 레이더가 장착되었으며, 연합군의 야간 폭격기를 요격했습니다."
 game_assistant_hoi4_general_text_scripted_loc683:0 "일본의 전쟁 생산은 원자재 부족으로 크게 제약을 받았으며, 특히 철광석, 석유, 고무 수입이 거의 중단되었습니다."
 game_assistant_hoi4_general_text_scripted_loc684:0 "영국의 '글래디에이터' 전투기는 구식 복엽기였지만, 몰타와 지중해에서 초기 방공 임무에 사용되었습니다."
 game_assistant_hoi4_general_text_scripted_loc685:0 "미국의 'M36' 잭슨 구축전차는 90mm 포를 장착하여 독일의 중전차를 효과적으로 상대할 수 있었습니다."
 game_assistant_hoi4_general_text_scripted_loc686:0 "소련의 '자크-3' 전투기는 기동성이 뛰어나 저고도 격투전에서 독일 조종사들이 두려워했습니다."
 game_assistant_hoi4_general_text_scripted_loc687:0 "독일의 '포케불프 Fw 200' 콘도르 항공기는 장거리 해상 정찰 및 폭격기로 대서양에서 연합군 호송선단을 공격했습니다."
 game_assistant_hoi4_general_text_scripted_loc688:0 "일본의 '미츠비시 G3M' 네코 폭격기는 진주만 공습 이전에 중국 전장에서 널리 사용되었습니다."
 game_assistant_hoi4_general_text_scripted_loc689:0 "영국의 '파이어플라이' 전투기는 20mm 기관포를 장착한 무거운 전투기로, 주로 지상 공격 및 대전차 임무에 사용되었습니다."
 game_assistant_hoi4_general_text_scripted_loc690:0 "미국의 'M26' 퍼싱 중전차는 전쟁 말기에 유럽 전장에 배치되어 독일 중전차에 대응했습니다."
 game_assistant_hoi4_general_text_scripted_loc691:0 "소련의 '트룸' 로켓포는 BM-13 카츄샤의 개량형으로, 더 긴 사거리와 더 큰 위력을 가졌습니다."
 game_assistant_hoi4_general_text_scripted_loc692:0 "독일의 '마르더 II' 구축전차는 75mm 대전차포를 장착한 Panzer II 섀시로, 전쟁 중반에 사용되었습니다."
 game_assistant_hoi4_general_text_scripted_loc693:0 "일본의 '중전차'는 티거나 판터에 비해 장갑과 화력이 부족했으며, 종종 셔먼 전차에 열세였습니다."
 game_assistant_hoi4_general_text_scripted_loc694:0 "영국의 '바렌타인' 보병 전차는 느리지만 장갑이 두꺼워 북아프리카에서 독일 대전차포를 견뎌냈습니다."
 game_assistant_hoi4_general_text_scripted_loc695:0 "미국의 'M2' 방탄복은 조종사를 파편으로부터 보호하기 위해 설계되었지만 무겁고 불편했습니다."
 game_assistant_hoi4_general_text_scripted_loc696:0 "소련의 '기관단총' 부대는 PPSh-41로 무장하여 근접전과 돌격에서 큰 위력을 발휘했습니다."
 game_assistant_hoi4_general_text_scripted_loc697:0 "독일의 'FJ' 공수부대는 크레타 전투 후 큰 손실을 입었고, 이후 히틀러는 대규모 공수 작전을 거의 승인하지 않았습니다."
 game_assistant_hoi4_general_text_scripted_loc698:0 "일본의 '야간 전투기'는 초기에 적절한 장비가 부족했으며, 전쟁 후반까지 정규 야간 전투기 편대가 없었습니다."
 game_assistant_hoi4_general_text_scripted_loc699:0 "영국의 '모스키토' 전투 폭격기는 목재 구조로 인해 레이더 반사 면적이 작아 독일의 요격을 피할 수 있었습니다."
 game_assistant_hoi4_general_text_scripted_loc700:0 "미국의 'P-51' 머스탱은 영국의 멀린 엔진을 장착하여 고고도 성능이 크게 향상되었으며, 베를린까지 폭격기를 호위했습니다."
  game_assistant_hoi4_general_text_scripted_loc701:0 "캐나다 린제이에서 군인들은 독일군의 식별을 피하기 위해 야생 동물 울음소리를 모방한 신호를 사용했습니다."
 game_assistant_hoi4_general_text_scripted_loc702:0 "표준 무기 외에도 공수부대는 낙하 후 회수할 탄약과 접이식 카빈을 넣은 다리 주머니를 휴대했습니다."
 game_assistant_hoi4_general_text_scripted_loc703:0 "공수부대 장교들은 '크리켓' 딸깍이를 휴대했으며, 노르망디 밤에는 한 번 딸깍하면 두 번으로 응답하여 아군을 식별했습니다."
 game_assistant_hoi4_general_text_scripted_loc704:0 "'토브루크의 쥐들'은 호주 수비군을 가리키며, 쥐처럼 터널에서 나와 매복하고 적군을 괴롭혔습니다."
 game_assistant_hoi4_general_text_scripted_loc705:0 "나일론 낙하산은 제2차 세계 대전에서 처음으로 널리 사용되었으며, 점차 실크를 대체했고 미국의 생산량이 급증했습니다."
 game_assistant_hoi4_general_text_scripted_loc706:0 "소련의 낙하산 천은 종종 거친 면직물로, 높은 강하 사망률을 초래했으며, '밤의 마녀들'은 저고도 비행으로 낙하하지 않았습니다."
 game_assistant_hoi4_general_text_scripted_loc707:0 "접이식 공수 자전거는 공중 투하되어 착륙 후 빠른 기동성을 제공했으며, 영국 공수부대는 아른헴에서 이를 광범위하게 사용했습니다."
 game_assistant_hoi4_general_text_scripted_loc708:0 "독일군은 다양한 국가의 노획 장비를 광범위하게 사용했으며, 예를 들어 체코 전차, 프랑스 트럭, 소련 기관단총 등이 있습니다."
 game_assistant_hoi4_general_text_scripted_loc709:0 "일본 100식 기관단총은 생산량이 약 30,000정에 불과했으며, 총검 걸이는 전통적인 총검술 중시를 반영했습니다."
 game_assistant_hoi4_general_text_scripted_loc710:0 "영연방은 전쟁 초기에도 총검 훈련을 중시했지만, 근접전에서는 점차 수류탄과 기관단총에 의존하게 되었습니다."
 game_assistant_hoi4_general_text_scripted_loc711:0 "미국 육군은 1차 대전식 긴 참호 대신 용기병 전술을 채택하여 보병 방어의 폭발 피해를 줄였습니다."
 game_assistant_hoi4_general_text_scripted_loc712:0 "독일군은 방어 진지와 탄력적 방어를 사용하여 전진 진지에서 적을 소모시킨 후 예비군으로 후퇴하여 반격했습니다."
 game_assistant_hoi4_general_text_scripted_loc713:0 "소련의 심층 전투 이론은 전투를 통해 정교해졌으며, 포병, 전차, 보병의 협동으로 적진을 돌파했습니다."
 game_assistant_hoi4_general_text_scripted_loc714:0 "핀란드의 '모티' 전술은 숲을 이용하여 소련군 종대를 포위하고 절단하여 작은 포위망을 하나씩 파괴했습니다."
 game_assistant_hoi4_general_text_scripted_loc715:0 "지뢰는 사막 전쟁에서 널리 사용되었으며, 엘 알라메인에서 독일군은 '악마의 정원' 지뢰밭을 깔았습니다."
 game_assistant_hoi4_general_text_scripted_loc716:0 "체인 지뢰제거 전차는 회전하는 체인으로 땅을 쳐서 지뢰를 폭발시켰으며, 처칠 '크랩'은 상륙 작전에 사용되었습니다."
 game_assistant_hoi4_general_text_scripted_loc717:0 "텔러마인과 같은 대자성 지뢰는 지뢰 제거병이 탐침을 매우 조심스럽게 사용하도록 강요했습니다."
 game_assistant_hoi4_general_text_scripted_loc718:0 "독일의 '골리아트' 궤도 지뢰는 긴 케이블로 제어되어 장애물을 제거했지만, 케이블 절단과 전복으로 효과가 없었습니다."
 game_assistant_hoi4_general_text_scripted_loc719:0 "태평양 섬에서 불도저와 도저 블레이드를 장착한 전차는 폭발물과 결합하여 동굴 수비대를 소탕하는 일반적인 전술이었습니다."
 game_assistant_hoi4_general_text_scripted_loc720:0 "미국의 화염방사 셔먼은 사거리 100m 이상의 대형 화염 방사기를 탑재했으며, 특히 벙커 제거용으로 사용되었습니다."
 game_assistant_hoi4_general_text_scripted_loc721:0 "개인 화염방사기는 무거운 연료 탱크를 휴대해야 했으며, 사용자는 쉬운 표적이 되었고 심리적 공포는 엄청났습니다."
 game_assistant_hoi4_general_text_scripted_loc722:0 "근접 신관 대공 포탄은 태평양에서 가미카제에 매우 효과적이었으며, 직접 명중하지 않아도 손상을 입혔습니다."
 game_assistant_hoi4_general_text_scripted_loc723:0 "영국 해군 항공대의 노후된 소드피시 복엽 어뢰 폭격기는 비스마르크를 손상시키고 타란토에서 성공했습니다."
 game_assistant_hoi4_general_text_scripted_loc724:0 "소드피시의 후기형은 레이더를 장착하여 추운 북대서양에서 호위항모로부터 이륙하여 잠수함을 사냥했습니다."
 game_assistant_hoi4_general_text_scripted_loc725:0 "마타판 곶 해전에서 영국 전함은 야간에 레이더를 사용하여 어둠 속에서 이탈리아 중순양함을 정밀 포격했습니다."
 game_assistant_hoi4_general_text_scripted_loc726:0 "태평양에서의 마지막 전함 대 전함 교전은 수리가오 해협 전투였으며, 미국의 레이더 유도 포는 후소와 야마시로를 궤멸시켰습니다."
 game_assistant_hoi4_general_text_scripted_loc727:0 "레이더 사격 통제는 전함 주포의 맹목적 사격을 가능하게 하여 제2차 세계 대전의 해전을 근본적으로 변화시켰습니다."
 game_assistant_hoi4_general_text_scripted_loc728:0 "미국은 태평양에 이동식 서비스 중대를 설립하여 전방 기지에서 함정 수리를 가능하게 했습니다."
 game_assistant_hoi4_general_text_scripted_loc729:0 "대형 섹션으로 구성된 부유식 드라이 도크는 환초로 운송되어 조립되었으며, 본국으로 돌아가지 않고 함정을 수리했습니다."
 game_assistant_hoi4_general_text_scripted_loc730:0 "'태피' 호위항모 그룹은 사마르에서 용감하게 싸워 경함정이 중포에 맞서는 용기를 보여주었습니다."
 game_assistant_hoi4_general_text_scripted_loc731:0 "미국의 리버티 선은 용접 구조로, 기록적인 속도로 건조되었으며 가장 빠른 경우 4일 반 만에 진수되어 상선 격차를 메웠습니다."
 game_assistant_hoi4_general_text_scripted_loc732:0 "빅토리 선은 리버티 선의 균열 문제를 개선했으며, 더 강력한 출력과 보호를 가졌고 전쟁 후반에 대량으로 진수되었습니다."
 game_assistant_hoi4_general_text_scripted_loc733:0 "캐나다는 대량의 코르벳함과 소해함을 건조했으며, 조선소는 24시간 가동되어 대서양 생명선을 지원했습니다."
 game_assistant_hoi4_general_text_scripted_loc734:0 "독일의 XXI형 잠수함은 높은 수중 속도를 가진 혁명적인 전기 보트였지만, 실전 배치가 너무 늦어 효과를 보지 못했습니다."
 game_assistant_hoi4_general_text_scripted_loc735:0 "XXIII형 소형 연안 전기 보트는 여러 척이 실전에 투입되었으며, 은밀하고 탐지가 어려웠습니다."
 game_assistant_hoi4_general_text_scripted_loc736:0 "발터 잠수함은 과산화수소 추진으로 높은 수중 속도를 냈으며, 프로토타입이 테스트되었지만 실전 배치되지는 않았습니다."
 game_assistant_hoi4_general_text_scripted_loc737:0 "영국군은 U-570을 노획하여 HMS 그래프로 개명했으며, 시험과 대잠전 훈련 상대로 사용했습니다."
 game_assistant_hoi4_general_text_scripted_loc738:0 "미국 잠수함 USS 탕은 많은 일본 선박을 격침시켰지만, 마지막 어뢰의 순환운동으로 자침했습니다."
 game_assistant_hoi4_general_text_scripted_loc739:0 "일본의 코효테키 소형 잠수함은 진주만 공격에 참여했으며, 두 척이 좌초되었고 한 승무원이 최초의 일본인 포로가 되었습니다."
 game_assistant_hoi4_general_text_scripted_loc740:0 "가이텐 인간 어뢰는 모함에 의해 운반되었으며, 조종자는 내부에 밀봉되어 공격 전에 표적 식별에 어려움을 겪었습니다."
 game_assistant_hoi4_general_text_scripted_loc741:0 "영국 모스키토 전투폭격기는 아미앵 감옥과 게슈타포 본부를 정밀 공습하여 부수적 피해를 최소화했습니다."
 game_assistant_hoi4_general_text_scripted_loc742:0 "덴마크 저항군은 전쟁 마지막 단계에서 수많은 철도 시설을 폭파하여 노르망디로 가는 독일군 증원을 방해했습니다."
 game_assistant_hoi4_general_text_scripted_loc743:0 "벨기에 저항군은 앤트워프 항구의 주요 시설을 보호하여 해방 후 신속히 가동될 수 있게 했습니다."
 game_assistant_hoi4_general_text_scripted_loc744:0 "폴란드 홈 아르미야는 바르샤바 봉기 외에도 V-2 로켓 잔해를 영국에 밀수출하여 분석을 도왔습니다."
 game_assistant_hoi4_general_text_scripted_loc745:0 "독일의 다연장 로켓포 '네벨베르퍼'(연막 발사기)는 적을 속여 연막 부대일 뿐이라고 생각하게 하여 포병의 정체를 은폐했습니다."
 game_assistant_hoi4_general_text_scripted_loc746:0 "미국의 사이판 상륙 전, 전단지와 방송을 통해 일본 지휘관 사이토를 압박하여 궁지에 몰아넣었습니다."
 game_assistant_hoi4_general_text_scripted_loc747:0 "일본군은 종종 '만세 돌격'을 최후의 자살 공격으로 수행했으며, 애투, 사이판, 타라와에서 볼 수 있었습니다."
 game_assistant_hoi4_general_text_scripted_loc748:0 "겨자 가스와 신경 작용제는 나치에 의해 생산 및 비축되었지만, 상호 억제로 인해 전장에서 널리 사용되지는 않았습니다."
 game_assistant_hoi4_general_text_scripted_loc749:0 "1차 대전 독가스의 그림자는 교전국들을 대체로 자제하게 했지만, 일본군의 중국 내 사용과 같은 산발적인 사용이 있었습니다."
 game_assistant_hoi4_general_text_scripted_loc750:0 "일본군은 중국에서 구토제와 수포제와 같은 화학 무기를 사용했으며, 수백 건의 사례가 문서화되었습니다."
 game_assistant_hoi4_general_text_scripted_loc751:0 "겨자 가스 폭탄을 실은 미국 리버티 선 SS 존 하비는 이탈리아 바리 공습 중 피격되어 치명적인 화학 물질 유출을 일으켰습니다."
 game_assistant_hoi4_general_text_scripted_loc752:0 "이 사건은 질소 머스터드에 대한 광범위한 의학 연구로 이어져 간접적으로 화학 요법을 발전시켰습니다."
 game_assistant_hoi4_general_text_scripted_loc753:0 "항말라리아제 아타브린은 태평양에서 군대에 의해 강제 복용되었으며, 피부 황변 부작용은 징계 문제가 되었습니다."
 game_assistant_hoi4_general_text_scripted_loc754:0 "DDT는 난민과 군인에게 직접 살포되어 이가 매개하는 발진티푸스를 억제했으며, 위생 전쟁에서의 첫 승리였습니다."
 game_assistant_hoi4_general_text_scripted_loc755:0 "전시 성형 수술이 발전하여 화상 및 안면 손상 치료의 진보가 있었으며, 길리스 같은 외과의사가 전문 부서를 설립했습니다."
 game_assistant_hoi4_general_text_scripted_loc756:0 "혈액 은행과 혈장 수송 시스템이 완성되었으며, 냉장 및 동결건조 혈장을 사용하여 수많은 출혈 환자를 구했습니다."
 game_assistant_hoi4_general_text_scripted_loc757:0 "페니실린은 1944년까지 대량 생산되었으며, 곰팡이 발효액에서 추출되어 상처 감염 사망률을 극적으로 줄였습니다."
 game_assistant_hoi4_general_text_scripted_loc758:0 "설파 분말은 응급 처치로 휴대되어 상처에 뿌려 감염을 예방했으며, 이는 중요한 초기 조치였습니다."
 game_assistant_hoi4_general_text_scripted_loc759:0 "독일은 훈증 살충제인 치클론 B를 학살 수용소에서 산업적 규모의 살인에 사용했습니다."
 game_assistant_hoi4_general_text_scripted_loc760:0 "화장터와 시신 처리는 학살 수용소에서 조립 라인이 되어 증거의 대량 파괴를 가능하게 했습니다."
 game_assistant_hoi4_general_text_scripted_loc761:0 "최종 단계의 수용소에서의 죽음의 행진은 수감자들이 혹한 속에서 총에 맞고 굶주렸으며, 수많은 시신이 도로변에 남겨졌습니다."
 game_assistant_hoi4_general_text_scripted_loc762:0 "치치지마의 일본군은 격추된 미군 조종사를 학대하고 식인했으며, '아버지 섬 사건'으로 전후 재판을 받았습니다."
 game_assistant_hoi4_general_text_scripted_loc763:0 "리에파야 학살에서 독일군과 지역 협력자들은 체계적으로 수천 명의 유대인을 살해했습니다."
 game_assistant_hoi4_general_text_scripted_loc764:0 "바비 야르 학살은 키예프 근처에서 발생했으며, 이틀에 걸쳐 거의 34,000명의 유대인이 총살되고 계곡에 묻혔습니다."
 game_assistant_hoi4_general_text_scripted_loc765:0 "난징 안전지대 국제위원회의 소수의 외국인들은 민간인을 보호하려 했지만, 폭력은 계속되었습니다."
 game_assistant_hoi4_general_text_scripted_loc766:0 "아이리스 장의 저서 '난징의 강간'은 이 역사를 서방의 더 넓은 대중에게 알렸습니다."
 game_assistant_hoi4_general_text_scripted_loc767:0 "1942년 싱가포르 점령 후, 일본은 이를 쇼난 섬으로 개명하고 '숙칭' 화교 숙청을 단행했습니다."
 game_assistant_hoi4_general_text_scripted_loc768:0 "북아프리카의 횃불 작전은 독일군에 대한 미국의 첫 주요 지상 개입이었습니다."
 game_assistant_hoi4_general_text_scripted_loc769:0 "카세린 고개 전투에서 미군은 초기에 패배했으며, 기갑 전술과 협동의 많은 결함을 노출했습니다."
 game_assistant_hoi4_general_text_scripted_loc770:0 "롱 레인지 사막 정찰대는 리비아의 추축국 비행장을 기습했으며, 적진 후방 1,000km 이상 침투했습니다."
 game_assistant_hoi4_general_text_scripted_loc771:0 "보잉 B-29는 엔진 과열과 자연 발화로 어려움을 겪었으며, 마리아나 제도 임무에서는 무선 침묵이 자주 유지되었습니다."
 game_assistant_hoi4_general_text_scripted_loc772:0 "실버플레이트 프로젝트는 원자폭탄 투하를 위해 B-29를 개조했으며, 특별히 개조된 폭탄창과 중량 감소가 특징이었습니다."
 game_assistant_hoi4_general_text_scripted_loc773:0 "에놀라 게이는 '리틀 보이'를 투하했으며, 조종사 티베츠 대령은 어머니의 이름을 따서 항공기를 명명했습니다."
 game_assistant_hoi4_general_text_scripted_loc774:0 "복스카는 '팻 맨'을 투하했으며, 일차 목표인 고쿠라는 연기로 가려져 나가사키로 변경되었습니다."
 game_assistant_hoi4_general_text_scripted_loc775:0 "나가사키 상공의 구름이 잠시 갈라졌으며, 폭격수 커미트 비핸은 틈새로 폭탄을 투하하여 조준점을 빗나갔습니다."
 game_assistant_hoi4_general_text_scripted_loc776:0 "폭발과 열 효과 외에도, 방사선 질병과 백혈병은 원자폭탄 이후 수년간 생존자를 괴롭혔습니다."
 game_assistant_hoi4_general_text_scripted_loc777:0 "히바쿠샤(피폭자)는 차별에 직면했으며, 일본 사회는 오랫동안 방사선 공포에 대한 오해와 배척을 유지했습니다."
 game_assistant_hoi4_general_text_scripted_loc778:0 "소련의 첫 원자폭탄 조-1은 1949년에 시험되었으며, 부분적으로 간첩 활동의 도움을 받았습니다."
 game_assistant_hoi4_general_text_scripted_loc779:0 "클라우스 푹스와 다른 맨해튼 프로젝트 과학자들은 핵 비밀을 소련에 제공하여 무기 프로그램을 가속화했습니다."
 game_assistant_hoi4_general_text_scripted_loc780:0 "로젠버그 부부는 소련을 위해 원자 비밀을 훔친 혐의로 재판을 받고 처형되었지만, 논란은 여전히 남아 있습니다."
 game_assistant_hoi4_general_text_scripted_loc781:0 "파리 조약과 같은 전후 조약은 유럽 석탄 철강 공동체로 이어졌으며, 통합과 전쟁의 근원 제거를 목표로 했습니다."
 game_assistant_hoi4_general_text_scripted_loc782:0 "브레튼 우즈 체제는 달러의 금 연동을 확립하고 IMF와 세계 은행을 창설했습니다."
 game_assistant_hoi4_general_text_scripted_loc783:0 "제2차 세계 대전은 제트 엔진, 탄도 미사일, 컴퓨터, 항생제와 같은 많은 기술을 탄생시켰습니다."
 game_assistant_hoi4_general_text_scripted_loc784:0 "'콜로서스'와 같은 전자 컴퓨터 선구자는 암호 해독에 사용되었으며, 튜링이 설계에 기여했습니다."
 game_assistant_hoi4_general_text_scripted_loc785:0 "ENIAC 컴퓨터는 원래 포병 사격표 계산을 위해 설계되었으며, 전후 최초의 범용 컴퓨터로 완성되었습니다."
 game_assistant_hoi4_general_text_scripted_loc786:0 "페니실린, 레이더, 제트 엔진은 폭발적인 발전을 이루었으며 제2차 세계 대전 중 성숙 단계에 도달했습니다."
 game_assistant_hoi4_general_text_scripted_loc787:0 "합성 고무 및 플라스틱 산업은 천연 자원 봉쇄로 인해 크게 발전했으며, 민간에 지대한 영향을 미쳤습니다."
 game_assistant_hoi4_general_text_scripted_loc788:0 "DNA는 전후에 발견되었지만, 전시 유전학 및 방사선 생물학 연구는 기초를 마련했습니다."
 game_assistant_hoi4_general_text_scripted_loc789:0 "독일의 '국민 라디오'는 저렴했으며 지역 방송국만 수신할 수 있었고, 선전과 공습 경보에 사용되었습니다."
 game_assistant_hoi4_general_text_scripted_loc790:0 "BBC는 다국어 방송을 계속하여 점령지 사람들에게 정보와 희망의 중요한 원천이 되었습니다."
 game_assistant_hoi4_general_text_scripted_loc791:0 "일본의 선전은 누드 여성과 해골 이미지의 전단지를 사용하여 적의 사기를 약화시키고 향수와 공포를 유발했습니다."
 game_assistant_hoi4_general_text_scripted_loc792:0 "태평양 섬 원주민들은 안내인, 짐꾼, 코스트워처로 복무했으며, 예를 들어 솔로몬 제도 주민들이 있습니다."
 game_assistant_hoi4_general_text_scripted_loc793:0 "가짜 전쟁은 선전포고에서 1940년 서부 전선 교착 상태까지 지속되었으며, 독일과 프랑스군은 지크프리트 선과 마지노 선을 따라 대치했습니다."
 game_assistant_hoi4_general_text_scripted_loc794:0 "가짜 전쟁 중 영국과 프랑스는 폭탄 대신 선전 전단지를 투하했으며, 서부 전선에 실질적인 영향은 없었습니다."
 game_assistant_hoi4_general_text_scripted_loc795:0 "덴마크는 약 2시간 만에 항복했지만, 정부와 국왕은 남아 있어 초기 점령이 비교적 온건했습니다."
 game_assistant_hoi4_general_text_scripted_loc796:0 "노르웨이 국왕 호콘 7세는 항복을 거부하고 영국으로 망명하여 저항을 이끌었으며, 민족 통합의 상징이 되었습니다."
 game_assistant_hoi4_general_text_scripted_loc797:0 "네덜란드 빌헬미나 여왕은 런던에서 방송을 통해 네덜란드 저항에 영감을 주었으며, '전쟁 여왕'이라는 칭호를 얻었습니다."
 game_assistant_hoi4_general_text_scripted_loc798:0 "벨기에 레오폴드 3세 국왕은 정부가 망명하는 동안 포로로 남기로 선택하여 전후 헌정 위기를 초래했습니다."
 game_assistant_hoi4_general_text_scripted_loc799:0 "그리스 국왕 요르요스 2세는 망명했으며, 국내 저항 운동은 좌파와 우파를 모두 포함하여 나중에 내전으로 이어졌습니다."
 game_assistant_hoi4_general_text_scripted_loc800:0 "룩셈부르크 샤를로트 대공비는 망명하여 BBC를 통해 국민에게 영감을 주었으며, 작은 공국은 큰 고통을 겪었습니다."
  game_assistant_hoi4_general_text_scripted_loc801:0 "나치는 체코의 리디체 마을에 대해 보복으로 모든 남성을 살해하고, 여성을 수용소로 보냈으며, 마을 이름을 지웠습니다."
 game_assistant_hoi4_general_text_scripted_loc802:0 "전후 리디체는 재건되었고 전 세계에 기념비가 세워졌으며, 국제 어린이 날은 이 비극에서 유래했습니다."
 game_assistant_hoi4_general_text_scripted_loc803:0 "오라두르쉬르글란의 폐허는 프랑스의 고통을 상징하는 장소로 보존되었으며, 마을 전체 주민이 학살당했습니다."
 game_assistant_hoi4_general_text_scripted_loc804:0 "일본 점령 하에 말레이시아 화교들은 '기부금'을 강요당했고 '숙칭' 숙청을 겪었습니다."
 game_assistant_hoi4_general_text_scripted_loc805:0 "싱가포르의 부키트 티마 지역은 마지막 방어선이었으며, 상수도가 차단되어 영국군이 항복할 수밖에 없었습니다."
 game_assistant_hoi4_general_text_scripted_loc806:0 "북보르네오의 산다칸 죽음의 행진에서 단 6명의 포로만 생존했으며, 나머지는 학대받거나 처형되었습니다."
 game_assistant_hoi4_general_text_scripted_loc807:0 "연합군 포로들은 대만 진과석 동광에서 가혹한 조건 하에 강제 노동당했으며, 사망률이 매우 높았습니다."
 game_assistant_hoi4_general_text_scripted_loc808:0 "웨이크 섬 수비군 항복 후, 일본군은 대부분의 포로를 처형했습니다."
 game_assistant_hoi4_general_text_scripted_loc809:0 "이오지마의 스리바치산 게양은 두 번 촬영되었으며, 첫 번째 깃발은 더 작았고 더 큰 깃발로 교체되었으며, 두 번째 사진이 상징적이 되었습니다."
 game_assistant_hoi4_general_text_scripted_loc810:0 "조 로젠탈의 게양 사진은 고전적인 선전 이미지가 되었지만, 정상이 처음 점령된 실제 순간은 아니었습니다."
 game_assistant_hoi4_general_text_scripted_loc811:0 "미국 잠수함 USS 탕은 자체 Mk 18 어뢰의 순환운동으로 침몰한 비극적인 자폭 사례였습니다."
 game_assistant_hoi4_general_text_scripted_loc812:0 "독일의 '미스텔' 복합 항공기는 폭약으로 가득 찬 무인 Ju 88과 그 위에 장착된 전투기로 구성되어 표적에 충돌하도록 유도되었습니다."
 game_assistant_hoi4_general_text_scripted_loc813:0 "미스텔은 노르망디 해변과 다리 공격에 사용되었지만 정확도가 낮고 요격이 쉬웠습니다."
 game_assistant_hoi4_general_text_scripted_loc814:0 "영국의 '하이볼'은 대함용 바운싱 폭탄으로, 실전에는 사용되지 않았으며 원래 티르피츠를 위해 고안되었습니다."
 game_assistant_hoi4_general_text_scripted_loc815:0 "공랭식과 액랭식 엔진은 각각 장단점이 있었으며, P-47의 프랫 앤 휘트니 R-2800 공랭식 엔진은 기수를 부피가 크게 만들었지만 튼튼했습니다."
 game_assistant_hoi4_general_text_scripted_loc816:0 "일본의 호마레 엔진은 종이상으로는 높은 출력이었지만, 제조 요구 사항과 재료 저하로 인해 신뢰성이 낮았습니다."
 game_assistant_hoi4_general_text_scripted_loc817:0 "다임러-벤츠 DB 601 역V12 액랭식 엔진은 Bf 109에 동력을 제공했으며, 연료 분사로 인해 마이너스 G에서도 꺼지지 않았습니다."
 game_assistant_hoi4_general_text_scripted_loc818:0 "롤스로이스 멀린 엔진은 스핏파이어와 머스탱으로 유명하며, 2단 과급기로 고고도 성능을 향상시켰습니다."
 game_assistant_hoi4_general_text_scripted_loc819:0 "소련 클리모프 M-105는 프랑스 이스파노-스이자 설계에서 파생되었으며, Yak 시리즈를 위해 업그레이드되었습니다."
 game_assistant_hoi4_general_text_scripted_loc820:0 "과급기 기술은 제2차 세계 대전 중 단단 단속에서 2단 다속으로 발전하여 엔진의 고고도 흡기를 개선했습니다."
 game_assistant_hoi4_general_text_scripted_loc821:0 "아산화질소 분사와 메탄올-물 분사는 전시 비상 출력 부스트로 사용되었으며, 수십 초 동안 출력을 증가시켰습니다."
 game_assistant_hoi4_general_text_scripted_loc822:0 "항공 연료는 87옥탄에서 100/130, 심지어 115/145로 발전하여 고성능 엔진을 가능하게 했습니다."
 game_assistant_hoi4_general_text_scripted_loc823:0 "독일 C3 연료는 등급이 낮았지만 많은 후기 항공기에 사용되었으며, B4가 일반적이었고 부족으로 인해 더 낮은 등급을 강요받았습니다."
 game_assistant_hoi4_general_text_scripted_loc824:0 "합성 연료 공장은 폭격에 취약했으며, 슈페어는 생산을 지하로 분산했지만 출력은 급격히 떨어졌습니다."
 game_assistant_hoi4_general_text_scripted_loc825:0 "도라 단지와 같은 지하 공장은 끔찍한 조건에서 V-2 로켓을 생산했으며, 수감자 사망률이 충격적으로 높았습니다."
 game_assistant_hoi4_general_text_scripted_loc826:0 "항공기 부품은 분산된 삼림 공장에서 제작되었으며, He 162 프로그램처럼 고속도로에서 최종 조립이 이루어졌습니다."
 game_assistant_hoi4_general_text_scripted_loc827:0 "목재와 합판은 항공기에 널리 사용되었으며, 모스키토는 발사 우드 샌드위치 패널을 사용하여 가볍고 레이더 반사가 없었습니다."
 game_assistant_hoi4_general_text_scripted_loc828:0 "독일 Ta 154는 모스키토의 목재 구조를 모방하려 했지만, 접착제 불량으로 사고가 발생하여 프로젝트가 취소되었습니다."
 game_assistant_hoi4_general_text_scripted_loc829:0 "미국 휴스 H-4 허큘리스(가문비나무 거위) 전목제 비행 보트는 전후 한 번의 시험 비행만 했으며, 그 날개는 오늘날까지 보존되어 있습니다."
 game_assistant_hoi4_general_text_scripted_loc830:0 "독일 체펠린은 초기 대서양 초계에 사용되었지만, 취약성과 헬륨 부족으로 철수되었습니다."
 game_assistant_hoi4_general_text_scripted_loc831:0 "일본의 풍선 폭탄은 화지 종이와 곤약 접착제로 만들어졌으며, 고도 제트 기류를 이용했지만 효과는 거의 없었습니다."
 game_assistant_hoi4_general_text_scripted_loc832:0 "하인켈 He 111은 전쟁 초기 독일의 주력 폭격기였으며, 이후 수송 및 미사일 발사 플랫폼으로 개조되었습니다."
 game_assistant_hoi4_general_text_scripted_loc833:0 "독일은 최초의 사출 좌석을 개발하여 He 219 야간 전투기와 Do 335에서 테스트했으며, 여러 조종사를 구했습니다."
 game_assistant_hoi4_general_text_scripted_loc834:0 "Do 335는 푸시-풀 쌍발 엔진 배치로 매우 빨랐지만, 소수의 프로토타입만이 제트기와 맞섰습니다."
 game_assistant_hoi4_general_text_scripted_loc835:0 "블로흐 운트 포스 BV 141은 비대칭 정찰기로, 조종석이 한쪽에 있어 독특한 시야를 제공했지만 양산되지는 않았습니다."
 game_assistant_hoi4_general_text_scripted_loc836:0 "프랑스 아미오 354 폭격기는 날렵한 디자인을 가졌지만, 프랑스가 함락되면서 대부분 버려졌습니다."
 game_assistant_hoi4_general_text_scripted_loc837:0 "이탈리아 항공 산업은 속도 기록을 보유했지만 뛰어난 전투기를 대량 생산하지 못했습니다(예: 제한된 MC.205)."
 game_assistant_hoi4_general_text_scripted_loc838:0 "스웨덴 SAAB 21 전투기/공격기는 독특한 푸셔 프로펠러 배치와 사출 좌석을 가졌으며, 전후에 운용되었습니다."
 game_assistant_hoi4_general_text_scripted_loc839:0 "스위스 모란 D-3800은 프랑스 MS.406을 복사했으며, 중립 초계를 위해 전쟁 말기까지 생산이 계속되었습니다."
 game_assistant_hoi4_general_text_scripted_loc840:0 "일본의 대전차 무기는 부족했으며, 전쟁 말기 병사들은 폭약을 붙인 대나무 장대 '돌격 지뢰'를 자살 공격으로 사용했습니다."
 game_assistant_hoi4_general_text_scripted_loc841:0 "판저파우스트와 판처슈렉과 같은 어깨 발사 대전차 무기는 시가전에서 연합군 전차에 큰 손실을 초래했습니다."
 game_assistant_hoi4_general_text_scripted_loc842:0 "성형작약 원리가 성숙되어 보병 대전차 무기가 관통력을 달성할 수 있게 되었습니다."
 game_assistant_hoi4_general_text_scripted_loc843:0 "영국 PIAT는 스프링으로 기폭 장치를 발사했으며, 사거리가 짧았지만 역화가 없어 실내 사용에 적합했습니다."
 game_assistant_hoi4_general_text_scripted_loc844:0 "미국 M9 바주카는 두꺼운 독일 장갑에 대응하기 위해 관통력을 개선했으며, 전후에도 운용되었습니다."
 game_assistant_hoi4_general_text_scripted_loc845:0 "독일 88mm PaK 43은 강력한 대전차포였지만 극도로 무거웠습니다."
 game_assistant_hoi4_general_text_scripted_loc846:0 "소련 BS-3 100mm 야포는 대전차 용도에 탁월했으며 오랫동안 운용되었습니다."
 game_assistant_hoi4_general_text_scripted_loc847:0 "'나스호른' 자주 대전차포는 과도기 섀시에 88mm PaK 43을 장착했으며, 장갑은 얇았지만 화력은 막대했습니다."
 game_assistant_hoi4_general_text_scripted_loc848:0 "판터 IV/70(V) 구축전차는 낮은 자세와 강력한 장포신을 가졌지만, 무거운 전면으로 인해 진흙에 자주 빠졌습니다."
 game_assistant_hoi4_general_text_scripted_loc849:0 "야크트판터는 판터 섀시와 88mm 포를 결합했으며, 경사 장갑, 좋은 속도, 화력을 갖추었습니다."
 game_assistant_hoi4_general_text_scripted_loc850:0 "야크트티거는 티거 II 섀시에 128mm 포를 장착했으며, 위력은 막대했지만 극도로 무겁고 고장이 잦았습니다."
 game_assistant_hoi4_general_text_scripted_loc851:0 "M36 잭슨 구축전차는 90mm 포를 장착하여 티거와 판터를 위협할 수 있었으며, 회전 포탑을 가졌습니다."
 game_assistant_hoi4_general_text_scripted_loc852:0 "소련 SU-100 자주포는 T-34 섀시에 100mm 포를 장착했으며, 경사 장갑과 높은 관통력을 가졌습니다."
 game_assistant_hoi4_general_text_scripted_loc853:0 "영국 아킬레스는 M10을 개조하여 17파운드 포를 장착했으며, 영국 주력 구축전차가 되었습니다."
 game_assistant_hoi4_general_text_scripted_loc854:0 "일본 4식 호로 자주포는 97식 섀시에 150mm 곡사포를 장착했으며, 소수만 제작되었습니다."
 game_assistant_hoi4_general_text_scripted_loc855:0 "97식 신호토 치하 중형전차는 새로운 포탑과 1식 47mm 포를 장착하여 초기 연합군 전차에 간신히 대응했습니다."
 game_assistant_hoi4_general_text_scripted_loc856:0 "일본 1식 47mm 대전차포는 높은 초속을 가졌지만, 등장이 너무 늦었고 수량이 부족했습니다."
 game_assistant_hoi4_general_text_scripted_loc857:0 "미국 M3 37mm 대전차포는 전쟁 초기에 위력이 부족했지만, 태평양에서는 사용 가능했습니다."
 game_assistant_hoi4_general_text_scripted_loc858:0 "엘 알라메인의 영국 6파운드 대전차포는 효과적이었으며, APDS 탄을 장착하면 관통력이 더욱 향상되었습니다."
 game_assistant_hoi4_general_text_scripted_loc859:0 "APDS(분리형 철갑탄)는 영국 발명으로, 탄이 가벼운 외피를 벗어던져 작은 고속 코어가 장갑을 타격합니다."
 game_assistant_hoi4_general_text_scripted_loc860:0 "테이퍼 보어 포의 원리는 독일 sPzB 41과 같이 구경이 점차 감소하여 텅스텐 코어를 압착하는 것이었지만, 텅스텐 부족으로 생산이 중단되었습니다."
 game_assistant_hoi4_general_text_scripted_loc861:0 "성형작약 HEAT 포탄은 독일 자기 지뢰와 연합군 소총 유탄과 같은 대전차 무기에 널리 사용되었습니다."
 game_assistant_hoi4_general_text_scripted_loc862:0 "M1A1 바주카는 한국 전쟁까지 운용되었으며, 노획한 것은 독일군이 사용하여 더 큰 HEAT 탄두를 추가했습니다."
 game_assistant_hoi4_general_text_scripted_loc863:0 "독일군은 노획한 바주카를 사용하여 88mm 구경의 '판처슈렉' 로켓포를 개발했습니다."
 game_assistant_hoi4_general_text_scripted_loc864:0 "판저파우스트는 60, 100, 150m 거리 모델로 개발되었으며, 구조가 간단하고 전쟁 말까지 800만 개가 생산되었습니다."
 game_assistant_hoi4_general_text_scripted_loc865:0 "독일 '슈름게베어'는 최후의 발악적인 돌격소총으로, 종이상으로만 존재했으며 중간 탄을 사용했습니다."
 game_assistant_hoi4_general_text_scripted_loc866:0 "덴마크 마드센 기관총은 경기관총의 선구자로, 많은 국가에서 사용되었으며 복잡했지만 신뢰성이 있었습니다."
 game_assistant_hoi4_general_text_scripted_loc867:0 "체코 ZB-26 경기관총은 영국 브렌 건으로 발전했으며, 상부 장전식 탄창으로 정확한 점사에 적합했습니다."
 game_assistant_hoi4_general_text_scripted_loc868:0 "브렌 건은 장착 시 신속한 총열 교체가 가능했으며, 30발 곡선 탄창을 사용하여 영연방 보병 분대의 핵심이었습니다."
 game_assistant_hoi4_general_text_scripted_loc869:0 "일본 11식 경기관총('남부')은 호퍼 급탄식으로, 고장이 잦았고 윤활을 위해 오일러에 의존했습니다."
 game_assistant_hoi4_general_text_scripted_loc870:0 "96식과 99식 경기관총은 급탄 장치를 개선했지만 여전히 무겁고 부품 호환성이 부족했습니다."
 game_assistant_hoi4_general_text_scripted_loc871:0 "소련 DT 전차 기관총을 보병용으로 개조하면 다소 다루기 불편했고, 상부 장전식 팬 탄창은 진흙에서 쉽게 더러워졌습니다."
 game_assistant_hoi4_general_text_scripted_loc872:0 "수냉식 중기관총은 점차 공랭식으로 대체되었으며, 예를 들어 M1919A4는 더 유연했지만 지속 사격 능력은 떨어졌습니다."
 game_assistant_hoi4_general_text_scripted_loc873:0 "소련 SG-43 고류노프는 막심을 대체하는 공랭식으로, 내진성과 기동성이 더 좋았습니다."
 game_assistant_hoi4_general_text_scripted_loc874:0 "독일 MG34는 다목적 기관총의 선구자로, 벨트 또는 드럼 급탄이 가능했으며 정교했지만 먼지에 민감하고 비쌌습니다."
 game_assistant_hoi4_general_text_scripted_loc875:0 "MG42는 스탬핑 금속으로 만들어져 저렴했고 엄청난 연사력을 가졌으며, 그 파생형 MG3는 오늘날까지 사용됩니다."
 game_assistant_hoi4_general_text_scripted_loc876:0 "미국 M1919A6은 개머리판과 양각대를 추가하여 경기관총 역할을 하도록 했지만, 너무 무거워 효과가 없었습니다."
 game_assistant_hoi4_general_text_scripted_loc877:0 "브라우닝 자동소총(BAR)은 분대 경기관총 역할을 했으며, 20발 탄창은 지속 사격을 제한했고 다루기에 무거웠습니다."
 game_assistant_hoi4_general_text_scripted_loc878:0 "일본 92식 중기관총은 스트립 급탄식으로, 연사력은 느렸지만 정확도가 좋았고 광학 조준경이 있었습니다."
 game_assistant_hoi4_general_text_scripted_loc879:0 "일본 100식 기관단총은 총검 걸이와 낙하산병용 접이식 버전이 있었지만, 대량으로 투입되지는 않았습니다."
 game_assistant_hoi4_general_text_scripted_loc880:0 "미국 M1A1 톰슨은 장전 손잡이와 볼트를 단순화했으며, 이후 30발 탄창을 사용했지만 유지보수는 복잡했습니다."
 game_assistant_hoi4_general_text_scripted_loc881:0 "M3 '그리스 건'은 톰슨보다 훨씬 저렴한 20달러였지만, 처음에는 보병의 신뢰를 받지 못했습니다."
 game_assistant_hoi4_general_text_scripted_loc882:0 "독일 StG45(M)은 롤러 지연 반동 작동 방식의 프로토타입으로, 이후 헤클러 운트 코흐에 영향을 미쳤습니다."
 game_assistant_hoi4_general_text_scripted_loc883:0 "소련 SKS 반자동 카빈은 전쟁 말기에 소규모로 테스트되었으며, 7.62×39mm 중간 탄을 사용했습니다."
 game_assistant_hoi4_general_text_scripted_loc884:0 "독일 7.92×33mm 쿠르츠 탄은 짧은 탄피로 제어 가능한 반동을 제공하여 돌격소총 시대를 열었습니다."
 game_assistant_hoi4_general_text_scripted_loc885:0 "소련 M43 탄은 노획한 독일 쇼트 탄에서 영감을 얻었으며, 이후 AK 탄으로 이어졌습니다."
 game_assistant_hoi4_general_text_scripted_loc886:0 "전쟁 말기 설계자들은 중간 구경 탄약, 스탬핑 공정, 단순화된 작동 방식에 집중했습니다."
 game_assistant_hoi4_general_text_scripted_loc887:0 "여러 국가에서 불펍 레이아웃과 후방 장전식 탄창을 실험했으며, 예를 들어 영국 EM-2는 전후에만 개발되었습니다."
 game_assistant_hoi4_general_text_scripted_loc888:0 "돌격소총 개념은 소총의 위력과 기관단총의 간결함을 결합하여 장거리 전력 소총 탄약의 지배력을 종식시켰습니다."
 game_assistant_hoi4_general_text_scripted_loc889:0 "독일 엔트비클룽 전차 시리즈는 부품 공용성을 목표로 했으며(예: E-25, E-50, E-75), E-100만 섀시가 제작되었습니다."
 game_assistant_hoi4_general_text_scripted_loc890:0 "소련 T-44는 엔진을 가로로 배치하고, 차체 기관총수를 없애고, 토션 바 서스펜션을 사용하여 T-54/55의 전신이 되었습니다."
 game_assistant_hoi4_general_text_scripted_loc891:0 "영국 센추리온 전차는 1945년 유럽에 도착했지만 실전에는 투입되지 않았고, 주력 전차 개념을 개척했습니다."
 game_assistant_hoi4_general_text_scripted_loc892:0 "미국 M26 퍼싱 중전차는 제한적으로 유럽에 배치되었으며, 90mm 포는 티거와 판터와 교전할 수 있었지만 기동성이 부족했습니다."
 game_assistant_hoi4_general_text_scripted_loc893:0 "IS-3의 외관(쐐기형 전면, 반구형 포탑)은 베를린 승리 퍼레이드에서 서방을 충격에 빠뜨렸고 중전차 경쟁을 촉발했습니다."
 game_assistant_hoi4_general_text_scripted_loc894:0 "전후 일본은 군대 보유가 금지되었으며, 헌법 제9조에 따라 자위대만 설립했습니다."
 game_assistant_hoi4_general_text_scripted_loc895:0 "후속 뉘른베르크 재판은 의사, 판사, 산업가 등을 기소하여 반인도적 범죄를 확립했습니다."
 game_assistant_hoi4_general_text_scripted_loc896:0 "도쿄 재판의 일부 판사는 반대 의견을 냈으며, 인도인 팔 판사는 재판이 '승자의 심판'이라고 주장했습니다."
 game_assistant_hoi4_general_text_scripted_loc897:0 "일부 나치 전범은 '랫라인'을 통해 남미로 도피했으며, 아돌프 아이히만은 아르헨티나에서 이스라엘 요원에 의해 체포되었습니다."
 game_assistant_hoi4_general_text_scripted_loc898:0 "아우슈비츠의 '죽음의 천사' 요제프 멩겔레는 도피하여 결코 법의 심판을 받지 못했고, 브라질에서 사망했습니다."
 game_assistant_hoi4_general_text_scripted_loc899:0 "패전국은 배상금을 지불하고 영토 재조정을 겪었으며, 예를 들어 오데르-나이세 선이 독일-폴란드 국경이 되었습니다."
 game_assistant_hoi4_general_text_scripted_loc900:0 "제2차 세계 대전은 UN 안전보장이사회 체제를 수립했지만, 동시에 미소 냉전 대립으로 빠르게 빠져들었습니다."
 game_assistant_hoi4_general_text_scripted_loc901:0 "냉전의 기원은 제2차 세계 대전에서 해결되지 않은 문제, 즉 폴란드의 운명과 독일 처리에 대한 논쟁으로 거슬러 올라갈 수 있습니다."
 game_assistant_hoi4_general_text_scripted_loc902:0 "철의 장막 연설과 트루먼 독트린은 전시 동맹의 종말과 대립의 시작을 알렸습니다."
 game_assistant_hoi4_general_text_scripted_loc903:0 "베를린 공수는 소련의 서베를린 봉쇄로 촉발된 첫 번째 주요 동서 위기였습니다."
 game_assistant_hoi4_general_text_scripted_loc904:0 "NATO와 바르샤바 조약의 설립은 유럽을 두 개의 대립하는 군사 블록으로 분할했으며, 핵무기가 억지력의 초석이 되었습니다."
 game_assistant_hoi4_general_text_scripted_loc905:0 "제2차 세계 대전 참전용사들의 심리적 외상은 '전투 피로'라고 불렸으며, 현재는 외상후 스트레스 장애(PTSD)로 이해됩니다."
 game_assistant_hoi4_general_text_scripted_loc906:0 "수많은 불발탄이 유럽과 아시아 태평양 지역에 남아 있으며, 매년 폭발물 처리 요원들에게 사상자를 내고 있습니다."
 game_assistant_hoi4_general_text_scripted_loc907:0 "침몰한 선박은 여전히 기름 누출 위험을 안고 있으며, USS 애리조나는 진주만에서 계속 기름을 누출하고 있습니다."
 game_assistant_hoi4_general_text_scripted_loc908:0 "태평양 섬에서의 유해 회수 임무는 계속되고 있으며, 식별 후 일부는 고국으로 송환되어 안장됩니다."
 game_assistant_hoi4_general_text_scripted_loc909:0 "나치가 약탈한 예술품의 반환은 오늘날까지 계속되고 있으며, 방대한 수의 작품이 여전히 행방불명입니다."
 game_assistant_hoi4_general_text_scripted_loc910:0 "아우슈비츠와 다른 수용소는 박물관으로 보존되어 있으며, 매년 수백만 명이 방문하여 반성과 추모를 하고 있습니다."
 game_assistant_hoi4_general_text_scripted_loc911:0 "전후 일본에서는 평화주의가 대두되었으며, 역사 인식을 둘러싼 논쟁은 반복적으로 이웃 국가와의 외교적 마찰을 일으켰습니다."
 game_assistant_hoi4_general_text_scripted_loc912:0 "레이더, 제트 엔진, 전자 컴퓨터, 핵에너지와 같은 제2차 세계 대전에서 개척된 기술은 세상을 변화시켰습니다."
 game_assistant_hoi4_general_text_scripted_loc913:0 "여성들의 본토 생산 및 보조 부대 기여는 전후 성 역할 변화를 가속화했습니다."
 game_assistant_hoi4_general_text_scripted_loc914:0 "대규모 이주와 국경 변화는 동유럽의 전후 민족적 동질화를 형성했습니다."
 game_assistant_hoi4_general_text_scripted_loc915:0 "미국 GI 빌과 같은 참전용사 혜택 및 교육 프로그램은 고등 교육의 확산과 중산층의 부상으로 이어졌습니다."
 game_assistant_hoi4_general_text_scripted_loc916:0 "일본의 전후 농지 개혁과 자이바츠 해체는 경제를 재구성하여 고속 성장을 촉진했습니다."
 game_assistant_hoi4_general_text_scripted_loc917:0 "독일은 동서로 분할되어 각각 재건되었으며, 서독은 '경제 기적'을 경험하고 동독은 소련의 위성 국가가 되었습니다."
 game_assistant_hoi4_general_text_scripted_loc918:0 "영국, 프랑스 및 기타 식민 제국은 전쟁으로 약화되어 아시아와 아프리카에서 비식민화 물결을 겪었습니다."
 game_assistant_hoi4_general_text_scripted_loc919:0 "전쟁 중 영국을 지원했던 인도는 빠르게 독립했으며, 분할과 폭력적인 인구 이동이 뒤따랐습니다."
 game_assistant_hoi4_general_text_scripted_loc920:0 "호치민은 일본 항복 후 베트남 독립을 선언했지만, 프랑스가 돌아와 제1차 인도차이나 전쟁으로 이어졌습니다."
 game_assistant_hoi4_general_text_scripted_loc921:0 "한반도는 일본 통치에서 해방된 후 미소 점령 지역으로 분할되었으며, 1950년 한국 전쟁으로 이어졌습니다."
 game_assistant_hoi4_general_text_scripted_loc922:0 "이스라엘 건국은 홀로코스트와 직접적으로 연결되어 있으며, 1948년에 선언되었고 즉시 공격을 받아 아랍-이스라엘 전쟁이 발발했습니다."
 game_assistant_hoi4_general_text_scripted_loc923:0 "중국의 항일 전쟁 승리 후, 국공 내전이 재개되어 1949년 중화인민공화국 건국으로 이어졌습니다."
 game_assistant_hoi4_general_text_scripted_loc924:0 "포츠담 선언은 일본이 대만과 펑후 제도를 포함한 모든 약탈한 중국 영토를 반환할 것을 요구했습니다."
 game_assistant_hoi4_general_text_scripted_loc925:0 "비밀 얄타 협정은 외몽골의 지위와 소련의 만주 권리를 포함했으며, 일부는 이후 철회되었습니다."
 game_assistant_hoi4_general_text_scripted_loc926:0 "일본의 전후 평화 헌법은 맥아더의 지도 아래 작성되었으며, 제9조의 전쟁 포기는 드문 사례입니다."
 game_assistant_hoi4_general_text_scripted_loc927:0 "독일의 전후 기본법은 민주 체제를 확립했으며, 나치 역사에 대한 반성은 정치 문화의 일부가 되었습니다."
 game_assistant_hoi4_general_text_scripted_loc928:0 "비시 프랑스의 기억과 협력자 숙청은 수십 년간의 논쟁 끝에 공개적으로 직면하게 되었습니다."
 game_assistant_hoi4_general_text_scripted_loc929:0 "오스트리아는 오랫동안 자신을 '히틀러의 첫 번째 희생자'로 묘사했으며, 이후 자신의 참여와 범죄를 인정하게 되었습니다."
 game_assistant_hoi4_general_text_scripted_loc930:0 "스위스 은행은 나치 금과 미청구 예금에 대한 조사에 직면했으며, 1990년대에 보상 청구를 접했습니다."
 game_assistant_hoi4_general_text_scripted_loc931:0 "나치 노동자와 희생자를 위한 보상 기금은 2000년 이후 독일 정부와 산업계에 의해 설립되었습니다."
 game_assistant_hoi4_general_text_scripted_loc932:0 "폴란드와 그리스는 계속해서 전쟁 배상금을 요구했으며, 독일은 문제가 조약으로 해결되었다고 주장했습니다."
 game_assistant_hoi4_general_text_scripted_loc933:0 "'위안부' 문제는 일본과 한국(및 중국) 간의 외교적 골칫거리가 되었으며, 생존자들은 사과와 보상을 요구했습니다."
 game_assistant_hoi4_general_text_scripted_loc934:0 "난징 대학살의 사망자 수와 역사적 사실은 극동 국제 군사 재판소에 의해 확인되었습니다."
 game_assistant_hoi4_general_text_scripted_loc935:0 "전후 국제법은 집단 학살, 반인도적 범죄 등을 확립하여 이후 국제 형사 재판소의 토대를 마련했습니다."
 game_assistant_hoi4_general_text_scripted_loc936:0 "구유고슬라비아 국제 형사 재판소와 르완다 재판소는 뉘른베르크 원칙을 계승했습니다."
 game_assistant_hoi4_general_text_scripted_loc937:0 "제2차 세계 대전은 유네스코 설립을 촉진했으며, 교육, 과학, 문화를 통한 평화 구축을 목표로 했습니다."
 game_assistant_hoi4_general_text_scripted_loc938:0 "국제 난민 기구는 지속적인 난민 문제를 해결하기 위해 설립되었으며, 이후 UNHCR로 발전했습니다."
 game_assistant_hoi4_general_text_scripted_loc939:0 "제네바 협약은 1949년에 개정되어 민간인 보호 조항을 추가했으며, 이는 제2차 세계 대전의 공포에서 비롯된 직접적인 결과입니다."
 game_assistant_hoi4_general_text_scripted_loc940:0 "화학 및 생물 무기 금지 움직임은 전시 개발 및 사용에 따라 강화되었습니다."
 game_assistant_hoi4_general_text_scripted_loc941:0 "핵확산금지조약은 수년 후에야 체결되었지만, 폭탄의 그림자는 히로시마 이후로 계속 존재해 왔습니다."
 game_assistant_hoi4_general_text_scripted_loc942:0 "전후 평화 운동은 계속되었으며, 히로시마 평화 기념 공원이 그 상징이며 매년 추모식이 열립니다."
 game_assistant_hoi4_general_text_scripted_loc943:0 "영국의 '그레이트 판저드럼' 로켓 추진 폭발 바퀴와 하바쿠크 얼음 항공모함과 같은 전시 비밀 프로젝트는 기록 보관소에 호기심으로 남아 있습니다."
 game_assistant_hoi4_general_text_scripted_loc944:0 "나치 UFO 전설은 호르텐 비행 날개와 같은 실험 항공기에서 비롯되어 많은 도시 신화를 생성했습니다."
 game_assistant_hoi4_general_text_scripted_loc945:0 "히틀러 생존에 대한 음모론은 지속되지만, 역사가들은 그가 1945년 4월 30일에 자살했다고 확인합니다."
 game_assistant_hoi4_general_text_scripted_loc946:0 "'캐치-22', '벌거벗은 자와 죽은 자'와 같은 제2차 세계 대전 문학은 전쟁의 부조리와 잔혹성을 묘사합니다."
 game_assistant_hoi4_general_text_scripted_loc947:0 "'쉰들러 리스트', '라이언 일병 구하기'와 같은 영화는 제2차 세계 대전 기억의 문화적 전달자가 되었습니다."
 game_assistant_hoi4_general_text_scripted_loc948:0 "'릴리 마를레인'과 같은 전시 유행가는 양측 군인에게 영향을 미쳤으며, 전선을 넘어 불려졌습니다."
 game_assistant_hoi4_general_text_scripted_loc949:0 "구술 역사 프로젝트는 많은 참전용사의 기억을 기록하여 공식 역사를 수정하고 보강하는 중요한 자료를 제공했습니다."
 game_assistant_hoi4_general_text_scripted_loc950:0 "실종 군인의 유해는 DNA 기술을 사용하여 지속적으로 식별되고 있으며, 예를 들어 미국 국방부 포로/실종자 확인국이 있습니다."
 game_assistant_hoi4_general_text_scripted_loc951:0 "침몰한 전함은 전쟁 무덤으로 간주되며, 국가들은 약탈과 방해를 방지하기 위한 법률을 제정했습니다."
 game_assistant_hoi4_general_text_scripted_loc952:0 "이오지마의 터널 시스템에는 여전히 유해가 수습되지 않은 채 남아 있으며, 미일 합동 조사가 정기적으로 이루어집니다."
 game_assistant_hoi4_general_text_scripted_loc953:0 "외딴 태평양 섬에는 전차, 항공기 잔해, 활주로가 남아 있어 야외 역사 박물관을 형성하고 있습니다."
 game_assistant_hoi4_general_text_scripted_loc954:0 "제2차 세계 대전의 난파선과 항공기 잔해는 인공 산호초가 되어 다이빙 관광객을 끌어들입니다."
 game_assistant_hoi4_general_text_scripted_loc955:0 "전후 마셜 플랜은 성공적인 대외 원조의 모델이 되었으며, 또한 냉전 목표도 수행했습니다."
 game_assistant_hoi4_general_text_scripted_loc956:0 "미국 달러는 세계 지배적 통화이자 글로벌 군사 배치의 기초가 되었으며, 그 기원은 제2차 세계 대전 렌드리스 및 원조에서 찾을 수 있습니다."
 game_assistant_hoi4_general_text_scripted_loc957:0 "미국의 전후 글로벌 군사 주둔과 동맹 네트워크는 '팍스 아메리카나'의 토대를 마련했습니다."
 game_assistant_hoi4_general_text_scripted_loc958:0 "승리했음에도 불구하고 영국은 크게 약화되었고 제국은 해체되었으며, 1956년 수에즈 위기는 그 지위 하락을 입증했습니다."
 game_assistant_hoi4_general_text_scripted_loc959:0 "소련은 막대한 희생에도 불구하고 초강대국으로 부상하여 동유럽을 통제하고 혁명을 수출했습니다."
 game_assistant_hoi4_general_text_scripted_loc960:0 "제2차 세계 대전은 역사상 가장 치명적인 글로벌 분쟁으로 남아 있으며, 그 기억과 교훈은 계속해서 세상을 형성하고 있습니다."
 game_assistant_hoi4_general_text_scripted_loc961:0 "할힌골 전투의 경험은 주코프가 기계화 부대를 이용한 포위전을 발전시키는 계기가 되었으며, 이후 모스크바 인근 반격에 사용되었습니다."
 game_assistant_hoi4_general_text_scripted_loc962:0 "독일 침공 후, 소련은 유럽 지역의 많은 산업을 긴급히 우랄과 시베리아 동쪽으로 이전하여 군산 복합체를 보존했습니다."
 game_assistant_hoi4_general_text_scripted_loc963:0 "전시 극심한 식량 부족 상황에서 소련 과학자들은 나무 조각으로 효모를 배양하여 '인공 단백질'을 생산하는 방법을 개발했습니다."
 game_assistant_hoi4_general_text_scripted_loc964:0 "레닌그라드 포위전 중 살아남은 과학자들은 굶주리면서도 연구를 계속했으며, 귀중한 종자 은행을 보존했습니다."
 game_assistant_hoi4_general_text_scripted_loc965:0 "스탈린그라드에서 파블로프의 집은 강화된 소련 분대에 의해 58일 동안 방어되었으며, 이는 전체 프랑스 작전보다 더 긴 시간이었습니다."
 game_assistant_hoi4_general_text_scripted_loc966:0 "뱌지마-브랸스크 이중 포위전에서 소련 서부 및 예비 전선군은 거의 전멸했으며, 60만 명 이상의 병력을 잃었습니다."
 game_assistant_hoi4_general_text_scripted_loc967:0 "기밀 유지를 위해 소련의 공세 작전은 종종 지휘관 이니셜 조합으로 암호명을 붙였으며, 예를 들어 '바그라티온'이 있습니다."
 game_assistant_hoi4_general_text_scripted_loc968:0 "소련군은 보드카 병에 담은 화염병을 전차에 자주 던졌으며, 이후 독일군은 모든 보드카 병이 위협이 될 수 있다고 믿게 되었습니다."
 game_assistant_hoi4_general_text_scripted_loc969:0 "독일군은 첫 동부 전선 겨울의 공포를 경험했으며, 차량 윤활유는 굳어지고 소총 볼트는 얼어붙어 불을 피워 녹여야 했습니다."
 game_assistant_hoi4_general_text_scripted_loc970:0 "소련은 폭약을 실은 특수 훈련된 대전차견이 독일 전차 아래로 달려가게 하는 방식을 널리 사용했지만, 소련 디젤 엔진 소리와의 혼동으로 자가 손실을 입었습니다."
 game_assistant_hoi4_general_text_scripted_loc971:0 "쿠르스크 전투 전, 소련군은 지뢰밭에 일부러 통로를 남겨두고 허위 정보를 흘려 독일군의 공격을 사전에 조준된 살상 지대로 유인하는 데 성공했습니다."
 game_assistant_hoi4_general_text_scripted_loc972:0 "소련 정찰병은 정보 수집을 위해 독일군 후방에 자주 침투하여 '혀'(포로)를 잡아왔으며, 이는 극도로 위험한 작전이었습니다."
 game_assistant_hoi4_general_text_scripted_loc973:0 "스탈린그라드에서 독일 제6군이 포위된 후, 소련군은 폐허 위에 단조로운 똑딱거리는 소리를 방송하여 수비군의 의지를 꺾었습니다."
 game_assistant_hoi4_general_text_scripted_loc974:0 "동부 전선의 겨울 기온은 -40°C까지 떨어질 수 있었으며, 병사들의 소변은 몸을 떠나자마자 즉시 얼어붙어 피부에 즉시 동상을 입혔습니다."
 game_assistant_hoi4_general_text_scripted_loc975:0 "독일군은 후퇴하는 동안 초토화 작전을 펼쳐 우크라이나와 벨라루스에서 수천 개의 마을과 철도 노선을 파괴했습니다."
 game_assistant_hoi4_general_text_scripted_loc976:0 "소련 해군 보병 여단은 종종 줄무늬 텔냐시카 셔츠를 유지한 전직 선원들로 구성되었으며, 독일군 사이에서 두려움 없는 돌격으로 유명했습니다."
 game_assistant_hoi4_general_text_scripted_loc977:0 "독일군은 노획한 소련 PPSh 기관단총을 대용량 드럼 탄창과 신뢰성으로 인해 소중히 여겼으며, 독일어 설명서를 인쇄하기도 했습니다."
 game_assistant_hoi4_general_text_scripted_loc978:0 "소련 여성 전차장 마리야 옥탸브리스카야는 남편의 복수를 위해 직접 T-34를 구입했으며, 이후 소비에트 연방 영웅 칭호를 받았습니다."
 game_assistant_hoi4_general_text_scripted_loc979:0 "스탈린그라드 전투 중 일부 소련 저격수들은 혹한 속에서 숨을 내쉴 때 입김으로 위치가 노출되는 것을 막기 위해 사격 전에 한 입 가득 눈을 머금곤 했습니다."
 game_assistant_hoi4_general_text_scripted_loc980:0 "이동을 은폐하기 위해 소련군은 수백 킬로미터에 걸친 야간 행군을 수행했으며, 말에는 재갈을 물리고 바퀴에는 천을 감아 기습을 달성했습니다."
 game_assistant_hoi4_general_text_scripted_loc981:0 "하르코프를 두고 벌어진 백중세 전투에서 독일군은 소련의 과도한 진출을 이용하여 1943년 초봄에 성공적인 반격을 개시했으며, 이를 '백핸드 블로'라고 합니다."
 game_assistant_hoi4_general_text_scripted_loc982:0 "동부 전선에서 노획한 프랑스 와인이나 독일 소시지 한 병은 병사들에게 종종 훈장보다 더 환영받는 희귀한 사치품이었습니다."
 game_assistant_hoi4_general_text_scripted_loc983:0 "소련은 전쟁 기간 동안 약 50,000마리의 군용견을 통신, 지뢰 탐지, 대전차 공격용으로 훈련시켰습니다."
 game_assistant_hoi4_general_text_scripted_loc984:0 "북극권 내에서 극야와 극낮은 보급로에 영향을 미쳤으며, 무르만스크 항로의 연합군 호송선단은 독일 잠수함과 항공기의 반복적인 공격에 직면했습니다."
 game_assistant_hoi4_general_text_scripted_loc985:0 "바렌츠해 전투에서 소수의 영국 호위함이 연막과 탁월한 사격술을 사용하여 독일 중순양함 아드미랄 히퍼를 격퇴했습니다."
 game_assistant_hoi4_general_text_scripted_loc986:0 "동부 전선의 일부 구역에서는 짧고 자발적인 휴전이 발생했으며, 양측 병사들이 참호에서 나와 담배를 교환했지만, 즉시 상관에 의해 금지되었습니다."
 game_assistant_hoi4_general_text_scripted_loc987:0 "소련 요원들은 일반 설탕 덩어리로 위장한 설탕 큐브 폭발물을 사용하여 독일 장교를 암살했으며, 그런 덩어리를 움직이면 폭발했습니다."
 game_assistant_hoi4_general_text_scripted_loc988:0 "대게릴라전에서 독일 탐지견은 밀집된 숲과 늪에서 종종 실패했으며, 대신 빨치산의 매복에 걸려들었습니다."
 game_assistant_hoi4_general_text_scripted_loc989:0 "독일군은 후퇴하는 동안 소련의 진격을 늦추기 위해 광범위하게 S-지뢰(바운싱 베티)를 매설했으며, 작동 시 허리 높이까지 솟아오른 후 폭발하여 심각한 사상자를 냈습니다."
 game_assistant_hoi4_general_text_scripted_loc990:0 "'얼음 호수 전투' 동안 혹한으로 인해 많은 독일 차량이 얼음 위에 갇혀 큰 손실을 입었습니다."
 game_assistant_hoi4_general_text_scripted_loc991:0 "코네프의 대초원 전선군은 독일 전선을 돌파하는 동안 탐조등을 대량으로 사용하여 공격 시 적을 눈부시게 하고 혼란시켰습니다."
 game_assistant_hoi4_general_text_scripted_loc992:0 "소련은 전시에 장교와 병사에게 매일 100g의 보드카 배급을 지급했으며, 속칭 '인민위원회 100g'이라고 불렀습니다."
 game_assistant_hoi4_general_text_scripted_loc993:0 "궤도를 보충하기 위해 독일군은 점령지의 철도를 해체하여 빨치산이 폭파한 본선을 수리하는 데 자주 사용했습니다."
 game_assistant_hoi4_general_text_scripted_loc994:0 "벨라루스의 늪과 숲은 험난했으며, 바그라티온 작전 중 소련군은 비밀리에 통나무 도로를 깔아 전차가 이전에 통과할 수 없었던 지형을 횡단할 수 있게 했습니다."
 game_assistant_hoi4_general_text_scripted_loc995:0 "일부 소련 저격수는 시모노프 PTRS 대전차 소총을 사용하여 장거리에서 독일 벙커의 사격 총안과 관측소를 사격했습니다."
 game_assistant_hoi4_general_text_scripted_loc996:0 "독일 해군은 일부 대형 수상함에서 포를 제거하여 해안 요새에 장착하고 고정 포병으로 계속 사용했습니다."
 game_assistant_hoi4_general_text_scripted_loc997:0 "베를린 공격 중 소련군은 150mm 및 203mm 중곡사포를 거리로 직접 밀어 넣어 직접 사격으로 건물을 한 블록씩 파괴했습니다."
 game_assistant_hoi4_general_text_scripted_loc998:0 "소련-독일 전장에는 놀라운 수의 불발탄과 지뢰가 남아 있으며, 제거 작업은 수십 년 동안 지속되었고 사상자가 여전히 발생하고 있습니다."
 game_assistant_hoi4_general_text_scripted_loc999:0 "동프로이센 공세 중 소련군은 발트해까지 진격하여 많은 독일 난민과 군대를 차단했으며, 겨울 바다를 통한 대피는 해양 재난이 되었습니다."
 game_assistant_hoi4_general_text_scripted_loc1000:0 "소련군은 라이히스타크 벽에 수많은 서명과 구호를 낙서했으며, 이러한 승리의 흔적 중 일부는 오늘날까지 보존되어 있습니다."